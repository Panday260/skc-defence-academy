<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKC DEFENCE ACADEMY - SRT Mock Test 10</title>
<style>
:root{--navy:#0b2a5b;--navy2:#143d86;--saf:#ff9933;--grn:#138808;--bg:#f2f5fa;--card:#fff;--tx:#1b2433;--mut:#6b7686;--bd:#d9e0ec;--red:#d32f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Mangal","Nirmala UI",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--saf);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.hin{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid var(--saf);flex:none}
.brand{flex:1;min-width:150px}
.brand b{display:block;font-size:18px;letter-spacing:.5px}
.brand span{font-size:12px;opacity:.85}
.tools{display:flex;align-items:center;gap:8px}
.timer{background:#fff;color:var(--navy);font-weight:800;font-size:18px;padding:5px 12px;border-radius:8px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.timer.low{background:var(--red);color:#fff}
.btn{border:0;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--navy2);color:#fff}
.b-grn{background:var(--grn);color:#fff}
.b-saf{background:var(--saf);color:#222}
.b-out{background:#fff;color:var(--navy2);border:2px solid var(--navy2)}
.lang{display:flex;border-radius:8px;overflow:hidden;border:2px solid var(--saf)}
.lang button{border:0;background:transparent;color:#fff;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--saf);color:#222}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hide{display:none!important}
.start{max-width:640px;margin:20px auto;text-align:center}
.start h1{color:var(--navy);margin:6px 0}
.start ul{text-align:left;padding-left:20px}
.start input{width:100%;padding:12px;font-size:16px;border:2px solid var(--bd);border-radius:8px;margin:8px 0 14px;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:600}
.qtext{font-size:18px;font-weight:600;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#e8edf6;color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--navy2);background:#e9f0ff}
.opt.sel .l{background:var(--navy2);color:#fff}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nav .sp{flex:1}
.pal h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pg button{height:40px;border-radius:8px;border:2px solid var(--bd);background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.pg button.ans{background:var(--grn);border-color:var(--grn);color:#fff}
.pg button.vis{background:#ffe5e5;border-color:var(--red)}
.pg button.cur{outline:3px solid var(--saf);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;margin-top:12px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--bd)}
.ptog{display:none;width:100%;margin-bottom:10px}
.res{max-width:760px;margin:10px auto}
.res h2{text-align:center;color:var(--navy);margin:4px 0}
.score{text-align:center;font-size:46px;font-weight:800;color:var(--navy2);margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.st{border-radius:10px;padding:12px;text-align:center;background:#f2f5fa;border:1px solid var(--bd)}
.st b{display:block;font-size:24px}
.st span{font-size:12px;color:var(--mut)}
.rv{border-top:1px solid var(--bd);padding:12px 0}
.rv .q{font-weight:600;margin-bottom:6px}
.rv .o{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:15px;border:1px solid var(--bd)}
.rv .o.ok{background:#e3f5e1;border-color:var(--grn)}
.rv .o.no{background:#ffe5e5;border-color:var(--red)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:380px;width:100%;text-align:center}
footer{text-align:center;font-size:12px;color:var(--mut);padding:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.ptog{display:block}.pal{display:none}.pal.open{display:block}.qtext{font-size:17px}.brand b{font-size:15px}}
</style>
</head>
<body>
<header><div class="hin">
 <div class="logo">SKC</div>
 <div class="brand"><b>SKC DEFENCE ACADEMY</b><span id="ttl">SRT Test Series – Mock Test 10</span></div>
 <div class="tools">
  <div class="lang"><button id="bEn" class="on" onclick="setLang('en')">English</button><button id="bHi" onclick="setLang('hi')">हिन्दी</button></div>
  <div class="timer hide" id="timer">30:00</div>
 </div>
</div></header>

<main>
<section id="start" class="card start">
 <div class="logo" style="margin:0 auto;width:64px;height:64px;font-size:20px;background:var(--navy);color:#fff">SKC</div>
 <h1 id="sT">SRT Mock Test 10</h1>
 <p id="sSub" style="color:var(--mut);margin:0 0 10px">SKC DEFENCE ACADEMY</p>
 <ul id="sIns"></ul>
 <input id="nm" type="text" maxlength="40" autocomplete="name">
 <button class="btn b-grn" id="sBtn" onclick="startTest()" style="width:100%;font-size:17px"></button>
</section>

<section id="test" class="hide">
 <button class="btn b-out ptog" id="ptog" onclick="togPal()"></button>
 <div class="grid">
  <div class="card">
   <div class="qhead"><span id="qno"></span><span id="qsts"></span></div>
   <div class="qtext" id="qtext"></div>
   <div id="opts"></div>
   <div class="nav">
    <button class="btn b-out" id="prev" onclick="go(-1)"></button>
    <button class="btn b-saf" id="clr" onclick="clearAns()"></button>
    <span class="sp"></span>
    <button class="btn b-pri" id="next" onclick="go(1)"></button>
   </div>
   <div style="margin-top:14px"><button class="btn b-grn" id="sub" onclick="askSubmit()" style="width:100%"></button></div>
  </div>
  <div class="card pal" id="pal">
   <h3 id="palT"></h3>
   <div class="pg" id="pg"></div>
   <div class="leg">
    <span><i style="background:var(--grn)"></i><b id="lA"></b></span>
    <span><i style="background:#ffe5e5;border-color:var(--red)"></i><b id="lN"></b></span>
    <span><i style="background:#fff"></i><b id="lU"></b></span>
   </div>
  </div>
 </div>
</section>

<section id="result" class="hide"><div class="card res">
 <h2 id="rT"></h2>
 <div style="text-align:center;color:var(--mut)" id="rName"></div>
 <div class="score" id="rScore"></div>
 <div style="text-align:center;color:var(--mut);font-size:13px" id="rMark"></div>
 <div class="stats" id="rStats"></div>
 <div style="text-align:center"><button class="btn b-pri" id="rvBtn" onclick="toggleRev()"></button> <button class="btn b-out" onclick="location.reload()" id="rtBtn"></button></div>
 <div id="rev" class="hide" style="margin-top:12px"></div>
</div></section>
</main>
<footer>© SKC DEFENCE ACADEMY</footer>

<div class="modal hide" id="modal"><div class="card">
 <h3 id="mT" style="margin-top:0;color:var(--navy)"></h3>
 <p id="mB"></p>
 <div style="display:flex;gap:10px;justify-content:center"><button class="btn b-out" id="mNo" onclick="closeM()"></button><button class="btn b-grn" id="mYes" onclick="finish()"></button></div>
</div></div>

<script>
var TITLE_EN="SRT Test Series – Mock Test 10", TITLE_HI="एसआरटी टेस्ट सीरीज़ – मॉक टेस्ट 10";
var DURATION=30*60, PLUS=1, MINUS=0.25;
// [question EN, question HI, [A en, A hi], [B], [C], [D], correct index 0-3]
var Q=[
["You notice thick smoke coming from the engine of your moving passenger train.","आप अपने चलते हुए यात्री ट्रेन के इंजन से घना धुआं निकलते हुए देखते हैं।",
["You will instantly jump out blindly, aggressively run away fast, and completely save your life.","आप तुरंत आंख मूंदकर बाहर कूदेंगे, आक्रामक रूप से तेजी से भागेंगे, और पूरी तरह अपनी जान बचाएंगे।"],
["You will completely ignore the smoke, silently sit right there, and peacefully accept your fate.","आप धुएं को पूरी तरह नजरअंदाज करेंगे, चुपचाप बिल्कुल वहीं बैठेंगे, और शांति से अपनी नियति स्वीकार करेंगे।"],
["You will quickly pull the chain, safely evacuate the people, and firmly extinguish the fire.","आप जल्दी से चेन खींचेंगे, सुरक्षित रूप से लोगों को निकालेंगे, और दृढ़ता से आग बुझाएंगे।"],
["You will aggressively push the people, violently break the doors, and blindly escape the train.","आप आक्रामक रूप से लोगों को धक्का देंगे, हिंसक रूप से दरवाजे तोड़ेंगे, और आंख मूंदकर ट्रेन से भागेंगे।"],2],
["Your best friend is secretly losing heavy money in illegal online gambling apps.","आपका सबसे अच्छा दोस्त अवैध ऑनलाइन जुआ ऐप्स में चुपके से भारी पैसा हार रहा है।",
["You will firmly counsel him privately, strictly block the websites, and safely involve his family.","आप अकेले में उसे दृढ़ता से समझाएंगे, सख्ती से वेबसाइटों को ब्लॉक करेंगे, और सुरक्षित रूप से उसके परिवार को शामिल करेंगे।"],
["You will instantly join the gambling, happily share the profits, and secretly play the games.","आप तुरंत जुए में शामिल होंगे, खुशी-खुशी मुनाफा बांटेंगे, और चुपके से खेल खेलेंगे।"],
["You will aggressively beat him heavily, violently break his mobile, and permanently end the bond.","आप उसे आक्रामक रूप से भारी पीटेंगे, हिंसक रूप से उसका मोबाइल तोड़ेंगे, और स्थायी रूप से रिश्ता खत्म करेंगे।"],
["You will completely ignore the problem, silently mind your business, and blindly let him ruin.","आप समस्या को पूरी तरह नजरअंदाज करेंगे, चुपचाप अपने काम से काम रखेंगे, और आंख मूंदकर उसे बर्बाद होने देंगे।"],0],
["Your small boat hits a heavy rock and starts sinking in a deep lake.","आपकी छोटी नाव एक भारी चट्टान से टकराती है और गहरी झील में डूबने लगती है।",
["You will instantly start crying loudly, completely give up totally, and blindly drown right there.","आप तुरंत जोर-जोर से रोने लगेंगे, पूरी तरह से हार मान लेंगे, और आंख मूंदकर वहीं डूब जाएंगे।"],
["You will aggressively fight the boatman, violently break the paddles, and completely sink the boat.","आप आक्रामक रूप से नाविक से लड़ेंगे, हिंसक रूप से चप्पू तोड़ेंगे, और पूरी तरह से नाव डुबो देंगे।"],
["You will completely ignore the danger, silently close your eyes, and peacefully sleep right there.","आप खतरे को पूरी तरह नजरअंदाज करेंगे, चुपचाप अपनी आंखें बंद करेंगे, और शांति से वहीं सो जाएंगे।"],
["You will safely grab the lifejacket, calmly guide the friends, and smoothly swim towards land.","आप सुरक्षित रूप से लाइफजैकेट पकड़ेंगे, शांति से दोस्तों का मार्गदर्शन करेंगे, और आसानी से जमीन की ओर तैरेंगे।"],3],
["You clearly see a blind man unknowingly walking towards an open, deep manhole.","आप स्पष्ट रूप से एक अंधे व्यक्ति को अनजाने में एक खुले, गहरे मैनहोल की ओर चलते हुए देखते हैं।",
["You will completely ignore the blind, silently walk away fast, and strictly mind your business.","आप अंधे को पूरी तरह नजरअंदाज करेंगे, चुपचाप तेजी से चले जाएंगे, और सख्ती से अपने काम से काम रखेंगे।"],
["You will quickly run towards him, safely hold his hands, and smoothly guide him away.","आप जल्दी से उसकी ओर दौड़ेंगे, सुरक्षित रूप से उसके हाथ पकड़ेंगे, और आसानी से उसे दूर ले जाएंगे।"],
["You will instantly start laughing loudly, completely enjoy the scene, and blindly record a video.","आप तुरंत जोर-जोर से हंसने लगेंगे, पूरी तरह से दृश्य का आनंद लेंगे, और आंख मूंदकर एक वीडियो रिकॉर्ड करेंगे।"],
["You will aggressively throw heavy stones, violently shout at him, and heavily increase his fear.","आप आक्रामक रूप से भारी पत्थर फेंकेंगे, हिंसक रूप से उस पर चिल्लाएंगे, और भारी रूप से उसका डर बढ़ाएंगे।"],1],
["A fast biker suddenly snatches your expensive mobile phone in a very busy market.","एक तेज बाइकर बहुत व्यस्त बाजार में अचानक आपका महंगा मोबाइल फोन छीन लेता है।",
["You will instantly start crying loudly, completely sit right there, and blindly accept the loss.","आप तुरंत जोर-जोर से रोने लगेंगे, पूरी तरह से वहीं बैठ जाएंगे, और आंख मूंदकर नुकसान स्वीकार करेंगे।"],
["You will aggressively attack innocent people, violently break the shops, and loudly demand new phones.","आप आक्रामक रूप से निर्दोष लोगों पर हमला करेंगे, हिंसक रूप से दुकानें तोड़ेंगे, और जोर-जोर से नए फोन की मांग करेंगे।"],
["You will swiftly note the number, loudly shout for help, and firmly inform the police.","आप तेजी से नंबर नोट करेंगे, मदद के लिए जोर से चिल्लाएंगे, और दृढ़ता से पुलिस को सूचित करेंगे।"],
["You will completely ignore the huge theft, silently buy another phone, and strictly mind your business.","आप बड़ी चोरी को पूरी तरह नजरअंदाज करेंगे, चुपचाप दूसरा फोन खरीदेंगे, और सख्ती से अपने काम से काम रखेंगे।"],2],
["You discover highly expired emergency medicines kept actively inside your unit's main dispensary.","आपको अपनी यूनिट के मुख्य औषधालय में सक्रिय रूप से रखी हुई अत्यधिक एक्सपायर हो चुकी आपातकालीन दवाएं मिलती हैं।",
["You will instantly pack the medicines, safely dispose them properly, and firmly inform the commander.","आप तुरंत दवाओं को पैक करेंगे, सुरक्षित रूप से उन्हें ठीक से नष्ट करेंगे, और दृढ़ता से कमांडर को सूचित करेंगे।"],
["You will completely ignore the bad dates, silently take the medicines, and blindly risk your health.","आप खराब तारीखों को पूरी तरह नजरअंदाज करेंगे, चुपचाप दवाएं लेंगे, और आंख मूंदकर अपने स्वास्थ्य को जोखिम में डालेंगे।"],
["You will aggressively fight the duty doctor, violently break the glass, and loudly close the clinic.","आप आक्रामक रूप से ड्यूटी डॉक्टर से लड़ेंगे, हिंसक रूप से शीशा तोड़ेंगे, और जोर-जोर से क्लिनिक बंद कर देंगे।"],
["You will instantly start crying loudly, completely leave the military camp, and blindly run away far.","आप तुरंत जोर-जोर से रोने लगेंगे, पूरी तरह से सैन्य शिविर छोड़ देंगे, और आंख मूंदकर दूर भाग जाएंगे।"],0],
["Your junior team member heavily refuses to obey basic orders due to personal ego.","आपका जूनियर टीम सदस्य व्यक्तिगत अहंकार के कारण बुनियादी आदेशों का पालन करने से भारी इंकार करता है।",
["You will completely ignore his bad behavior, silently do his work, and strictly remain highly depressed.","आप उसके बुरे व्यवहार को पूरी तरह नजरअंदाज करेंगे, चुपचाप उसका काम करेंगे, और सख्ती से अत्यधिक उदास रहेंगे।"],
["You will aggressively slap his face, violently throw him outside, and loudly insult his family.","आप आक्रामक रूप से उसके चेहरे पर थप्पड़ मारेंगे, हिंसक रूप से उसे बाहर फेंक देंगे, और जोर-जोर से उसके परिवार का अपमान करेंगे।"],
["You will instantly start crying loudly, completely resign your high post, and blindly leave the office.","आप तुरंत जोर-जोर से रोने लगेंगे, पूरी तरह से अपने उच्च पद से इस्तीफा दे देंगे, और आंख मूंदकर कार्यालय छोड़ देंगे।"],

hi:{sT:"एसआरटी मॉक टेस्ट 10",ins:["कुल प्रश्न: 35 | समय: 30 मिनट","सही उत्तर: +1 अंक | गलत उत्तर: −0.25 अंक | बिना उत्तर: 0","किसी भी प्रश्न पर जाने के लिए पैलेट में प्रश्न संख्या दबाएँ","आप कभी भी अंग्रेज़ी और हिन्दी भाषा बदल सकते हैं","आप कभी भी टेस्ट सबमिट कर सकते हैं; समय समाप्त होने पर टेस्ट अपने आप सबमिट हो जाएगा"],name:"अपना नाम लिखें (वैकल्पिक)",start:"टेस्ट शुरू करें",q:"प्रश्न",of:"/",prev:"« पिछला",next:"अगला »",clr:"उत्तर हटाएँ",sub:"टेस्ट सबमिट करें",pal:"प्रश्न कंसोल",pg:"प्रश्न कंसोल दिखाएँ / छिपाएँ",lA:"उत्तर दिया",lN:"उत्तर नहीं दिया",lU:"देखा नहीं",mT:"टेस्ट सबमिट करें?",mB:function(a,s){return "आपने "+a+" प्रश्नों के उत्तर दिए हैं और "+s+" प्रश्न छोड़े हैं। क्या आप सबमिट करना चाहते हैं?"},mNo:"रद्द करें",mYes:"हाँ, सबमिट करें",rT:"टेस्ट परिणाम",tot:"कुल स्कोर",mk:"अंकन: सही +1, गलत −0.25",att:"प्रयास किए",skp:"छोड़े गए",cor:"सही",wro:"गलत",tq:"कुल प्रश्न",neg:"ऋणात्मक अंक",rv:"उत्तर देखें",hv:"उत्तर छिपाएँ",rt:"दोबारा टेस्ट दें",ok:"सही",no:"गलत",sk:"छोड़ा गया",ca:"सही उत्तर",ya:"आपका उत्तर"}
};
var lang="en",cur=0,ans=[],vis=[],endAt=0,tick=null,done=false,L="ABCD";
function $(id){return document.getElementById(id)}
function t(k){return T[lang][k]}
function pad(n){return n<10?"0"+n:""+n}
function fmt(n){return (Math.round(n*100)/100).toString()}

function applyStatic(){
 $("ttl").textContent=lang==="en"?TITLE_EN:TITLE_HI;
 $("sT").textContent=lang==="en"?TITLE_EN:TITLE_HI;
 $("sIns").innerHTML=t("ins").map(function(x){return "<li>"+x+"</li>"}).join("");
 $("nm").placeholder=t("name");$("sBtn").textContent=t("start");
 $("prev").textContent=t("prev");$("next").textContent=t("next");$("clr").textContent=t("clr");$("sub").textContent=t("sub");
 $("palT").textContent=t("pal");$("ptog").textContent=t("pg");
 $("lA").textContent=t("lA");$("lN").textContent=t("lN");$("lU").textContent=t("lU");
 $("mNo").textContent=t("mNo");$("mYes").textContent=t("mYes");$("mT").textContent=t("mT");
 document.documentElement.lang=lang==="en"?"en":"hi";
 $("bEn").className=lang==="en"?"on":"";$("bHi").className=lang==="hi"?"on":"";
}
function setLang(l){
 lang=l;applyStatic();
 if(!$("test").classList.contains("hide"))render();
 if(!$("result").classList.contains("hide"))showResult();
 if(!$("modal").classList.contains("hide"))openM();
}
function startTest(){
 for(var i=0;i<Q.length;i++){ans[i]=-1;vis[i]=false}
 $("start").classList.add("hide");$("test").classList.remove("hide");$("timer").classList.remove("hide");
 endAt=Date.now()+DURATION*1000;
 tick=setInterval(upd,500);upd();render();
 window.scrollTo(0,0);
}
function upd(){
 var s=Math.max(0,Math.round((endAt-Date.now())/1000));
 $("timer").textContent=pad(Math.floor(s/60))+":"+pad(s%60);
 if(s<=300)$("timer").className="timer low";
 if(s<=0&&!done)finish();
}
function render(){
 vis[cur]=true;var q=Q[cur],i=lang==="en"?0:1;
 $("qno").textContent=t("q")+" "+(cur+1)+" "+t("of")+" "+Q.length;
 $("qsts").textContent=ans[cur]>=0?"✔ "+t("lA"):"";
 $("qtext").textContent=(cur+1)+". "+q[i];
 var h="";
 for(var k=0;k<4;k++){h+='<button class="opt'+(ans[cur]===k?" sel":"")+'" onclick="pick('+k+')"><span class="l">'+L[k]+'</span><span>'+esc(q[2+k][i])+'</span></button>'}
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===Q.length-1;
 pal();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pal(){
 var h="";
 for(var i=0;i<Q.length;i++){
  var c=ans[i]>=0?"ans":(vis[i]?"vis":"");
  if(i===cur)c+=" cur";
  h+='<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
 }
 $("pg").innerHTML=h;
}
function pick(k){ans[cur]=k;render()}
function clearAns(){ans[cur]=-1;render()}
function go(d){var n=cur+d;if(n>=0&&n<Q.length){cur=n;render();window.scrollTo(0,0)}}
function jump(i){cur=i;render();$("pal").classList.remove("open");window.scrollTo(0,0)}
function togPal(){$("pal").classList.toggle("open")}
function counts(){var a=0;for(var i=0;i<ans.length;i++)if(ans[i]>=0)a++;return {a:a,s:Q.length-a}}
function openM(){var c=counts();$("mB").textContent=t("mB")(c.a,c.s);$("modal").classList.remove("hide")}
function askSubmit(){openM()}
function closeM(){$("modal").classList.add("hide")}
function finish(){
 if(done&&arguments.length===0&&$("test").classList.contains("hide"))return;
 done=true;clearInterval(tick);closeM();
 $("test").classList.add("hide");$("timer").classList.add("hide");$("result").classList.remove("hide");
 showResult();window.scrollTo(0,0);
}
function showResult(){
 var cor=0,wro=0,i;
 for(i=0;i<Q.length;i++){if(ans[i]>=0){if(ans[i]===Q[i][6])cor++;else wro++}}
 var att=cor+wro,skp=Q.length-att,neg=wro*MINUS,sc=cor*PLUS-neg;
 $("rT").textContent=t("rT");
 var nm=$("nm").value.replace(/^\s+|\s+$/g,"");
 $("rName").textContent=nm?nm:"";
 $("rScore").textContent=fmt(sc)+" / "+Q.length;
 $("rMark").textContent=t("mk");
 var items=[[t("tq"),Q.length,""],[t("att"),att,""],[t("skp"),skp,""],[t("cor"),cor,"color:#138808"],[t("wro"),wro,"color:#d32f2f"],[t("neg"),"−"+fmt(neg),"color:#d32f2f"]];
 $("rStats").innerHTML=items.map(function(x){return '<div class="st"><b style="'+x[2]+'">'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("");
 $("rvBtn").textContent=$("rev").classList.contains("hide")?t("rv"):t("hv");
 $("rtBtn").textContent=t("rt");
 var li=lang==="en"?0:1,h="";
 for(i=0;i<Q.length;i++){
  var q=Q[i],st=ans[i]<0?["sk","#6b7686"]:(ans[i]===q[6]?["ok","#138808"]:["no","#d32f2f"]);
  h+='<div class="rv"><div class="q">'+(i+1)+'. '+esc(q[li])+'<span class="tag" style="background:'+st[1]+'">'+t(st[0])+'</span></div>';
  for(var k=0;k<4;k++){
   var c="o";if(k===q[6])c+=" ok";else if(k===ans[i])c+=" no";
   var m=k===q[6]?" ✔":(k===ans[i]?" ✘ ("+t("ya")+")":"");
   h+='<div class="'+c+'"><b>'+L[k]+'.</b> '+esc(q[2+k][li])+m+'</div>';
  }
  h+='</div>';
 }
 $("rev").innerHTML=h;
}
function toggleRev(){$("rev").classList.toggle("hide");showResult()}
window.addEventListener("beforeunload",function(e){if(!done&&!$("test").classList.contains("hide")){e.preventDefault();e.returnValue=""}});
applyStatic();
</script>
</body>
</html>
