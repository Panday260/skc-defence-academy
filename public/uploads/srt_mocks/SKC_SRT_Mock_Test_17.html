var CR=["You will instantly start crying in deep extreme panic, completely freeze perfectly exactly right there, and blindly wait perfectly strictly.","आप तुरंत गहरे अत्यधिक घबराहट में रोने लगेंगे, पूरी तरह से बिल्कुल वहीं सुन्न हो जाएंगे, और आंख मूंदकर बिल्कुल सख्ती से इंतजार करेंगे।"];
var Q=[
["A family member constantly interrupts you strictly while you are speaking actively in serious discussions.","एक परिवार का सदस्य गंभीर चर्चाओं में सक्रिय रूप से बोलते समय आपको लगातार सख्ती से टोकता है।",[AG,["You will calmly pause your current active speech peacefully, politely request your proper speaking turn directly, and firmly express your complete valid thoughts clearly.","आप शांति से अपने वर्तमान सक्रिय भाषण को शांतिपूर्वक रोकेंगे, विनम्रतापूर्वक सीधे अपनी उचित बोलने की बारी का अनुरोध करेंगे, और दृढ़ता से अपने पूर्ण वैध विचारों को स्पष्ट रूप से व्यक्त करेंगे।"],CR,IG],1],
["You find out your favorite local street food vendor actively uses highly unhygienic dirty water.","आपको पता चलता है कि आपका पसंदीदा स्थानीय स्ट्रीट फूड विक्रेता सक्रिय रूप से अत्यधिक अस्वच्छ गंदे पानी का उपयोग करता है।",[AG,IG,["You will firmly stop eating his unhygienic food completely, calmly warn the other regular customers directly, and safely report the severe health hazard officially.","आप दृढ़ता से उसका अस्वच्छ भोजन खाना पूरी तरह बंद कर देंगे, शांति से अन्य नियमित ग्राहकों को सीधे चेतावनी देंगे, और सुरक्षित रूप से गंभीर स्वास्थ्य खतरे की आधिकारिक रिपोर्ट करेंगे।"],CR],2],
["A coworker regularly takes your personal stationery items perfectly without asking properly or returning them.","एक सहकर्मी नियमित रूप से बिना ठीक से पूछे या लौटाए आपकी व्यक्तिगत स्टेशनरी वस्तुओं को ले लेता है।",[["You will calmly secure your personal desk items safely, politely confront the careless office coworker directly, and firmly demand the immediate safe return properly.","आप शांति से अपने व्यक्तिगत डेस्क आइटम सुरक्षित करेंगे, विनम्रतापूर्वक सीधे लापरवाह कार्यालय सहकर्मी का सामना करेंगे, और दृढ़ता से तत्काल सुरक्षित वापसी की ठीक से मांग करेंगे।"],IG,AG,CR],0],
["Your close friend strictly demands that you fully support them exactly in a wrong argument.","आपका करीबी दोस्त सख्ती से मांग करता है कि आप गलत बहस में उनका पूरी तरह समर्थन करें।",[IG,CR,AG,["You will calmly analyze the exact current situation properly, firmly refuse to support illegal actions strictly, and politely explain the correct ethical path clearly.","आप शांति से सटीक वर्तमान स्थिति का ठीक से विश्लेषण करेंगे, दृढ़ता से अवैध कार्यों का समर्थन करने से सख्ती से इंकार करेंगे, और विनम्रतापूर्वक सही नैतिक मार्ग को स्पष्ट रूप से समझाएंगे।"]],3],
["You are waiting for a bus and a passing car heavily splashes muddy puddle water.","आप बस का इंतजार कर रहे हैं और एक गुजरती कार भारी मटमैला पानी उछाल देती है।",[AG,["You will calmly wipe the dirty muddy water safely, safely note the fast car number properly, and firmly return to change your clothes completely.","आप शांति से गंदे मटमैले पानी को सुरक्षित रूप से पोंछेंगे, सुरक्षित रूप से तेज कार का नंबर ठीक से नोट करेंगे, और दृढ़ता से अपने कपड़े पूरी तरह बदलने के लिए लौटेंगे।"],CR,IG],1],
["An aggressive stray monkey suddenly steals your grocery bag containing highly expensive fresh juicy fruits.","एक आक्रामक आवारा बंदर अचानक अत्यधिक महंगे ताजे रसीले फलों वाली आपकी किराने की थैली चुरा लेता है।",[AG,IG,CR,["You will safely maintain a perfectly secure distance entirely, calmly let the aggressive wild animal pass, and firmly protect your remaining heavy bags properly.","आप सुरक्षित रूप से पूरी तरह एक सुरक्षित दूरी बनाए रखेंगे, शांति से आक्रामक जंगली जानवर को गुजरने देंगे, और दृढ़ता से अपने शेष भारी बैग की ठीक से रक्षा करेंगे।"]],3],
["You accidentally step on someone's foot heavily precisely inside a highly crowded local metro train.","आप गलती से एक अत्यधिक भीड़भाड़ वाली लोकल मेट्रो ट्रेन के अंदर किसी के पैर पर भारी कदम रख देते हैं।",[AG,CR,["You will instantly offer a highly sincere apology politely, calmly ensure the injured passenger feels alright, and safely stand carefully holding the strong rails.","आप तुरंत विनम्रतापूर्वक एक अत्यधिक ईमानदार माफी की पेशकश करेंगे, शांति से सुनिश्चित करेंगे कि घायल यात्री ठीक महसूस कर रहा है, और सुरक्षित रूप से मजबूत रेलिंग को पकड़कर सावधानी से खड़े होंगे।"],IG],2],
["Your booked cab driver forcefully demands extra heavy cash directly above the app's estimated fare.","आपका बुक किया गया कैब ड्राइवर ऐप के अनुमानित किराए से सीधे ऊपर अतिरिक्त भारी नकदी की बलपूर्वक मांग करता है।",[["You will firmly refuse the illegal extra payment strictly, calmly pay the exact digital fare properly, and safely report the rude driver officially instantly.","आप दृढ़ता से अवैध अतिरिक्त भुगतान से सख्ती से इंकार करेंगे, शांति से सटीक डिजिटल किराया ठीक से चुकाएंगे, और सुरक्षित रूप से असभ्य ड्राइवर की तुरंत आधिकारिक रिपोर्ट करेंगे।"],AG,CR,IG],0],
["A distant relative unexpectedly visits your private house perfectly for a week without prior notice.","एक दूर का रिश्तेदार बिना किसी पूर्व सूचना के एक सप्ताह के लिए अप्रत्याशित रूप से आपके निजी घर आता है।",[CR,IG,["You will calmly welcome the visiting distant relative politely, safely adjust the daily household routines properly, and firmly discuss the future prior notices clearly.","आप शांति से आने वाले दूर के रिश्तेदार का विनम्रतापूर्वक स्वागत करेंगे, सुरक्षित रूप से दैनिक घरेलू दिनचर्या को ठीक से समायोजित करेंगे, और दृढ़ता से भविष्य के पूर्व नोटिस पर स्पष्ट रूप से चर्चा करेंगे।"],AG],2],
["You notice a local shopkeeper physically beating a small innocent child for allegedly stealing candy.","आप एक स्थानीय दुकानदार को कथित तौर पर कैंडी चुराने के आरोप में एक छोटे मासूम बच्चे को शारीरिक रूप से पीटते हुए देखते हैं।",[AG,IG,["You will firmly stop the brutal physical abuse instantly, safely rescue the small crying child completely, and promptly inform the local police authorities strictly.","आप दृढ़ता से क्रूर शारीरिक शोषण को तुरंत रोकेंगे, सुरक्षित रूप से छोटे रोते हुए बच्चे को पूरी तरह बचाएंगे, और तुरंत स्थानीय पुलिस अधिकारियों को सख्ती से सूचित करेंगे।"],CR],2],
["A gym trainer heavily forces you to buy highly expensive unverified health supplements from him.","एक जिम ट्रेनर आपको उससे अत्यधिक महंगे असत्यापित स्वास्थ्य सप्लीमेंट खरीदने के लिए भारी मजबूर करता है।",[CR,AG,IG,["You will firmly decline the illegal health supplements strictly, calmly consult a certified medical doctor properly, and safely complain to the main gym manager.","आप दृढ़ता से अवैध स्वास्थ्य सप्लीमेंट को सख्ती से अस्वीकार करेंगे, शांति से प्रमाणित चिकित्सक से ठीक से परामर्श करेंगे, और सुरक्षित रूप से मुख्य जिम प्रबंधक से शिकायत करेंगे।"]],3],
["Your younger sibling secretly takes your expensive fast bike and heavily gets a traffic challan.","आपका छोटा भाई/बहन चुपके से आपकी महंगी तेज बाइक ले जाता है और उसे भारी ट्रैफिक चालान मिलता है।",[CR,AG,IG,["You will calmly confiscate the original bike keys safely, firmly demand the complete challan payment strictly, and politely counsel about severe legal safety rules.","आप शांति से मूल बाइक की चाबियां सुरक्षित रूप से जब्त करेंगे, दृढ़ता से पूर्ण चालान भुगतान की सख्ती से मांग करेंगे, और विनम्रतापूर्वक गंभीर कानूनी सुरक्षा नियमों के बारे में सलाह देंगे।"]],3],
["A noisy neighbor constantly throws their dirty house garbage right next to your boundary wall.","एक शोर करने वाला पड़ोसी लगातार अपने घर का गंदा कचरा आपकी चारदीवारी के ठीक बगल में फेंकता है।",[AG,IG,CR,["You will calmly gather the strong photographic evidence properly, politely confront the highly careless neighbor directly, and firmly involve the local municipal authorities strictly.","आप शांति से मजबूत फोटोग्राफिक साक्ष्य ठीक से इकट्ठा करेंगे, विनम्रतापूर्वक अत्यधिक लापरवाह पड़ोसी का सीधे सामना करेंगे, और दृढ़ता से स्थानीय नगर निगम अधिकारियों को सख्ती से शामिल करेंगे।"]],3],
["You find an injured severely bleeding stray puppy hiding perfectly under your securely parked car.","आपको अपनी सुरक्षित खड़ी कार के नीचे एक घायल गंभीर रूप से खून बह रहा आवारा पिल्ला पूरी तरह छिपा हुआ मिलता है।",[AG,IG,["You will safely pull the injured puppy outside gently, calmly provide the basic emergency first aid, and promptly take the poor animal to hospitals.","आप सुरक्षित रूप से घायल पिल्ले को धीरे से बाहर निकालेंगे, शांति से बुनियादी आपातकालीन प्राथमिक उपचार प्रदान करेंगे, और तुरंत गरीब जानवर को अस्पतालों में ले जाएंगे।"],CR],2],

function pick(j){A[cur]=j;render()}
function clr(){A[cur]=-1;render()}
function go(d){cur=Math.max(0,Math.min(N-1,cur+d));render();window.scrollTo(0,0)}
function jump(j){cur=j;render();window.scrollTo(0,0)}
function toggleLang(){L=L?0:1;document.documentElement.lang=L?"hi":"en";render();if(done)showResult()}
function askSubmit(){
 var a=0;for(var j=0;j<N;j++)if(A[j]>-1)a++;
 $("ovt").textContent=t("ot");
 $("ovp").textContent=t("answered")+": "+a+" | "+t("left")+": "+(N-a)+". "+t("sure");
 $("ovno").textContent=t("cancel");$("ovyes").textContent=t("submit");
 $("ov").style.display="flex";
}
function closeOv(){$("ov").style.display="none"}
var endAt=Date.now()+TOTAL*1000,tick;
function upd(){
 var s=Math.max(0,Math.round((endAt-Date.now())/1000));
 var m=Math.floor(s/60),r=s%60;
 $("timer").textContent=(m<10?"0":"")+m+":"+(r<10?"0":"")+r;
 if(s<=300)$("timer").className="low";
 if(s<=0){finish()}
}
tick=setInterval(upd,500);
function finish(){
 if(done)return;done=true;clearInterval(tick);closeOv();
 $("test").style.display="none";$("timer").style.display="none";
 $("result").style.display="block";showResult();window.scrollTo(0,0);
}
function showResult(){
 var c=0,w=0,s=0,j;
 for(j=0;j<N;j++){if(A[j]<0)s++;else if(A[j]===Q[j][3])c++;else w++}
 var sc=c-w*0.25,hi=L===1;
 var h='<div class="card"><div style="text-align:center;font-weight:700;color:#0b2447">SKC DEFENCE ACADEMY</div>'+
 '<div class="score">'+sc.toFixed(2)+' / '+N+'</div><div style="text-align:center">'+(hi?'कुल स्कोर':'Total Score')+'</div>'+
 '<div class="stats"><div><b>'+N+'</b>'+(hi?'कुल प्रश्न':'Total Questions')+'</div><div><b>'+(c+w)+'</b>'+(hi?'प्रयास किए':'Attempted')+'</div><div><b>'+s+'</b>'+(hi?'छोड़े गए':'Skipped')+'</div><div><b style="color:#2a9d4a">'+c+'</b>'+(hi?'सही (+1)':'Correct (+1)')+'</div><div><b style="color:#d62828">'+w+'</b>'+(hi?'गलत (−0.25)':'Wrong (−0.25)')+'</div></div></div>'+
 '<div class="card"><b>'+(hi?'उत्तर समीक्षा':'Answer Review')+'</b>';
 for(j=0;j<N;j++){
  var q=Q[j],st=A[j]<0?'s':(A[j]===q[3]?'c':'w');
  h+='<div class="rv '+st+'"><b>Q'+(START+j)+'.</b> '+esc(q[L])+'<br>'+
  (hi?'आपका उत्तर: ':'Your answer: ')+(A[j]<0?(hi?'छोड़ा गया':'Skipped'):"ABCD".charAt(A[j])+') '+esc(q[2][A[j]][L]))+'<br>'+
  '<b>'+(hi?'सही उत्तर: ':'Correct answer: ')+"ABCD".charAt(q[3])+') '+esc(q[2][q[3]][L])+'</b></div>';
 }
 h+='</div><div style="text-align:center"><button style="background:#ffc933;color:#0b2447" onclick="toggleLang()">'+t("lang")+'</button> <button style="background:#0b2447;color:#fff" onclick="location.reload()">'+(hi?'दोबारा दें':'Retake Test')+'</button></div>';
 $("result").innerHTML=h;
}
render();
</script>
</body>
</html>
