<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKC DEFENCE ACADEMY - SRT Mock Test 42</title>
<style>
:root{--navy:#0b2a5b;--navy2:#143d86;--saf:#ff9933;--grn:#138808;--bg:#f2f5fa;--card:#fff;--tx:#1b2433;--mut:#6b7686;--bd:#d9e0ec;--red:#d32f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Mangal","Nirmala UI",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--saf);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.hin{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid var(--saf);flex:none}
.brand{flex:1;min-width:150px}
.brand b{display:block;font-size:18px;letter-spacing:.5px}
.brand span{font-size:12px;opacity:.85}
.tools{display:flex;align-items:center;gap:8px}
.timer{background:#fff;color:var(--navy);font-weight:800;font-size:18px;padding:5px 12px;border-radius:8px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.timer.low{background:var(--red);color:#fff}
.btn{border:0;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--navy2);color:#fff}
.b-grn{background:var(--grn);color:#fff}
.b-saf{background:var(--saf);color:#222}
.b-out{background:#fff;color:var(--navy2);border:2px solid var(--navy2)}
.lang{display:flex;border-radius:8px;overflow:hidden;border:2px solid var(--saf)}
.lang button{border:0;background:transparent;color:#fff;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--saf);color:#222}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hide{display:none!important}
.start{max-width:640px;margin:20px auto;text-align:center}
.start h1{color:var(--navy);margin:6px 0}
.start ul{text-align:left;padding-left:20px}
.start input{width:100%;padding:12px;font-size:16px;border:2px solid var(--bd);border-radius:8px;margin:8px 0 14px;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:600}
.qtext{font-size:18px;font-weight:600;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#e8edf6;color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--navy2);background:#e9f0ff}
.opt.sel .l{background:var(--navy2);color:#fff}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nav .sp{flex:1}
.pal h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pg button{height:40px;border-radius:8px;border:2px solid var(--bd);background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.pg button.ans{background:var(--grn);border-color:var(--grn);color:#fff}
.pg button.vis{background:#ffe5e5;border-color:var(--red)}
.pg button.cur{outline:3px solid var(--saf);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;margin-top:12px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--bd)}
.ptog{display:none;width:100%;margin-bottom:10px}
.res{max-width:760px;margin:10px auto}
.res h2{text-align:center;color:var(--navy);margin:4px 0}
.score{text-align:center;font-size:46px;font-weight:800;color:var(--navy2);margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.st{border-radius:10px;padding:12px;text-align:center;background:#f2f5fa;border:1px solid var(--bd)}
.st b{display:block;font-size:24px}
.st span{font-size:12px;color:var(--mut)}
.rv{border-top:1px solid var(--bd);padding:12px 0}
.rv .q{font-weight:600;margin-bottom:6px}
.rv .o{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:15px;border:1px solid var(--bd)}
.rv .o.ok{background:#e3f5e1;border-color:var(--grn)}
.rv .o.no{background:#ffe5e5;border-color:var(--red)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:380px;width:100%;text-align:center}
footer{text-align:center;font-size:12px;color:var(--mut);padding:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.ptog{display:block}.pal{display:none}.pal.open{display:block}.qtext{font-size:17px}.brand b{font-size:15px}}
</style>
</head>
<body>
<header><div class="hin">
 <div class="logo">SKC</div>
 <div class="brand"><b>SKC DEFENCE ACADEMY</b><span id="ttl">SRT Test Series – Mock Test 42</span></div>
 <div class="tools">
  <div class="lang"><button id="bEn" class="on" onclick="setLang('en')">English</button><button id="bHi" onclick="setLang('hi')">हिन्दी</button></div>
  <div class="timer hide" id="timer">30:00</div>
 </div>
</div></header>

<main>
<section id="start" class="card start">
 <div class="logo" style="margin:0 auto;width:64px;height:64px;font-size:20px;background:var(--navy);color:#fff">SKC</div>
 <h1 id="sT">SRT Mock Test 42</h1>
 <p id="sSub" style="color:var(--mut);margin:0 0 10px">SKC DEFENCE ACADEMY</p>
 <ul id="sIns"></ul>
 <input id="nm" type="text" maxlength="40" autocomplete="name">
 <button class="btn b-grn" id="sBtn" onclick="startTest()" style="width:100%;font-size:17px"></button>
</section>

<section id="test" class="hide">
 <button class="btn b-out ptog" id="ptog" onclick="togPal()"></button>
 <div class="grid">
  <div class="card">
   <div class="qhead"><span id="qno"></span><span id="qsts"></span></div>
   <div class="qtext" id="qtext"></div>
   <div id="opts"></div>
   <div class="nav">
    <button class="btn b-out" id="prev" onclick="go(-1)"></button>
    <button class="btn b-saf" id="clr" onclick="clearAns()"></button>
    <span class="sp"></span>
    <button class="btn b-pri" id="next" onclick="go(1)"></button>
   </div>
   <div style="margin-top:14px"><button class="btn b-grn" id="sub" onclick="askSubmit()" style="width:100%"></button></div>
  </div>
  <div class="card pal" id="pal">
   <h3 id="palT"></h3>
   <div class="pg" id="pg"></div>
   <div class="leg">
    <span><i style="background:var(--grn)"></i><b id="lA"></b></span>
    <span><i style="background:#ffe5e5;border-color:var(--red)"></i><b id="lN"></b></span>
    <span><i style="background:#fff"></i><b id="lU"></b></span>
   </div>
  </div>
 </div>
</section>

<section id="result" class="hide"><div class="card res">
 <h2 id="rT"></h2>
 <div style="text-align:center;color:var(--mut)" id="rName"></div>
 <div class="score" id="rScore"></div>
 <div style="text-align:center;color:var(--mut);font-size:13px" id="rMark"></div>
 <div class="stats" id="rStats"></div>
 <div style="text-align:center"><button class="btn b-pri" id="rvBtn" onclick="toggleRev()"></button> <button class="btn b-out" onclick="location.reload()" id="rtBtn"></button></div>
 <div id="rev" class="hide" style="margin-top:12px"></div>
</div></section>
</main>
<footer>© SKC DEFENCE ACADEMY</footer>

<div class="modal hide" id="modal"><div class="card">
 <h3 id="mT" style="margin-top:0;color:var(--navy)"></h3>
 <p id="mB"></p>
 <div style="display:flex;gap:10px;justify-content:center"><button class="btn b-out" id="mNo" onclick="closeM()"></button><button class="btn b-grn" id="mYes" onclick="finish()"></button></div>
</div></div>

<script>
var TITLE_EN="SRT Test Series – Mock Test 42", TITLE_HI="एसआरटी टेस्ट सीरीज़ – मॉक टेस्ट 42";
var DURATION=30*60, PLUS=1, MINUS=0.25;
// [question EN, question HI, [A en, A hi], [B], [C], [D], correct index 0-3]
var Q=[
["Your boss publicly accuses you of stealing office funds, even though you are completely innocent.", "आपका बॉस सार्वजनिक रूप से आप पर कार्यालय के फंड चुराने का आरोप लगाता है, भले ही आप पूरी तरह से निर्दोष हैं।", ["Argue loudly with the boss in front of everyone to defend your pride and threaten to leave the job.", "अपने स्वाभिमान की रक्षा के लिए सबके सामने बॉस से जोर-जोर से बहस करेंगे और नौकरी छोड़ने की धमकी देंगे।"], ["Break down in tears, plead your innocence, and beg the management not to fire you.", "फूट-फूट कर रोएंगे, अपनी बेगुनाही की गुहार लगाएंगे और प्रबंधन से आपको नौकरी से न निकालने की भीख मांगेंगे।"], ["Demand a formal audit of the accounts and cooperate fully with the investigation to clear your name.", "खातों के औपचारिक ऑडिट की मांग करेंगे और अपना नाम साफ करने के लिए जांच में पूरा सहयोग करेंगे।"], ["Resign immediately and leave the office to avoid further public humiliation and stress.", "आगे के सार्वजनिक अपमान और तनाव से बचने के लिए तुरंत इस्तीफा देंगे और कार्यालय छोड़ देंगे।"], 2],
["Your best friend spreads a dirty rumor about you in the office just to get a promotion you both wanted.", "आपका सबसे अच्छा दोस्त उस प्रमोशन को पाने के लिए ऑफिस में आपके बारे में एक गंदी अफवाह फैलाता है जो आप दोनों चाहते थे।", ["Confront the friend privately, cut all personal ties with them, and focus entirely on your own performance.", "निजी तौर पर दोस्त का सामना करेंगे, उनसे सभी व्यक्तिगत संबंध तोड़ लेंगे, और पूरी तरह से अपने प्रदर्शन पर ध्यान केंद्रित करेंगे।"], ["Start spreading even worse rumors about their personal life to ruin their chances of getting promoted.", "प्रमोशन पाने की उनकी संभावनाओं को बर्बाद करने के लिए उनके निजी जीवन के बारे में और भी बदतर अफवाहें फैलाना शुरू कर देंगे।"], ["Feel deeply betrayed, lose focus on your work, and consider applying for a transfer to another department.", "बहुत ज्यादा धोखा महसूस करेंगे, अपने काम से ध्यान हटा लेंगे, और दूसरे विभाग में तबादले के लिए आवेदन करने पर विचार करेंगे।"], ["Forgive them silently because you don't want to lose a long-time friendship over a corporate job.", "उन्हें चुपचाप माफ कर देंगे क्योंकि आप कॉर्पोरेट नौकरी के लिए लंबे समय की दोस्ती नहीं खोना चाहते हैं।"], 0],
["You fail your final year college exams despite studying day and night for the last six months.", "पिछले छह महीनों तक दिन-रात अध्ययन करने के बावजूद आप अपने अंतिम वर्ष की कॉलेज परीक्षा में फेल हो जाते हैं।", ["Lock yourself in your room for days, refusing to talk to your family due to extreme shame and guilt.", "अत्यधिक शर्म और अपराधबोध के कारण अपने परिवार से बात करने से इनकार करते हुए, खुद को दिनों तक अपने कमरे में बंद रखेंगे।"], ["Analyze your answer sheets to find the weak points, change your study strategy, and prepare for the supplementary exams.", "कमजोर बिंदुओं को खोजने के लिए अपनी उत्तर पुस्तिकाओं का विश्लेषण करेंगे, अपनी अध्ययन रणनीति बदलेंगे, और पूरक परीक्षाओं की तैयारी करेंगे।"], ["Blame the university checking system and the professors, claiming the evaluation was completely biased and unfair.", "विश्वविद्यालय की जाँच प्रणाली और प्रोफेसरों को दोष देंगे, यह दावा करते हुए कि मूल्यांकन पूरी तरह से पक्षपाती और अनुचित था।"], ["Decide to drop out of college permanently, believing that education is not meant for you.", "यह मानते हुए कि शिक्षा आपके लिए नहीं बनी है, स्थायी रूप से कॉलेज छोड़ने का निर्णय लेंगे।"], 1],
["A senior intentionally insults your family's poor financial background in front of the whole class.", "एक सीनियर पूरी कक्षा के सामने जानबूझकर आपके परिवार की खराब आर्थिक पृष्ठभूमि का अपमान करता है।", ["Ignore the insult, maintain your dignity, and let your future academic success be your only response.", "अपमान को नज़रअंदाज़ करेंगे, अपनी गरिमा बनाए रखेंगे, और अपनी भविष्य की शैक्षणिक सफलता को ही अपना एकमात्र उत्तर बनने देंगे।"], ["Get physically aggressive and punch the senior to teach him a lesson about respecting others' families.", "शारीरिक रूप से आक्रामक हो जाएंगे और दूसरों के परिवारों का सम्मान करने के बारे में सबक सिखाने के लिए सीनियर को मुक्का मारेंगे।"], ["Leave the classroom immediately with tears in your eyes to hide your embarrassment from your classmates.", "अपने सहपाठियों से अपनी शर्मिंदगी छिपाने के लिए आंखों में आंसू लिए तुरंत कक्षा से बाहर निकल जाएंगे।"], ["Start verbally abusing the senior's family to get revenge and show him that you are not weak.", "बदला लेने और उसे यह दिखाने के लिए कि आप कमजोर नहीं हैं, सीनियर के परिवार को गाली देना शुरू कर देंगे।"], 0],
["You lose your company's most valuable client because you made a silly typing error in a crucial quotation email.", "आप अपनी कंपनी के सबसे मूल्यवान क्लाइंट को खो देते हैं क्योंकि आपने एक महत्वपूर्ण कोटेशन ईमेल में टाइपिंग की एक मूर्खतापूर्ण गलती की थी।", ["Try to secretly alter the sent email in the server to hide your mistake from the senior management.", "वरिष्ठ प्रबंधन से अपनी गलती छिपाने के लिए सर्वर में भेजे गए ईमेल को गुप्त रूप से बदलने का प्रयास करेंगे।"], ["Blame your junior assistant for drafting the email incorrectly to save your own job and reputation.", "अपनी खुद की नौकरी और प्रतिष्ठा बचाने के लिए ईमेल को गलत तरीके से ड्राफ्ट करने के लिए अपने जूनियर सहायक को दोष देंगे।"], ["Accept the mistake to your boss, personally apologize to the client, and create a multi-step review process for future emails.", "अपने बॉस के सामने गलती स्वीकार करेंगे, व्यक्तिगत रूप से क्लाइंट से माफी मांगेंगे, और भविष्य के ईमेल के लिए एक बहु-चरणीय समीक्षा प्रक्रिया बनाएंगे।"], ["Fall into deep depression, stop taking new clients, and hand over your resignation out of sheer guilt.", "गहरे अवसाद में चले जाएंगे, नए क्लाइंट लेना बंद कर देंगे, और भारी अपराधबोध के कारण अपना इस्तीफा सौंप देंगे।"], 2],
["While driving, a pedestrian suddenly runs onto the road and you accidentally hit them, causing a minor injury.", "गाड़ी चलाते समय, एक पैदल यात्री अचानक सड़क पर आ जाता है और आप गलती से उसे टक्कर मार देते हैं, जिससे उसे मामूली चोट आ जाती है।", ["Step out, yell at the pedestrian for not looking at the road, and demand money for the scratch on your car.", "बाहर निकलेंगे, सड़क पर न देखने के लिए पैदल यात्री पर चिल्लाएंगे, और अपनी कार पर खरोंच के लिए पैसे की मांग करेंगे।"], ["Quickly drive away from the scene before a crowd gathers, as it was not your fault anyway.", "भीड़ जमा होने से पहले जल्दी से घटनास्थल से दूर चले जाएंगे, क्योंकि वैसे भी यह आपकी गलती नहीं थी।"], ["Park the car safely, help the injured person to the nearest clinic, and inform the traffic police about the incident.", "कार को सुरक्षित रूप से पार्क करेंगे, घायल व्यक्ति को निकटतम क्लिनिक ले जाने में मदद करेंगे, और घटना के बारे में ट्रैफिक पुलिस को सूचित करेंगे।"], ["Start crying out of fear of police cases and beg the gathering crowd not to beat you up.", "पुलिस केस के डर से रोने लगेंगे और इकट्ठा हुई भीड़ से आपको न पीटने की भीख मांगेंगे।"], 2],
["You propose to your long-time partner in a crowded restaurant, and they brutally reject you in front of everyone.", "आप एक भीड़भाड़ वाले रेस्तरां में अपने लंबे समय के साथी को प्रपोज करते हैं, और वे सबके सामने बेरहमी से आपको अस्वीकार कर देते हैं।", ["Start shouting and demanding an explanation right there, causing a massive scene in the restaurant.", "वहीं खड़े होकर चिल्लाना शुरू कर देंगे और स्पष्टीकरण की मांग करेंगे, जिससे रेस्तरां में भारी हंगामा हो जाएगा।"], ["Respect their decision, handle the rejection gracefully, pay the bill, and leave the restaurant quietly.", "उनके निर्णय का सम्मान करेंगे, अस्वीकृति को शालीनता से संभालेंगे, बिल का भुगतान करेंगे, और चुपचाप रेस्तरां से निकल जाएंगे।"], ["Start crying uncontrollably on your knees, begging them to change their mind in front of the strangers.", "अजनबियों के सामने अपना मन बदलने की भीख मांगते हुए, अपने घुटनों पर बैठकर बेकाबू होकर रोने लगेंगे।"], ["Turn the rejection into a joke to save face, pretending you were never really serious about the proposal.", "चेहरा बचाने के लिए अस्वीकृति को एक मजाक में बदल देंगे, यह दिखावा करते हुए कि आप कभी भी प्रस्ताव के बारे में वास्तव में गंभीर नहीं थे।"], 1],
["Your roommates threaten to kick you out of the flat in the middle of the night unless you join them in consuming illegal drugs.", "आपके रूममेट्स आपको आधी रात को फ्लैट से बाहर निकालने की धमकी देते हैं जब तक कि आप उनके साथ अवैध ड्रग्स का सेवन नहीं करते।", ["Pack your essential belongings immediately, leave the flat for a safe hotel or friend's place, and look for a new accommodation the next day.", "तुरंत अपना आवश्यक सामान पैक करेंगे, एक सुरक्षित होटल या दोस्त की जगह के लिए फ्लैट छोड़ देंगे, और अगले दिन एक नया आवास तलाशेंगे।"], ["Give in to their demands and take a small amount of drugs just to keep the peace and your room.", "उनकी मांगों के सामने झुक जाएंगे और शांति और अपना कमरा बनाए रखने के लिए थोड़ी मात्रा में ड्रग्स ले लेंगे।"], ["Get into a violent physical fight with them to assert your dominance and force them to stop taking drugs.", "अपना प्रभुत्व स्थापित करने और उन्हें ड्रग्स लेने से रोकने के लिए उनके साथ हिंसक शारीरिक लड़ाई करेंगे।"], ["Lock yourself inside your bedroom, crying and hoping they will forget about you by the morning.", "खुद को अपने बेडरूम के अंदर बंद कर लेंगे, रोते हुए और यह उम्मीद करते हुए कि वे सुबह तक आपके बारे में भूल जाएंगे।"], 0],
["Your junior is promoted to be your team manager simply because they are a close relative of the company's CEO.", "आपके जूनियर को आपका टीम मैनेजर बना दिया जाता है क्योंकि वे कंपनी के सीईओ (CEO) के करीबी रिश्तेदार हैं।", ["Refuse to take orders from the new manager and openly insult their lack of experience in team meetings.", "नए मैनेजर से आदेश लेने से इंकार करेंगे और टीम की बैठकों में अनुभव की कमी के लिए खुले तौर पर उनका अपमान करेंगे।"], ["Start performing poorly on purpose to show the management that the new manager cannot handle the team.", "प्रबंधन को यह दिखाने के लिए जानबूझकर खराब प्रदर्शन करना शुरू कर देंगे कि नया प्रबंधक टीम को नहीं संभाल सकता है।"], ["Sulk silently at your desk every day, feeling completely demotivated and depressed about your career.", "अपने करियर को लेकर पूरी तरह से निराश और उदास महसूस करते हुए, हर दिन अपने डेस्क पर चुपचाप मुँह फुलाकर बैठेंगे।"], ["Maintain your professionalism, continue delivering high-quality work, and quietly start looking for a job in a merit-based company.", "अपनी व्यावसायिकता बनाए रखेंगे, उच्च गुणवत्ता वाला काम देना जारी रखेंगे, और चुपचाप योग्यता-आधारित कंपनी में नौकरी की तलाश शुरू करेंगे।"], 3],
["A trusted relative tricks you into signing a bank guarantor form, defaults on the massive loan, and runs away.", "एक भरोसेमंद रिश्तेदार आपको बैंक गारंटर फॉर्म पर हस्ताक्षर करने के लिए बरगलाता है, बड़े पैमाने पर ऋण चुकाने में विफल रहता है, और भाग जाता है।", ["Go into hiding yourself and change your phone number so the bank recovery agents cannot find you.", "खुद छिप जाएंगे और अपना फोन नंबर बदल लेंगे ताकि बैंक रिकवरी एजेंट आपको ढूंढ न सकें।"], ["File a police complaint against the relative for fraud and consult a lawyer to explore your legal options with the bank.", "धोखाधड़ी के लिए रिश्तेदार के खिलाफ पुलिस शिकायत दर्ज करेंगे और बैंक के साथ अपने कानूनी विकल्पों का पता लगाने के लिए एक वकील से परामर्श करेंगे।"], ["Threaten the relative's immediate family members with violence unless they pay off the debt.", "जब तक वे कर्ज नहीं चुकाते, तब तक रिश्तेदार के तत्काल परिवार के सदस्यों को हिंसा की धमकी देंगे।"], ["Accept your terrible fate, sell all your personal assets, and spend the rest of your life paying off a loan you didn't take.", "अपने भयानक भाग्य को स्वीकार करेंगे, अपनी सभी व्यक्तिगत संपत्ति बेच देंगे, और अपना शेष जीवन उस ऋण को चुकाने में व्यतीत करेंगे जो आपने नहीं लिया था।"], 1],
["A completely morphed, fake video of you doing something highly illegal goes viral in your hometown, ruining your reputation.", "आपका कुछ अत्यधिक अवैध करते हुए एक पूरी तरह से बदला हुआ, फर्जी वीडियो आपके गृहनगर में वायरल हो जाता है, जिससे आपकी प्रतिष्ठा बर्बाद हो जाती है।", ["Deactivate all your social media accounts and refuse to leave your house out of extreme shame and embarrassment.", "अपने सभी सोशल मीडिया खातों को निष्क्रिय कर देंगे और अत्यधिक शर्म और शर्मिंदगी के कारण अपना घर छोड़ने से इंकार कर देंगे।"], ["Immediately file a cybercrime FIR, post a clear factual clarification on your profiles, and let the legal process clear your name.", "तुरंत साइबर अपराध एफआईआर (FIR) दर्ज करेंगे, अपने प्रोफाइल पर स्पष्ट तथ्यात्मक स्पष्टीकरण पोस्ट करेंगे, और कानूनी प्रक्रिया को अपना नाम साफ करने देंगे।"], ["Find the person who you suspect made the video and physically assault them in public to get revenge.", "उस व्यक्ति को ढूंढेंगे जिस पर आपको वीडियो बनाने का संदेह है और बदला लेने के लिए सार्वजनिक रूप से उन पर शारीरिक हमला करेंगे।"], ["Try to bribe local social media pages to take the video down instead of involving the police.", "पुलिस को शामिल करने के बजाय वीडियो को हटाने के लिए स्थानीय सोशल मीडिया पेजों को रिश्वत देने का प्रयास करेंगे।"], 1],
["You have exactly 24 hours to submit your final Ph.D. thesis, and your laptop's hard drive crashes, erasing all your data.", "अपना अंतिम पीएच.डी. (Ph.D.) थीसिस जमा करने के लिए आपके पास ठीक 24 घंटे हैं, और आपके लैपटॉप की हार्ड ड्राइव क्रैश हो जाती है, जिससे आपका सारा डेटा मिट जाता है।", ["Rush the laptop to a professional data recovery center while simultaneously seeking an emergency extension from your university guide.", "विश्वविद्यालय गाइड से आपातकालीन विस्तार (extension) की मांग करते हुए लैपटॉप को एक पेशेवर डेटा रिकवरी सेंटर में ले जाएंगे।"], ["Suffer a severe panic attack, smash the broken laptop against the wall, and give up on your degree entirely.", "गंभीर पैनिक अटैक का शिकार होंगे, टूटे हुए लैपटॉप को दीवार पर दे मारेंगे, और अपनी डिग्री पूरी तरह से छोड़ देंगे।"], ["Plagiarize someone else's research from the internet and submit it just to meet the strict 24-hour deadline.", "केवल सख्त 24-घंटे की समय सीमा को पूरा करने के लिए इंटरनेट से किसी और के शोध की चोरी (Plagiarize) करेंगे और उसे जमा कर देंगे।"], ["Go to sleep, accepting that bad luck has ruined your career and there is nothing you can do about it now.", "यह स्वीकार करते हुए कि दुर्भाग्य ने आपके करियर को बर्बाद कर दिया है और अब आप इसके बारे में कुछ नहीं कर सकते, सोने चले जाएंगे।"], 0],
["Your entire close friend group suddenly boycotts you, removes you from chats, and refuses to give any reason.", "आपका पूरा करीबी दोस्त समूह अचानक आपका बहिष्कार करता है, आपको चैट से हटा देता है, और कोई भी कारण बताने से इंकार कर देता है।", ["Create fake social media accounts to secretly stalk their conversations and find out what they are saying about you.", "उनकी बातचीत को गुप्त रूप से डंठल (stalk) करने के लिए नकली सोशल मीडिया खाते बनाएंगे और पता लगाएंगे कि वे आपके बारे में क्या कह रहे हैं।"], ["Beg them continuously through messages and calls to take you back, apologizing for things you didn't even do.", "जिन चीजों को आपने किया भी नहीं है, उनके लिए माफी मांगते हुए, संदेशों और कॉलों के माध्यम से आपको वापस लेने की लगातार भीख मांगेंगे।"], ["Start spreading toxic rumors about all of them to other people as revenge for abandoning you.", "आपको छोड़ने के प्रतिशोध के रूप में अन्य लोगों के लिए उन सभी के बारे में विषैली अफवाहें फैलाना शुरू कर देंगे।"], ["Respect their boundaries, step back to evaluate your own recent actions, and focus on building new, healthier relationships.", "उनकी सीमाओं का सम्मान करेंगे, अपने स्वयं के हालिया कार्यों का मूल्यांकन करने के लिए एक कदम पीछे हटेंगे, और नए, स्वस्थ संबंध बनाने पर ध्यान केंद्रित करेंगे।"], 3],
["You catch your father taking a heavy cash bribe for a government contract, and he begs you not to tell anyone to save the family honor.", "आप अपने पिता को एक सरकारी अनुबंध के लिए भारी नकद रिश्वत लेते हुए पकड़ते हैं, और वह आपसे परिवार के सम्मान को बचाने के लिए किसी को न बताने की भीख मांगते हैं।", ["Threaten to expose him unless he gives you a large share of the bribe money for your own expenses.", "जब तक कि वह आपको अपने खर्चों के लिए रिश्वत के पैसे का एक बड़ा हिस्सा नहीं देता, तब तक उसे बेनकाब करने की धमकी देंगे।"], ["Have a stern private discussion with him, urging him to return the money immediately, and refuse to be a part of his corruption.", "उनके साथ एक कड़ी निजी चर्चा करेंगे, उनसे तुरंत पैसे वापस करने का आग्रह करेंगे, और उनके भ्रष्टाचार का हिस्सा बनने से इंकार करेंगे।"], ["Completely ignore what you saw and pretend everything is fine because family loyalty is more important than the law.", "आपने जो देखा उसे पूरी तरह से अनदेखा करेंगे और दिखावा करेंगे कि सब कुछ ठीक है क्योंकि परिवार की वफादारी कानून से ज्यादा महत्वपूर्ण है।"], ["Secretly record a video of him holding the cash and post it on the internet to humiliate him globally.", "गुप्त रूप से नकदी पकड़े हुए उनका एक वीडियो रिकॉर्ड करेंगे और उन्हें विश्व स्तर पर अपमानित करने के लिए इसे इंटरनेट पर पोस्ट करेंगे।"], 1],
["You are visiting a remote village when a local mob surrounds you, aggressively accusing you of being a child kidnapper due to a misunderstanding.", "आप एक दूरस्थ गाँव का दौरा कर रहे हैं, जब एक स्थानीय भीड़ आपको घेर लेती है, और गलतफहमी के कारण आक्रामक रूप से आप पर बच्चा अपहरणकर्ता होने का आरोप लगाती है।", ["Pull out a weapon or heavy stick and threaten to attack anyone who dares to come near you.", "एक हथियार या भारी छड़ी निकालेंगे और जो कोई भी आपके पास आने की हिम्मत करेगा उस पर हमला करने की धमकी देंगे।"], ["Start running away blindly into the fields, which will only make the angry mob chase you faster.", "खेतों में आंख मूंदकर भागना शुरू कर देंगे, जिससे क्रोधित भीड़ केवल आपका तेजी से पीछा करेगी।"], ["Fall to the ground, crying and begging for your life, hoping someone takes pity on you.", "जमीन पर गिर जाएंगे, रोते हुए और अपने जीवन की भीख मांगते हुए, यह उम्मीद करते हुए कि कोई आप पर दया करेगा।"], ["Stay absolutely calm, keep your hands visible, and request them to call the village head or local police to verify your identity.", "बिल्कुल शांत रहेंगे, अपने हाथ दिखाई देंगे, और उनसे अपनी पहचान सत्यापित करने के लिए ग्राम प्रधान या स्थानीय पुलिस को बुलाने का अनुरोध करेंगे।"], 3],
["You unexpectedly discover that your romantic partner has been secretly having an affair with your own sibling for months.", "आपको अप्रत्याशित रूप से पता चलता है कि आपका रोमांटिक साथी महीनों से आपके अपने भाई-बहन के साथ गुप्त रूप से संबंध बना रहा है।", ["Cut off contact with both of them completely, process the severe betrayal, and eventually seek professional counseling to heal.", "उन दोनों से पूरी तरह से संपर्क काट लेंगे, गंभीर विश्वासघात को संसाधित करेंगे, और अंततः ठीक होने के लिए पेशेवर परामर्श लेंगे।"], ["Attack your sibling physically and destroy your partner's belongings in a fit of uncontrollable rage.", "अपने भाई-बहन पर शारीरिक रूप से हमला करेंगे और बेकाबू गुस्से में अपने साथी के सामान को नष्ट कर देंगे।"], ["Forgive them both immediately and pretend it never happened because you are too afraid of being alone.", "उन दोनों को तुरंत माफ कर देंगे और दिखावा करेंगे कि ऐसा कभी नहीं हुआ क्योंकि आप अकेले रहने से बहुत डरते हैं।"], ["Start a fake romantic affair of your own just to make your partner jealous and hurt them back.", "अपने साथी को ईर्ष्या करने और उन्हें वापस चोट पहुंचाने के लिए अपना खुद का एक नकली रोमांटिक अफेयर शुरू करेंगे।"], 0],
["A minor miscommunication during a surgery causes a patient's death, and the senior doctors collude to blame you entirely.", "सर्जरी के दौरान एक मामूली गलतफहमी से एक मरीज की मौत हो जाती है, और वरिष्ठ डॉक्टर पूरी तरह से आपको दोष देने के लिए मिलीभगत करते हैं।", ["Accept the blame silently because fighting against powerful senior doctors will permanently ruin your medical career anyway.", "चुपचाप दोष स्वीकार करेंगे क्योंकि शक्तिशाली वरिष्ठ डॉक्टरों के खिलाफ लड़ने से वैसे भी आपका चिकित्सा करियर स्थायी रूप से बर्बाद हो जाएगा।"], ["Hire a sharp legal team, secure your personal copies of the operation theater logs, and fight the false charges in the medical board.", "एक तेज कानूनी टीम को काम पर रखेंगे, ऑपरेशन थियेटर लॉग की अपनी व्यक्तिगत प्रतियों को सुरक्षित करेंगे, और मेडिकल बोर्ड में झूठे आरोपों से लड़ेंगे।"], ["Threaten the senior doctors with physical harm outside the hospital if they don't take their false allegations back.", "यदि वे अपने झूठे आरोप वापस नहीं लेते हैं तो वरिष्ठ डॉक्टरों को अस्पताल के बाहर शारीरिक नुकसान की धमकी देंगे।"], ["Flee the city immediately and try to set up a new medical practice under a fake identity.", "तुरंत शहर से भाग जाएंगे और एक नकली पहचान के तहत एक नया चिकित्सा अभ्यास स्थापित करने का प्रयास करेंगे।"], 1],
["A toxic ex-partner threatens to release your deeply private and intimate photos on the internet if you don't pay them a huge sum of money.", "एक विषाक्त पूर्व-साथी इंटरनेट पर आपकी अत्यधिक निजी और अंतरंग तस्वीरें जारी करने की धमकी देता है यदि आप उन्हें भारी रकम का भुगतान नहीं करते हैं।", ["Pay the extortion money secretly by taking heavy loans, hoping they will delete the photos and leave you alone.", "भारी ऋण लेकर गुप्त रूप से जबरन वसूली के पैसे का भुगतान करेंगे, यह उम्मीद करते हुए कि वे तस्वीरें हटा देंगे और आपको अकेला छोड़ देंगे।"], ["Refuse to pay, immediately file a complaint with the cybercrime police, and inform your close family to preempt the blackmail.", "भुगतान करने से इंकार करेंगे, तुरंत साइबर अपराध पुलिस में शिकायत दर्ज करेंगे, और ब्लैकमेल को रोकने के लिए अपने करीबी परिवार को सूचित करेंगे।"], ["Beg and cry on the phone, pleading with them not to ruin your life while agreeing to all their demands.", "फोन पर भीख मांगेंगे और रोएंगे, उनकी सभी मांगों से सहमत होते हुए उनसे अपना जीवन बर्बाद न करने की गुहार लगाएंगे।"], ["Blackmail them back by threatening to harm their current partner if they dare to leak your pictures.", "यदि वे आपकी तस्वीरें लीक करने की हिम्मत करते हैं तो उनके वर्तमान साथी को नुकसान पहुंचाने की धमकी देकर उन्हें वापस ब्लैकमेल करेंगे।"], 1],
["You have been starving and broke for three days. You walk past a bakery and see the cash counter and fresh food completely unattended.", "आप तीन दिन से भूखे और कंगाल हैं। आप एक बेकरी के पास से गुजरते हैं और देखते हैं कि नकद काउंटर और ताजा भोजन पूरी तरह से लावारिस है।", ["Steal some cash from the counter so you can buy food for the next week without anyone knowing.", "काउंटर से कुछ नकदी चुरा लेंगे ताकि आप बिना किसी को बताए अगले सप्ताह के लिए भोजन खरीद सकें।"], ["Quickly grab a loaf of bread and run away, convincing yourself that stealing is justified when you are starving.", "जल्दी से ब्रेड का एक टुकड़ा पकड़ेंगे और भाग जाएंगे, खुद को यह विश्वास दिलाते हुए कि जब आप भूखे हों तो चोरी करना उचित है।"], ["Wait for the shopkeeper to return, explain your desperate situation honestly, and offer to do cleaning work in exchange for food.", "दुकानदार के लौटने की प्रतीक्षा करेंगे, अपनी हताश स्थिति को ईमानदारी से समझाएंगे, और भोजन के बदले सफाई का काम करने की पेशकश करेंगे।"], ["Walk away and continue starving, cursing your bad luck and waiting to pass out on the street.", "दूर चले जाएंगे और भूखे रहना जारी रखेंगे, अपने दुर्भाग्य को कोसेंगे और सड़क पर बेहोश होने का इंतजार करेंगे।"], 2],
["A tragic road accident leaves you permanently paralyzed from the waist down, ending your promising career as a professional athlete.", "एक दुखद सड़क दुर्घटना आपको कमर के नीचे से स्थायी रूप से लकवाग्रस्त कर देती है, जिससे एक पेशेवर एथलीट के रूप में आपका होनहार करियर समाप्त हो जाता है।", ["Spend your life bitterly blaming the person who caused the accident, isolating yourself from all your friends and family.", "अपना जीवन कड़वाहट से उस व्यक्ति को दोष देने में व्यतीत करेंगे जिसने दुर्घटना का कारण बना, खुद को अपने सभी दोस्तों और परिवार से अलग कर लेंगे।"], ["Accept the harsh reality after grieving, undergo intense rehabilitation, and pivot your career toward sports coaching or paralympic events.", "शोक मनाने के बाद कठोर वास्तविकता को स्वीकार करेंगे, गहन पुनर्वास से गुजरेंगे, और अपने करियर को खेल कोचिंग या पैरालंपिक घटनाओं की ओर मोड़ेंगे।"], ["Give up on all ambitions, refuse to undergo physical therapy, and resign yourself to a life of misery and dependence.", "सभी महत्वाकांक्षाओं को छोड़ देंगे, भौतिक चिकित्सा से गुजरने से इंकार करेंगे, और खुद को दुख और निर्भरता के जीवन में झोंक देंगे।"], ["Develop a severe addiction to painkillers to escape the physical and mental trauma of your lost dreams.", "अपने खोए हुए सपनों के शारीरिक और मानसिक आघात से बचने के लिए दर्द निवारक दवाओं की गंभीर लत विकसित करेंगे।"], 1],
["You receive the tragic news of your parents' sudden death in a crash just ten minutes before you have to give the most important presentation of your company's history.", "अपनी कंपनी के इतिहास की सबसे महत्वपूर्ण प्रस्तुति देने से ठीक दस मिनट पहले आपको एक दुर्घटना में अपने माता-पिता की अचानक मृत्यु की दुखद खबर मिलती है।", ["Inform your superiors of the extreme emergency, hand over your notes to a trusted colleague, and leave immediately to be with your family.", "अपने वरिष्ठों को चरम आपात स्थिति के बारे में सूचित करेंगे, एक विश्वसनीय सहयोगी को अपने नोट्स सौंपेंगे, और अपने परिवार के साथ रहने के लिए तुरंत निकल जाएंगे।"], ["Force yourself to give the presentation while holding back tears, completely botching the delivery due to severe shock.", "गंभीर झटके के कारण डिलीवरी को पूरी तरह से खराब करते हुए, आंसुओं को रोकते हुए खुद को प्रस्तुति देने के लिए मजबूर करेंगे।"], ["Suffer a complete mental breakdown, start screaming uncontrollably in the office lobby, and collapse on the floor.", "पूर्ण मानसिक टूटने (breakdown) का शिकार होंगे, कार्यालय की लॉबी में अनियंत्रित रूप से चिल्लाना शुरू कर देंगे, और फर्श पर गिर जाएंगे।"], ["Walk out of the building silently without telling anyone anything, leaving the entire company project to fail.", "बिना किसी को कुछ बताए चुपचाप इमारत से बाहर निकल जाएंगे, जिससे पूरी कंपनी की परियोजना विफल हो जाएगी।"], 0],
["Heavily armed robbers take over the bank you are in. They hand you a gun and order you to shoot the security guard, or they will shoot you.", "भारी हथियारों से लैस लुटेरे उस बैंक पर कब्जा कर लेते हैं जिसमें आप हैं। वे आपको एक बंदूक सौंपते हैं और सुरक्षा गार्ड को गोली मारने का आदेश देते हैं, अन्यथा वे आपको गोली मार देंगे।", ["Take the gun and shoot the innocent security guard to guarantee your own survival at any moral cost.", "किसी भी नैतिक कीमत पर अपने स्वयं के अस्तित्व की गारंटी देने के लिए बंदूक लेंगे और निर्दोष सुरक्षा गार्ड को गोली मार देंगे।"], ["Drop the weapon immediately, put your hands up, and refuse to commit murder, keeping your focus on survival through non-compliance.", "हथियार तुरंत गिरा देंगे, अपने हाथ ऊपर रखेंगे, और गैर-अनुपालन के माध्यम से जीवित रहने पर अपना ध्यान केंद्रित रखते हुए हत्या करने से इंकार करेंगे।"], ["Take the gun and blindly start shooting at the heavily armed robbers, ensuring you get killed in the crossfire instantly.", "बंदूक लेंगे और भारी हथियारों से लैस लुटेरों पर आँख बंद करके गोलियां चलाना शुरू कर देंगे, यह सुनिश्चित करते हुए कि आप तुरंत क्रॉसफ़ायर में मारे जाएं।"], ["Start crying loudly and begging the robbers, grabbing their legs and offering them all your bank details to spare you.", "जोर-जोर से रोना और लुटेरों से भीख मांगना शुरू कर देंगे, उनके पैर पकड़कर और उन्हें अपने सभी बैंक विवरण पेश करेंगे ताकि आपको बख्शा जा सके।"], 1],
["The small ferry you are on is sinking rapidly. You grab the last life jacket, but a desperate mother with a child begs you for it.", "आप जिस छोटी नौका पर हैं वह तेजी से डूब रही है। आप आखिरी लाइफ जैकेट पकड़ते हैं, लेकिन एक बच्चे के साथ एक हताश माँ आपसे इसके लिए भीख माँगती है।", ["Ignore her cries, put the life jacket on yourself, and jump into the water to secure your own life.", "उसकी चीख को अनदेखा करेंगे, खुद लाइफ जैकेट पहनेंगे, और अपना जीवन सुरक्षित करने के लिए पानी में कूद जाएंगे।"], ["Push the woman away aggressively so she stops bothering you while the boat goes down.", "महिला को आक्रामक रूप से धक्का देंगे ताकि नाव के नीचे जाने के दौरान वह आपको परेशान करना बंद कर दे।"], ["Give the life jacket to the child, and search frantically for floating debris or buoys to keep yourself and the mother afloat.", "बच्चे को लाइफ जैकेट दे देंगे, और खुद को और माँ को बचाए रखने के लिए तैरते हुए मलबे या बुआ (buoys) की पागलों की तरह खोज करेंगे।"], ["Give the life jacket to them and just sit on the sinking deck, accepting your inevitable drowning peacefully.", "उन्हें लाइफ जैकेट दे देंगे और बस डूबते हुए डेक पर बैठ जाएंगे, शांति से अपने अपरिहार्य डूबने को स्वीकार करेंगे।"], 2],
["You accidentally let slip a massive secret that causes your best friend's parents to get a bitter divorce, and your friend hates you forever.", "आप गलती से एक बहुत बड़ा रहस्य उजागर कर देते हैं जिसके कारण आपके सबसे अच्छे दोस्त के माता-पिता का कड़वा तलाक हो जाता है, और आपका दोस्त हमेशा के लिए आपसे नफरत करने लगता है।", ["Respect your friend's anger, give them space, accept the severe consequences of your mistake, and learn to be extremely guarded with words.", "अपने मित्र के क्रोध का सम्मान करेंगे, उन्हें स्थान देंगे, अपनी गलती के गंभीर परिणामों को स्वीकार करेंगे, और शब्दों के साथ अत्यंत सतर्क रहना सीखेंगे।"], ["Harass your friend daily with long apology texts and wait outside their house until they are forced to forgive you.", "लंबे माफी ग्रंथों के साथ दैनिक रूप से अपने दोस्त को परेशान करेंगे और उनके घर के बाहर तब तक प्रतीक्षा करेंगे जब तक कि वे आपको क्षमा करने के लिए मजबूर न हो जाएं।"], ["Blame the parents for having a weak marriage in the first place so you don't have to feel guilty about leaking the secret.", "माता-पिता को पहली बार में कमजोर शादी के लिए दोषी ठहराएंगे ताकि आपको रहस्य लीक करने के बारे में दोषी महसूस न करना पड़े।"], ["Fall into deep self-hatred, quit your job, and turn to alcohol to forget the pain of ruining a family.", "गहरे आत्म-घृणा में गिर जाएंगे, अपनी नौकरी छोड़ देंगे, और एक परिवार को बर्बाद करने के दर्द को भूलने के लिए शराब का सहारा लेंगे।"], 0],
["You are wrongly convicted and spend 5 years in a harsh prison before DNA evidence finally proves your absolute innocence.", "आपको गलत तरीके से दोषी ठहराया जाता है और डीएनए (DNA) साक्ष्य द्वारा अंततः आपकी पूर्ण बेगुनाही साबित होने से पहले 5 साल कठोर जेल में बिताते हैं।", ["Seek heavy compensation through legal channels, rebuild your life step-by-step, and start an NGO to help other wrongfully accused prisoners.", "कानूनी चैनलों के माध्यम से भारी मुआवजे की मांग करेंगे, अपने जीवन को कदम-दर-कदम फिर से बनाएंगे, और अन्य गलत तरीके से आरोपी कैदियों की मदद के लिए एक एनजीओ (NGO) शुरू करेंगे।"], ["Track down the corrupt police officers who framed you and violently attack them to get personal street justice.", "आपको फंसाने वाले भ्रष्ट पुलिस अधिकारियों को ट्रैक करेंगे और व्यक्तिगत सड़क न्याय पाने के लिए उन पर हिंसक हमला करेंगे।"], ["Become a hardened criminal yourself, believing that since the justice system is broken, being good has no value.", "खुद एक खूंखार अपराधी बन जाएंगे, यह मानते हुए कि चूंकि न्याय प्रणाली टूट चुकी है, इसलिए अच्छा होने का कोई मूल्य नहीं है।"], ["Refuse to re-enter society, suffering from severe institutionalization, and live on the streets as a beggar.", "समाज में फिर से प्रवेश करने से इंकार करेंगे, गंभीर संस्थागतकरण (institutionalization) से पीड़ित होंगे, और एक भिखारी के रूप में सड़कों पर रहेंगे।"], 0],
["On the eve of your tech startup's million-dollar launch, your business partner drains the joint accounts and flees the country, leaving you bankrupt.", "आपके तकनीकी स्टार्टअप के मिलियन-डॉलर लॉन्च की पूर्व संध्या पर, आपका व्यवसाय भागीदार संयुक्त खातों को खाली कर देता है और देश से भाग जाता है, जिससे आप दिवालिया हो जाते हैं।", ["Immediately inform the police and international authorities, transparently explain the situation to your investors, and start the legal recovery process.", "पुलिस और अंतरराष्ट्रीय अधिकारियों को तुरंत सूचित करेंगे, अपने निवेशकों को पारदर्शी रूप से स्थिति की व्याख्या करेंगे, और कानूनी वसूली प्रक्रिया शुरू करेंगे।"], ["Destroy all the office computers and servers in a fit of uncontrollable rage, ending any chance of saving the startup's code.", "बेकाबू क्रोध में सभी कार्यालय कंप्यूटरों और सर्वरों को नष्ट कर देंगे, स्टार्टअप के कोड को बचाने के किसी भी मौके को समाप्त कर देंगे।"], ["Flee the city yourself to avoid facing the angry investors and employees who haven't been paid.", "नाराज निवेशकों और कर्मचारियों का सामना करने से बचने के लिए खुद शहर से भाग जाएंगे जिन्हें भुगतान नहीं किया गया है।"], ["Attempt to take a massive loan from dangerous local loan sharks just to hide the betrayal and keep the launch going.", "विश्वासघात को छिपाने और लॉन्च को जारी रखने के लिए खतरनाक स्थानीय ऋण शार्क से भारी ऋण लेने का प्रयास करेंगे।"], 0],
["A malicious hacker completely locks you out of your digital life, permanently deleting your only copies of a decade of precious family photos and memories.", "एक दुर्भावनापूर्ण हैकर आपको आपके डिजिटल जीवन से पूरी तरह से बाहर कर देता है, एक दशक की कीमती पारिवारिक तस्वीरों और यादों की आपकी एकमात्र प्रतियों को स्थायी रूप से हटा देता है।", ["Fall into a deep depression, obsessively staring at your blank computer screen for weeks unable to process the loss.", "गहरी अवसाद में गिर जाएंगे, नुकसान को संसाधित करने में असमर्थ हफ्तों तक अपनी खाली कंप्यूटर स्क्रीन को जुनूनी रूप से देखते रहेंगे।"], ["Accept the painful loss of digital data, focus on cherishing the memories in your mind, and implement rigid offline backup systems for the future.", "डिजिटल डेटा के दर्दनाक नुकसान को स्वीकार करेंगे, अपने दिमाग में यादों को संजोने पर ध्यान केंद्रित करेंगे, और भविष्य के लिए कठोर ऑफ़लाइन बैकअप सिस्टम लागू करेंगे।"], ["Pay thousands of dollars to shady online 'recovery agents' who are likely just scamming you for more money.", "संदिग्ध ऑनलाइन 'रिकवरी एजेंटों' को हजारों डॉलर का भुगतान करेंगे जो संभवतः अधिक पैसे के लिए आपको धोखा दे रहे हैं।"], ["Smash all your digital devices to pieces, vowing never to use modern technology or the internet ever again.", "अपने सभी डिजिटल उपकरणों को टुकड़ों में तोड़ देंगे, कभी भी आधुनिक तकनीक या इंटरनेट का फिर कभी उपयोग न करने की कसम खाएंगे।"], 1],
["You are severely claustrophobic. You get trapped alone in a tiny, dark elevator, and you suddenly smell smoke coming from the panel.", "आप गंभीर रूप से क्लॉस्ट्रोफोबिक हैं। आप एक छोटे, अंधेरे लिफ्ट में अकेले फंस जाते हैं, और आपको अचानक पैनल से धुआं आने की गंध आती है।", ["Give in to a massive panic attack, hyperventilate, and pass out from fear before you can even call for help.", "एक बड़े पैनिक अटैक के आगे घुटने टेक देंगे, हाइपरवेंटिलेट (तेजी से सांस लेना) करेंगे, और इससे पहले कि आप मदद के लिए कॉल कर सकें, डर के मारे बेहोश हो जाएंगे।"], ["Force yourself to control your breathing, cover your nose with your shirt, press the emergency alarm, and use your phone light to signal out the door gap.", "खुद को अपनी सांसों को नियंत्रित करने के लिए मजबूर करेंगे, अपनी शर्ट से अपनी नाक को ढकेंगे, आपातकालीन अलार्म दबाएंगे, और दरवाजे के गैप से संकेत देने के लिए अपने फोन की लाइट का उपयोग करेंगे।"], ["Start violently kicking and punching the heavy steel doors until your hands and legs are bruised and broken.", "भारी स्टील के दरवाजों को हिंसक रूप से लात और मुक्का मारना शुरू कर देंगे जब तक कि आपके हाथ और पैर छिल और टूट न जाएं।"], ["Sit in the corner and cry silently, accepting that you are going to burn alive in the small box.", "कोने में बैठेंगे और चुपचाप रोएंगे, यह स्वीकार करते हुए कि आप छोटे बक्से में जिंदा जलने वाले हैं।"], 1],
["Your mother constantly compares you to your highly successful cousin, calling you a worthless failure every single day, severely damaging your self-esteem.", "आपकी माँ लगातार आपकी तुलना आपके अत्यधिक सफल चचेरे भाई से करती हैं, आपको हर एक दिन एक बेकार विफलता कहती हैं, जिससे आपके आत्म-सम्मान को गंभीर नुकसान पहुँचता है।", ["Start screaming at your mother daily, turning the house into a toxic warzone of mutual insults.", "अपनी माँ पर रोज़ाना चिल्लाना शुरू कर देंगे, घर को आपसी अपमान के विषैले युद्धक्षेत्र में बदल देंगे।"], ["Establish firm emotional boundaries, limit conversations about your career with her, and focus relentlessly on your own independent goals.", "दृढ़ भावनात्मक सीमाएं स्थापित करेंगे, उनके साथ अपने करियर के बारे में बातचीत को सीमित करेंगे, और अपने स्वयं के स्वतंत्र लक्ष्यों पर लगातार ध्यान केंद्रित करेंगे।"], ["Believe her completely, drop out of your career path, and accept that you will always be a failure.", "उस पर पूरी तरह विश्वास करेंगे, अपने करियर पथ से बाहर हो जाएंगे, और स्वीकार करेंगे कि आप हमेशा एक विफलता होंगे।"], ["Sabotage your cousin's career secretly just to make your mother stop praising them.", "अपनी माँ को उनकी प्रशंसा करने से रोकने के लिए गुप्त रूप से अपने चचेरे भाई के करियर को नुकसान पहुँचाएँगे।"], 1],
["You realize you have developed a severe gambling addiction, and in one horrific night, you lose the deed to your family's only home.", "आपको एहसास होता है कि आपने एक गंभीर जुए की लत विकसित कर ली है, और एक भयानक रात में, आप अपने परिवार के एकमात्र घर का विलेख (deed) खो देते हैं।", ["Confess the absolute truth to your family immediately, hand over all your financial controls to them, and enroll in a strict gambling rehab program.", "अपने परिवार के सामने तुरंत पूर्ण सत्य कबूल करेंगे, अपने सभी वित्तीय नियंत्रण उन्हें सौंप देंगे, और एक सख्त जुआ पुनर्वसन (rehab) कार्यक्रम में दाखिला लेंगे।"], ["Steal money from your employer to gamble one last time, convinced you can win the house back.", "एक आखिरी बार जुआ खेलने के लिए अपने नियोक्ता से पैसे चुराएंगे, यह विश्वास करते हुए कि आप घर वापस जीत सकते हैं।"], ["Run away from the city in the middle of the night, leaving your family to discover the homelessness on their own.", "आधी रात को शहर से भाग जाएंगे, अपने परिवार को खुद ही बेघर होने की खोज करने के लिए छोड़ देंगे।"], ["Threaten the casino owners with violence to give your deed back, getting yourself severely beaten up.", "अपने विलेख को वापस देने के लिए कैसीनो मालिकों को हिंसा की धमकी देंगे, जिससे आप बुरी तरह पिट जाएंगे।"], 0],
["A rejected colleague becomes obsessed with you, stalking your house every night and sending deeply disturbing letters.", "एक अस्वीकृत सहकर्मी आपके प्रति जुनूनी हो जाता है, हर रात आपके घर का पीछा करता है और गहराई से परेशान करने वाले पत्र भेजता है।", ["Go outside with a baseball bat in the middle of the night and physically assault the stalker.", "आधी रात को बेसबॉल बैट लेकर बाहर जाएंगे और स्टॉकर पर शारीरिक हमला करेंगे।"], ["Ignore the stalking completely, hoping they will just get bored and stop doing it eventually.", "स्टॉकिंग को पूरी तरह से अनदेखा करेंगे, यह उम्मीद करते हुए कि वे बस ऊब जाएंगे और अंततः ऐसा करना बंद कर देंगे।"], ["Install high-security cameras, log every incident meticulously, and file for an immediate strict police restraining order.", "उच्च सुरक्षा कैमरे स्थापित करेंगे, हर घटना को सावधानीपूर्वक लॉग (दर्ज) करेंगे, और तत्काल सख्त पुलिस निरोधक आदेश (restraining order) के लिए फाइल करेंगे।"], ["Quit your job, sell your house, and quietly move to a different city to escape them without fighting.", "अपनी नौकरी छोड़ देंगे, अपना घर बेच देंगे, और बिना लड़े उनसे बचने के लिए चुपचाप एक अलग शहर में चले जाएंगे।"], 2],
["A foreign university arbitrarily revokes your fully-funded Ph.D. scholarship a day before your flight, leaving you jobless and broke.", "एक विदेशी विश्वविद्यालय आपकी उड़ान से एक दिन पहले आपकी पूरी तरह से वित्त पोषित पीएच.डी. छात्रवृत्ति को मनमाने ढंग से रद्द कर देता है, जिससे आप बेरोजगार और कंगाल हो जाते हैं।", ["Immediately seek legal counsel regarding international student rights while rapidly applying for domestic research positions to secure your immediate livelihood.", "अपनी तत्काल आजीविका को सुरक्षित करने के लिए घरेलू अनुसंधान पदों के लिए तेजी से आवेदन करते हुए, अंतरराष्ट्रीय छात्र अधिकारों के संबंध में तुरंत कानूनी सलाह लेंगे।"], ["Fly to the foreign country anyway on a tourist visa and aggressively protest outside the university gates until you are arrested.", "वैसे भी टूरिस्ट वीजा पर विदेश जाएंगे और गिरफ्तार होने तक यूनिवर्सिटी के गेट के बाहर आक्रामक तरीके से विरोध करेंगे।"], ["Burn all your academic certificates in despair and resolve to do low-paying menial jobs for the rest of your life.", "निराशा में अपने सभी शैक्षणिक प्रमाणपत्रों को जला देंगे और जीवन भर कम वेतन वाली मामूली नौकरियां करने का संकल्प लेंगे।"], ["Send highly abusive and threatening emails to the university's admission board out of pure frustration.", "शुद्ध हताशा से विश्वविद्यालय के प्रवेश बोर्ड को अत्यधिक अपमानजनक और धमकी भरे ईमेल भेजेंगे।"], 0],
["You discover that a rival competitor deliberately tampered with your vehicle's brakes just hours before a major professional racing championship.", "आपको पता चलता है कि एक प्रतिद्वंद्वी प्रतियोगी ने एक प्रमुख पेशेवर रेसिंग चैंपियनशिप से कुछ घंटे पहले जानबूझकर आपके वाहन के ब्रेक के साथ छेड़छाड़ की है।", ["Tamper with the rival's vehicle in return to ensure they also face a deadly crash during the race.", "दौड़ के दौरान उन्हें भी जानलेवा दुर्घटना का सामना करना पड़े, यह सुनिश्चित करने के लिए बदले में प्रतिद्वंद्वी के वाहन के साथ छेड़छाड़ करेंगे।"], ["Report the sabotage to the race officials immediately with evidence, and have your mechanics urgently replace the braking system.", "सबूतों के साथ दौड़ के अधिकारियों को तुरंत तोड़फोड़ की रिपोर्ट करेंगे, और अपने यांत्रिकी (mechanics) से तत्काल ब्रेकिंग सिस्टम को बदलवाएंगे।"], ["Keep quiet and race anyway, believing your sheer driving skills will overcome the brake failure.", "चुप रहेंगे और वैसे भी दौड़ेंगे, यह विश्वास करते हुए कि आपका ड्राइविंग कौशल ब्रेक विफलता को दूर कर देगा।"], ["Withdraw from the championship entirely out of fear, letting the rival win the title without a fight.", "डर के मारे चैंपियनशिप से पूरी तरह से हट जाएंगे, जिससे प्रतिद्वंद्वी बिना लड़े खिताब जीत सके।"], 1],
["At the absolute peak of your youth and career, you are diagnosed with an untreatable disease giving you only six months to live.", "अपनी युवावस्था और करियर के चरम पर, आपको एक लाइलाज बीमारी का पता चलता है, जिससे आपके पास जीने के लिए केवल छह महीने हैं।", ["Keep the illness a secret, push everyone away with aggressive behavior, and die completely alone to avoid pity.", "बीमारी को गुप्त रखेंगे, आक्रामक व्यवहार से सभी को दूर धकेल देंगे, और दया से बचने के लिए पूरी तरह अकेले मरेंगे।"], ["Empty your bank accounts on wild, reckless, and highly illegal activities because consequences no longer matter to you.", "जंगली, लापरवाह और अत्यधिक अवैध गतिविधियों पर अपने बैंक खातों को खाली कर देंगे क्योंकि अब परिणाम आपके लिए मायने नहीं रखते।"], ["Arrange your legal and financial affairs to secure your family's future, and spend your remaining time creating meaningful memories with loved ones.", "अपने परिवार के भविष्य को सुरक्षित करने के लिए अपने कानूनी और वित्तीय मामलों की व्यवस्था करेंगे, और अपना शेष समय प्रियजनों के साथ सार्थक यादें बनाने में व्यतीत करेंगे।"], ["Spend all your days crying in bed, completely paralyzed by the fear of death and refusing to see anyone.", "मौत के डर से पूरी तरह से पंगु होकर और किसी को भी देखने से इंकार करते हुए, अपने सारे दिन बिस्तर पर रोते हुए बिताएंगे।"], 2],
["A massive earthquake completely flattens your uninsured house, instantly taking away all your lifetime savings, belongings, and shelter.", "एक बड़ा भूकंप आपके बिना बीमा वाले घर को पूरी तरह से समतल कर देता है, जिससे आपकी जीवन भर की बचत, सामान और आश्रय तुरंत छिन जाता है।", ["Move into a government relief camp, actively volunteer to help other traumatized survivors, and slowly begin the harsh process of rebuilding from zero.", "एक सरकारी राहत शिविर में चले जाएंगे, अन्य आघातित बचे लोगों की मदद करने के लिए सक्रिय रूप से स्वयंसेवक बनेंगे, और धीरे-धीरे शून्य से पुनर्निर्माण की कठोर प्रक्रिया शुरू करेंगे।"], ["Resort to looting damaged shops and other ruined houses at night to quickly get your wealth back.", "अपनी संपत्ति को जल्दी से वापस पाने के लिए रात में क्षतिग्रस्त दुकानों और अन्य बर्बाद घरों को लूटने का सहारा लेंगे।"], ["Lose your mind with grief, refuse to eat or drink, and sit in the rubble waiting for the end.", "दुख से अपना दिमाग खो देंगे, खाने या पीने से इंकार करेंगे, और मलबे में बैठकर अंत की प्रतीक्षा करेंगे।"], ["Blame your family members for convincing you to buy a house in that specific area, creating lifelong hatred.", "उस विशिष्ट क्षेत्र में घर खरीदने के लिए आपको मनाने के लिए अपने परिवार के सदस्यों को दोषी ठहराएंगे, जिससे आजीवन नफरत पैदा होगी।"], 0]
];

var T={

hi:{sT:"एसआरटी मॉक टेस्ट 42",ins:["कुल प्रश्न: 35 | समय: 30 मिनट","सही उत्तर: +1 अंक | गलत उत्तर: −0.25 अंक | बिना उत्तर: 0","किसी भी प्रश्न पर जाने के लिए पैलेट में प्रश्न संख्या दबाएँ","आप कभी भी अंग्रेज़ी और हिन्दी भाषा बदल सकते हैं","आप कभी भी टेस्ट सबमिट कर सकते हैं; समय समाप्त होने पर टेस्ट अपने आप सबमिट हो जाएगा"],name:"अपना नाम लिखें (वैकल्पिक)",start:"टेस्ट शुरू करें",q:"प्रश्न",of:"/",prev:"« पिछला",next:"अगला »",clr:"उत्तर हटाएँ",sub:"टेस्ट सबमिट करें",pal:"प्रश्न कंसोल",pg:"प्रश्न कंसोल दिखाएँ / छिपाएँ",lA:"उत्तर दिया",lN:"उत्तर नहीं दिया",lU:"देखा नहीं",mT:"टेस्ट सबमिट करें?",mB:function(a,s){return "आपने "+a+" प्रश्नों के उत्तर दिए हैं और "+s+" प्रश्न छोड़े हैं। क्या आप सबमिट करना चाहते हैं?"},mNo:"रद्द करें",mYes:"हाँ, सबमिट करें",rT:"टेस्ट परिणाम",tot:"कुल स्कोर",mk:"अंकन: सही +1, गलत −0.25",att:"प्रयास किए",skp:"छोड़े गए",cor:"सही",wro:"गलत",tq:"कुल प्रश्न",neg:"ऋणात्मक अंक",rv:"उत्तर देखें",hv:"उत्तर छिपाएँ",rt:"दोबारा टेस्ट दें",ok:"सही",no:"गलत",sk:"छोड़ा गया",ca:"सही उत्तर",ya:"आपका उत्तर"}
};
var lang="en",cur=0,ans=[],vis=[],endAt=0,tick=null,done=false,L="ABCD";
function $(id){return document.getElementById(id)}
function t(k){return T[lang][k]}
function pad(n){return n<10?"0"+n:""+n}
function fmt(n){return (Math.round(n*100)/100).toString()}

function applyStatic(){
 $("ttl").textContent=lang==="en"?TITLE_EN:TITLE_HI;
 $("sT").textContent=lang==="en"?TITLE_EN:TITLE_HI;
 $("sIns").innerHTML=t("ins").map(function(x){return "<li>"+x+"</li>"}).join("");
 $("nm").placeholder=t("name");$("sBtn").textContent=t("start");
 $("prev").textContent=t("prev");$("next").textContent=t("next");$("clr").textContent=t("clr");$("sub").textContent=t("sub");
 $("palT").textContent=t("pal");$("ptog").textContent=t("pg");
 $("lA").textContent=t("lA");$("lN").textContent=t("lN");$("lU").textContent=t("lU");
 $("mNo").textContent=t("mNo");$("mYes").textContent=t("mYes");$("mT").textContent=t("mT");
 document.documentElement.lang=lang==="en"?"en":"hi";
 $("bEn").className=lang==="en"?"on":"";$("bHi").className=lang==="hi"?"on":"";
}
function setLang(l){
 lang=l;applyStatic();
 if(!$("test").classList.contains("hide"))render();
 if(!$("result").classList.contains("hide"))showResult();
 if(!$("modal").classList.contains("hide"))openM();
}
function startTest(){
 for(var i=0;i<Q.length;i++){ans[i]=-1;vis[i]=false}
 $("start").classList.add("hide");$("test").classList.remove("hide");$("timer").classList.remove("hide");
 endAt=Date.now()+DURATION*1000;
 tick=setInterval(upd,500);upd();render();
 window.scrollTo(0,0);
}
function upd(){
 var s=Math.max(0,Math.round((endAt-Date.now())/1000));
 $("timer").textContent=pad(Math.floor(s/60))+":"+pad(s%60);
 if(s<=300)$("timer").className="timer low";
 if(s<=0&&!done)finish();
}
function render(){
 vis[cur]=true;var q=Q[cur],i=lang==="en"?0:1;
 $("qno").textContent=t("q")+" "+(cur+1)+" "+t("of")+" "+Q.length;
 $("qsts").textContent=ans[cur]>=0?"✔ "+t("lA"):"";
 $("qtext").textContent=(cur+1)+". "+q[i];
 var h="";
 for(var k=0;k<4;k++){h+='<button class="opt'+(ans[cur]===k?" sel":"")+'" onclick="pick('+k+')"><span class="l">'+L[k]+'</span><span>'+esc(q[2+k][i])+'</span></button>'}
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===Q.length-1;
 pal();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pal(){
 var h="";
 for(var i=0;i<Q.length;i++){
  var c=ans[i]>=0?"ans":(vis[i]?"vis":"");
  if(i===cur)c+=" cur";
  h+='<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
 }
 $("pg").innerHTML=h;
}
function pick(k){ans[cur]=k;render()}
function clearAns(){ans[cur]=-1;render()}
function go(d){var n=cur+d;if(n>=0&&n<Q.length){cur=n;render();window.scrollTo(0,0)}}
function jump(i){cur=i;render();$("pal").classList.remove("open");window.scrollTo(0,0)}
function togPal(){$("pal").classList.toggle("open")}
function counts(){var a=0;for(var i=0;i<ans.length;i++)if(ans[i]>=0)a++;return {a:a,s:Q.length-a}}
function openM(){var c=counts();$("mB").textContent=t("mB")(c.a,c.s);$("modal").classList.remove("hide")}
function askSubmit(){openM()}
function closeM(){$("modal").classList.add("hide")}
function finish(){
 if(done&&arguments.length===0&&$("test").classList.contains("hide"))return;
 done=true;clearInterval(tick);closeM();
 $("test").classList.add("hide");$("timer").classList.add("hide");$("result").classList.remove("hide");
 showResult();window.scrollTo(0,0);
}
function showResult(){
 var cor=0,wro=0,i;
 for(i=0;i<Q.length;i++){if(ans[i]>=0){if(ans[i]===Q[i][6])cor++;else wro++}}
 var att=cor+wro,skp=Q.length-att,neg=wro*MINUS,sc=cor*PLUS-neg;
 $("rT").textContent=t("rT");
 var nm=$("nm").value.replace(/^\s+|\s+$/g,"");
 $("rName").textContent=nm?nm:"";
 $("rScore").textContent=fmt(sc)+" / "+Q.length;
 $("rMark").textContent=t("mk");
 var items=[[t("tq"),Q.length,""],[t("att"),att,""],[t("skp"),skp,""],[t("cor"),cor,"color:#138808"],[t("wro"),wro,"color:#d32f2f"],[t("neg"),"−"+fmt(neg),"color:#d32f2f"]];
 $("rStats").innerHTML=items.map(function(x){return '<div class="st"><b style="'+x[2]+'">'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("");
 $("rvBtn").textContent=$("rev").classList.contains("hide")?t("rv"):t("hv");
 $("rtBtn").textContent=t("rt");
 var li=lang==="en"?0:1,h="";
 for(i=0;i<Q.length;i++){
  var q=Q[i],st=ans[i]<0?["sk","#6b7686"]:(ans[i]===q[6]?["ok","#138808"]:["no","#d32f2f"]);
  h+='<div class="rv"><div class="q">'+(i+1)+'. '+esc(q[li])+'<span class="tag" style="background:'+st[1]+'">'+t(st[0])+'</span></div>';
  for(var k=0;k<4;k++){
   var c="o";if(k===q[6])c+=" ok";else if(k===ans[i])c+=" no";
   var m=k===q[6]?" ✔":(k===ans[i]?" ✘ ("+t("ya")+")":"");
   h+='<div class="'+c+'"><b>'+L[k]+'.</b> '+esc(q[2+k][li])+m+'</div>';
  }
  h+='</div>';
 }
 $("rev").innerHTML=h;
}
function toggleRev(){$("rev").classList.toggle("hide");showResult()}
window.addEventListener("beforeunload",function(e){if(!done&&!$("test").classList.contains("hide")){e.preventDefault();e.returnValue=""}});
applyStatic();
</script>
