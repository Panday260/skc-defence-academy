<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b2447">
<title>SKC DEFENCE ACADEMY – SRT Mock Test 02</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:"Segoe UI","Noto Sans","Noto Sans Devanagari","Nirmala UI","Mangal",Roboto,Arial,sans-serif;background:#eef1f6;color:#1b2430;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:root{--navy:#0b2447;--navy2:#19376d;--gold:#f2b705;--green:#1e9e54;--red:#d63a3a;--grey:#c9d0dc}

/* Header */
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand .b1{font-weight:800;letter-spacing:.8px;font-size:18px;line-height:1.1;color:#fff}
.brand .b2{font-size:11px;color:var(--gold);letter-spacing:1.4px;font-weight:600}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lang{display:flex;border:1px solid var(--gold);border-radius:20px;overflow:hidden}
.lang button{background:transparent;color:#fff;border:0;padding:6px 12px;font-weight:600}
.lang button.on{background:var(--gold);color:var(--navy)}
.timer{background:#fff;color:var(--navy);border-radius:8px;padding:5px 12px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
.timer.warn{background:var(--red);color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.65}}
.pbtn{display:none;background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:7px 10px;font-weight:700}

.wrap{max-width:1200px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(11,36,71,.1);padding:16px}

/* Start screen */
.start h1{margin:0 0 4px;color:var(--navy);font-size:24px}
.start .sub{color:#556;margin-bottom:14px}
.start ul{padding-left:20px;margin:8px 0 18px}
.start li{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chip{background:#eef3fb;border:1px solid #d5e0f2;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--navy)}
.btn{border:0;border-radius:8px;padding:11px 20px;font-weight:700;color:#fff;background:var(--navy2)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.light{background:#e4e9f2;color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Test layout */
.layout{display:grid;grid-template-columns:1fr 310px;gap:12px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e3e8f1}
.qno{font-weight:800;color:var(--navy);font-size:18px}
.marks{font-size:13px;color:#445}
.marks b.p{color:var(--green)}.marks b.n{color:var(--red)}
.qtext{font-size:18px;font-weight:600;margin:6px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid #d9e0ec;border-radius:10px;padding:11px 12px;margin:9px 0;cursor:pointer;background:#fff;user-select:none;-webkit-user-select:none}
.opt:hover{border-color:#9db4dc}
.opt.sel{border-color:var(--navy2);background:#e8efff}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#e4e9f2;color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel .l{background:var(--navy2);color:#fff}
.opt .t{flex:1}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:space-between}
.nav .grp{display:flex;gap:8px;flex-wrap:wrap}

/* Palette */
.palette h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qb{height:42px;border-radius:8px;border:2px solid transparent;font-weight:700;background:var(--grey);color:#233}
.qb.ans{background:var(--green);color:#fff}
.qb.vis{background:var(--red);color:#fff}
.qb.cur{border-color:var(--navy);box-shadow:0 0 0 2px var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:12px;color:#445}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.counts{display:flex;gap:6px;margin-bottom:12px;font-size:12px;font-weight:700;text-align:center}
.counts div{flex:1;border-radius:8px;padding:6px 2px;color:#fff}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,15,35,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:20px}
.mbox h3{margin:0 0 8px;color:var(--navy)}
.mbox .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #dde}
.mbox .acts{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}

/* Result */
.score{text-align:center;padding:18px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;margin-bottom:14px}
.score .big{font-size:44px;font-weight:800;color:var(--gold)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.rbox{background:#fff;border-radius:10px;padding:12px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.08);border-top:4px solid var(--navy2)}
.rbox .n{font-size:26px;font-weight:800;color:var(--navy)}
.rbox .k{font-size:13px;color:#556}
.rbox.g{border-top-color:var(--green)}.rbox.r{border-top-color:var(--red)}.rbox.y{border-top-color:var(--gold)}
.rev{background:#fff;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 5px rgba(0,0,0,.07);border-left:5px solid var(--grey)}
.rev.c{border-left-color:var(--green)}.rev.w{border-left-color:var(--red)}
.rev .q{font-weight:600;margin-bottom:6px}
.rev .o{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:15px;background:#f4f6fa}
.rev .o.ok{background:#d9f3e3;border:1px solid var(--green)}
.rev .o.bad{background:#fbdcdc;border:1px solid var(--red)}
.tag{font-size:12px;font-weight:700;margin-left:6px}
.hide{display:none!important}
footer{text-align:center;color:#778;font-size:12px;padding:14px}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .pbtn{display:inline-block}
  .palette{position:fixed;top:0;right:0;bottom:0;width:86%;max-width:340px;z-index:90;border-radius:0;transform:translateX(105%);transition:transform .25s;overflow:auto;box-shadow:-4px 0 18px rgba(0,0,0,.3)}
  .palette.open{transform:translateX(0)}
  .pclose{display:block!important}
  .brand .b1{font-size:15px}.brand svg{width:34px;height:34px}
  .qtext{font-size:17px}
}
.pclose{display:none;float:right;background:#e4e9f2;border:0;border-radius:8px;padding:4px 10px;font-weight:700}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 3 56 12v20c0 14-10 24-24 29C18 56 8 46 8 32V12z" fill="#f2b705" stroke="#fff" stroke-width="2"/>
      <path d="M32 9 50 16v16c0 11-8 19-18 23C22 51 14 43 14 32V16z" fill="#0b2447"/>
      <path d="M32 18l3.5 8 8.5.8-6.5 5.7 2 8.5L32 36.5 24.5 41l2-8.5L20 26.8l8.5-.8z" fill="#f2b705"/>
    </svg>

      <button id="langHi">हिंदी</button>

  </div>
</header>

<div class="wrap">
  <!-- START -->
  <div id="startScr" class="card start">
    <h1 id="sTitle"></h1>
    <div class="sub" id="sSub"></div>
    <div class="chips" id="sChips"></div>
    <ul id="sRules"></ul>
    <button class="btn gold" id="startBtn"></button>
    <button class="btn light hide" id="resumeNote" style="display:none"></button>
  </div>

  <!-- TEST -->
  <div id="testScr" class="layout hide">
    <div class="card">
      <div class="qhead"><div class="qno" id="qno"></div><div class="marks" id="marks"></div></div>
      <div class="qtext" id="qtext"></div>
      <div id="opts"></div>
      <div class="nav">
        <div class="grp">
          <button class="btn light" id="prevBtn"></button>
          <button class="btn light" id="clearBtn"></button>
        </div>
        <div class="grp">
          <button class="btn" id="nextBtn"></button>
          <button class="btn red" id="submitBtn"></button>
        </div>
      </div>
    </div>
    <aside class="card palette" id="palette">
      <button class="pclose" id="pclose">✕</button>
      <h3 id="pTitle"></h3>
      <div class="counts" id="counts"></div>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
    </aside>
  </div>

  <!-- RESULT -->
  <div id="resScr" class="hide">
    <div class="score"><div id="rHead"></div><div class="big" id="rScore"></div><div id="rPct"></div></div>
    <div class="rgrid" id="rGrid"></div>
    <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn gold" id="retakeBtn"></button>
      <button class="btn light" id="printBtn"></button>
    </div>
    <h3 id="revTitle" style="color:#0b2447"></h3>
    <div id="review"></div>
  </div>
</div>

<footer>© SKC DEFENCE ACADEMY</footer>

<!-- Submit modal -->
<div class="modal" id="modal">
  <div class="mbox">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="acts">
      <button class="btn light" id="mCancel"></button>
      <button class="btn red" id="mOk"></button>
    </div>
  </div>
</div>

/* ============ STATE ============ */
var S = { lang: "en", cur: 0, ans: [], vis: [], end: 0, phase: "start", result: null };
var tick = null;
var KEY = "skc_" + TEST_ID;

function $(id) { return document.getElementById(id); }
function tx(k) { return T[S.lang][k]; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    var d = localStorage.getItem(KEY);
    if (d) { var o = JSON.parse(d); if (o && o.ans && o.ans.length === N) { for (var k in o) S[k] = o[k]; } }
  } catch (e) {}
}
function resetState() {
  S.cur = 0; S.ans = []; S.vis = [];
  for (var i = 0; i < N; i++) { S.ans.push(-1); S.vis.push(0); }
  S.end = 0; S.phase = "start"; S.result = null;
}
function L(pair) { return S.lang === "en" ? pair[0] : pair[1]; }
function show(id, on) { $(id).className = $(id).className.replace(/\bhide\b/g, "").replace(/\s+$/, "") + (on ? "" : " hide"); }
function fmt(s) { if (s < 0) s = 0; var m = Math.floor(s / 60), x = s % 60; return (m < 10 ? "0" : "") + m + ":" + (x < 10 ? "0" : "") + x; }
function round2(n) { return Math.round(n * 100) / 100; }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

/* ============ RENDER ============ */
function renderStatic() {
  document.documentElement.lang = S.lang === "en" ? "en" : "hi";
  $("langEn").className = S.lang === "en" ? "on" : "";
  $("langHi").className = S.lang === "hi" ? "on" : "";
  $("hsub").textContent = tx("sub");
  document.title = "SKC DEFENCE ACADEMY – " + TEST_NAME[S.lang];
  // start
  $("sTitle").textContent = TEST_NAME[S.lang];
  $("sSub").textContent = "SKC DEFENCE ACADEMY";
  var ch = $("sChips"); ch.innerHTML = "";
  for (var i = 0; i < 3; i++) ch.appendChild(el("div", "chip", tx("chips")[i]));
  var ru = $("sRules"); ru.innerHTML = "";
  for (var j = 0; j < tx("rules").length; j++) { var li = document.createElement("li"); li.innerHTML = tx("rules")[j]; ru.appendChild(li); }
  $("startBtn").textContent = S.phase === "test" ? tx("resume") : tx("start");
  // test buttons
  $("prevBtn").textContent = tx("prev"); $("nextBtn").textContent = tx("next");
  $("clearBtn").textContent = tx("clear"); $("submitBtn").textContent = tx("submit");
  $("pTitle").textContent = tx("palette"); $("pbtn").textContent = "☰ " + tx("pal");
  $("mCancel").textContent = tx("mCancel"); $("mOk").textContent = tx("mOk");
  var lg = $("legend");
  lg.innerHTML = '<span><i style="background:#1e9e54"></i>' + tx("lgAns") + '</span><span><i style="background:#d63a3a"></i>' + tx("lgNot") +
    '</span><span><i style="background:#c9d0dc"></i>' + tx("lgUn") + '</span><span><i style="background:#fff;border:2px solid #0b2447"></i>' + tx("lgCur") + '</span>';
}

function renderPalette() {
  var g = $("grid"); g.innerHTML = "";
  var a = 0, v = 0, u = 0;
  for (var i = 0; i < N; i++) {
    var cls = "qb";
    if (S.ans[i] >= 0) { cls += " ans"; a++; }
    else if (S.vis[i]) { cls += " vis"; v++; }
    else u++;
    if (i === S.cur) cls += " cur";
    var b = el("button", cls, String(i + 1));
    b.setAttribute("type", "button");
    (function (idx) { b.onclick = function () { goTo(idx); $("palette").className = $("palette").className.replace(" open", ""); }; })(i);
    g.appendChild(b);
  }
  $("counts").innerHTML =
    '<div style="background:#1e9e54">' + a + '<br>' + tx("cAns") + '</div>' +
    '<div style="background:#d63a3a">' + v + '<br>' + tx("cNot") + '</div>' +
    '<div style="background:#8b95a8">' + u + '<br>' + tx("cUn") + '</div>';
}

function renderQuestion() {
  var q = QS[S.cur];
  S.vis[S.cur] = 1;
  $("qno").textContent = tx("q") + " " + (S.cur + 1) + " / " + N;
  $("marks").innerHTML = '<b class="p">+' + PLUS + '</b> / <b class="n">−' + MINUS + '</b>';
  $("qtext").textContent = (S.cur + 1) + ". " + L(q.q);
  var box = $("opts"); box.innerHTML = "";
  var letters = ["A", "B", "C", "D"];
  for (var i = 0; i < 4; i++) {
    var d = el("div", "opt" + (S.ans[S.cur] === i ? " sel" : ""));
    d.appendChild(el("span", "l", letters[i]));
    d.appendChild(el("span", "t", L(q.o[i])));
    d.setAttribute("role", "button"); d.setAttribute("tabindex", "0");
    (function (idx) {
      d.onclick = function () { S.ans[S.cur] = idx; save(); renderQuestion(); };
      d.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); S.ans[S.cur] = idx; save(); renderQuestion(); } };
    })(i);
    box.appendChild(d);
  }
  $("prevBtn").disabled = S.cur === 0;
  $("nextBtn").disabled = S.cur === N - 1;
  renderPalette(); save();
}

function goTo(i) { if (i < 0 || i >= N) return; S.cur = i; renderQuestion(); window.scrollTo(0, 0); }

/* ============ TIMER ============ */
function updateTimer() {
  var left = Math.round((S.end - Date.now()) / 1000);
  var t = $("timer");
  t.textContent = fmt(left);
  t.className = "timer" + (left <= 300 ? " warn" : "");
  if (left <= 0) { clearInterval(tick); finish(true); }
}
function startTimer() { clearInterval(tick); updateTimer(); tick = setInterval(updateTimer, 500); }

/* ============ FLOW ============ */
function startTest() {
  if (S.phase !== "test") {
    resetState(); S.phase = "test"; S.end = Date.now() + DURATION * 1000;
  }
  show("startScr", false); show("resScr", false); show("testScr", true);
  show("timer", true); show("pbtn", true);
  renderStatic(); renderQuestion(); startTimer(); window.scrollTo(0, 0);
}

function openSubmit() {
  var a = 0; for (var i = 0; i < N; i++) if (S.ans[i] >= 0) a++;
  var left = Math.max(0, Math.round((S.end - Date.now()) / 1000));
  $("mTitle").textContent = tx("mTitle");
  $("mBody").innerHTML =
    '<div class="row"><span>' + tx("mAns") + '</span><b>' + a + '</b></div>' +
    '<div class="row"><span>' + tx("mUn") + '</span><b>' + (N - a) + '</b></div>' +
    '<div class="row"><span>' + tx("mLeft") + '</span><b>' + fmt(left) + '</b></div>';
  $("modal").className = "modal on";
}
function closeModal() { $("modal").className = "modal"; }

function finish(auto) {
  clearInterval(tick); closeModal();
  var att = 0, cor = 0, wr = 0;
  for (var i = 0; i < N; i++) {
    if (S.ans[i] >= 0) { att++; if (S.ans[i] === QS[i].a) cor++; else wr++; }
  }
  S.result = { att: att, cor: cor, wr: wr, skip: N - att, score: round2(cor * PLUS - wr * MINUS) };
  S.phase = "result"; save();
  showResult();
  if (auto) { try { alert(T.en.timeUp + "\n" + T.hi.timeUp); } catch (e) {} }
}

function showResult() {
  show("startScr", false); show("testScr", false); show("timer", false); show("pbtn", false); show("resScr", true);
  renderStatic(); renderResult(); window.scrollTo(0, 0);
}

function renderResult() {
  var r = S.result; if (!r) return;
  $("rHead").textContent = tx("rHead") + " – " + TEST_NAME[S.lang];
  $("rScore").textContent = r.score + " / " + (N * PLUS);
  var acc = r.att ? Math.round(r.cor / r.att * 100) : 0;
  $("rPct").textContent = tx("acc") + ": " + acc + "%";
  var items = [
    [tx("total"), N, ""], [tx("att"), r.att, "y"], [tx("skip"), r.skip, ""],
    [tx("cor"), r.cor + "  (+" + r.cor * PLUS + ")", "g"], [tx("wr"), r.wr + "  (−" + round2(r.wr * MINUS) + ")", "r"], [tx("sc"), r.score, "y"]
  ];
  var g = $("rGrid"); g.innerHTML = "";
  for (var i = 0; i < items.length; i++) {
    var b = el("div", "rbox " + items[i][2]);
    b.appendChild(el("div", "n", String(items[i][1])));
    b.appendChild(el("div", "k", items[i][0]));
    g.appendChild(b);
  }
  $("retakeBtn").textContent = tx("retake"); $("printBtn").textContent = tx("print"); $("revTitle").textContent = tx("rev");
  var rv = $("review"); rv.innerHTML = "";
  var letters = ["A", "B", "C", "D"];
  for (var k = 0; k < N; k++) {
    var q = QS[k], u = S.ans[k];
    var st = u < 0 ? "" : (u === q.a ? "c" : "w");
    var card = el("div", "rev " + st);
    var qd = el("div", "q", (k + 1) + ". " + L(q.q));
    var tag = el("span", "tag", u < 0 ? "(" + tx("sk") + ")" : (u === q.a ? "(" + tx("ok") + " +" + PLUS + ")" : "(" + tx("bad") + " −" + MINUS + ")"));
    tag.style.color = u < 0 ? "#778" : (u === q.a ? "#1e9e54" : "#d63a3a");
    qd.appendChild(tag); card.appendChild(qd);
    for (var j = 0; j < 4; j++) {
      var c = "o"; if (j === q.a) c += " ok"; else if (j === u) c += " bad";
      var o = el("div", c, letters[j] + ". " + L(q.o[j]));
      if (j === q.a) o.appendChild(el("span", "tag", "✔ " + tx("correct")));
      else if (j === u) o.appendChild(el("span", "tag", "✘ " + tx("yours")));
      card.appendChild(o);
    }
    rv.appendChild(card);
  }
}

function setLang(l) {
  S.lang = l; save(); renderStatic();
  if (S.phase === "test") renderQuestion();
  else if (S.phase === "result") renderResult();
}

/* ============ EVENTS ============ */
$("langEn").onclick = function () { setLang("en"); };
$("langHi").onclick = function () { setLang("hi"); };
$("startBtn").onclick = startTest;
$("prevBtn").onclick = function () { goTo(S.cur - 1); };
$("nextBtn").onclick = function () { goTo(S.cur + 1); };
$("clearBtn").onclick = function () { S.ans[S.cur] = -1; save(); renderQuestion(); };
$("submitBtn").onclick = openSubmit;
$("mCancel").onclick = closeModal;
$("mOk").onclick = function () { finish(false); };
$("pbtn").onclick = function () { $("palette").className += " open"; };
$("pclose").onclick = function () { $("palette").className = $("palette").className.replace(" open", ""); };
$("retakeBtn").onclick = function () {
  if (confirm(tx("retakeConfirm"))) { resetState(); save(); show("resScr", false); show("startScr", true); renderStatic(); window.scrollTo(0, 0); }
};
$("printBtn").onclick = function () { window.print(); };
document.addEventListener("keydown", function (e) {
  if (S.phase !== "test") return;
  if (e.key === "ArrowRight") goTo(S.cur + 1);
  else if (e.key === "ArrowLeft") goTo(S.cur - 1);
});

/* ============ INIT ============ */
resetState(); load();
renderStatic();
if (S.phase === "test") {
  if (Date.now() >= S.end) { finish(false); }
  else { startTest(); }
} else if (S.phase === "result" && S.result) {
  showResult();
}
</script>
</body>
</html>
