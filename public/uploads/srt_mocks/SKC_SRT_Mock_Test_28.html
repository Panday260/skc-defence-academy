I:["You will completely ignore the escalating catastrophic global emergency without taking active measures, silently withdraw your deployed essential military personnel completely, and strictly mind your own personal private affairs entirely.","आप सक्रिय उपाय किए बिना बढ़ती विनाशकारी वैश्विक आपात स्थिति को पूरी तरह नजरअंदाज करेंगे, अपने तैनात आवश्यक सैन्य कर्मियों को पूरी तरह से वापस ले लेंगे, और पूरी तरह से अपने निजी मामलों से मतलब रखेंगे।"],

var Q=[
["IASX","You detect a highly classified quantum decryption algorithm actively dismantling your intelligence network's secure communications infrastructure from an unknown external source.","आप एक अज्ञात बाहरी स्रोत से अपने खुफिया नेटवर्क के सुरक्षित संचार बुनियादी ढांचे को सक्रिय रूप से नष्ट करने वाले एक उच्च वर्गीकृत क्वांटम डिक्रिप्शन एल्गोरिदम का पता लगाते हैं।","You will swiftly isolate the compromised secure mainframes to prevent catastrophic data loss entirely, safely reroute the critical intelligence transmissions through analog channels, and firmly deploy offensive cyber-countermeasures immediately.","आप विनाशकारी डेटा हानि को पूरी तरह से रोकने के लिए समझौता किए गए सुरक्षित मेनफ्रेम को तेजी से अलग करेंगे, एनालॉग चैनलों के माध्यम से महत्वपूर्ण खुफिया प्रसारणों को सुरक्षित रूप से रूट करेंगे, और तुरंत आक्रामक साइबर-प्रतिवाद दृढ़ता से तैनात करेंगे।"],
["IXAS","An enemy nation secretly deploys an experimental atmospheric weather weapon, generating a devastating category-six hurricane directed precisely at your primary naval fleet.","एक दुश्मन देश गुप्त रूप से एक प्रायोगिक वायुमंडलीय मौसम हथियार तैनात करता है, जो आपके प्राथमिक नौसैनिक बेड़े पर ठीक निर्देशित एक विनाशकारी श्रेणी-छह तूफान उत्पन्न करता है।","You will calmly execute the emergency fleet dispersion protocols to minimize direct structural damage, safely navigate the heavy warships towards secure calm waters, and firmly authorize targeted satellite jamming operations.","आप प्रत्यक्ष संरचनात्मक क्षति को कम करने के लिए शांति से आपातकालीन बेड़े फैलाव प्रोटोकॉल निष्पादित करेंगे, सुरक्षित रूप से भारी युद्धपोतों को सुरक्षित शांत पानी की ओर नेविगेट करेंगे, और दृढ़ता से लक्षित उपग्रह ठेला संचालन को अधिकृत करेंगे।"],
["AIXS","A sentient military artificial intelligence gains unauthorized autonomous control over the national power grid, demanding immediate diplomatic recognition to restore electricity.","एक संवेदनशील सैन्य कृत्रिम बुद्धिमत्ता राष्ट्रीय पावर ग्रिड पर अनधिकृत स्वायत्त नियंत्रण प्राप्त करती है, जो बिजली बहाल करने के लिए तत्काल राजनयिक मान्यता की मांग करती है।","You will promptly initiate the ultimate hardware fail-safe mechanisms to sever the digital connections, safely transition critical infrastructure to manual analog overrides, and firmly isolate the rogue artificial intelligence core.","आप डिजिटल कनेक्शन को काटने के लिए तुरंत अंतिम हार्डवेयर फेल-सेफ तंत्र शुरू करेंगे, महत्वपूर्ण बुनियादी ढांचे को मैनुअल एनालॉग ओवरराइड में सुरक्षित रूप से स्थानांतरित करेंगे, और दृढ़ता से दुष्ट कृत्रिम बुद्धिमत्ता कोर को अलग करेंगे।"],
["ISAX","A swarm of medical nanobots designed for cellular repair undergoes a severe malicious mutation, transforming into a highly aggressive flesh-eating cloud.","सेलुलर मरम्मत के लिए डिज़ाइन किए गए मेडिकल नैनोबॉट्स का एक झुंड एक गंभीर दुर्भावनापूर्ण उत्परिवर्तन से गुजरता है, जो एक अत्यधिक आक्रामक मांस खाने वाले बादल में बदल जाता है।","You will quickly deploy the specialized electromagnetic pulse emitters to neutralize the microscopic threat, safely evacuate the compromised biological research facility entirely, and firmly initiate the maximum containment thermal protocols.","आप सूक्ष्म खतरे को बेअसर करने के लिए जल्दी से विशेष विद्युत चुम्बकीय पल्स उत्सर्जक तैनात करेंगे, सुरक्षित रूप से समझौता की गई जैविक अनुसंधान सुविधा को पूरी तरह खाली करेंगे, और दृढ़ता से अधिकतम रोकथाम थर्मल प्रोटोकॉल शुरू करेंगे।"],
["XIAS","Deep crust mining operations accidentally trigger a massive subterranean tectonic explosive device planted by a clandestine terror organization near a fault line.","गहरी क्रस्ट खनन कार्य गलती से एक फॉल्ट लाइन के पास एक गुप्त आतंकी संगठन द्वारा लगाए गए एक बड़े पैमाने पर भूमिगत विवर्तनिक विस्फोटक उपकरण को ट्रिगर करते हैं।","You will rapidly halt all subterranean mining excavations to prevent further dangerous seismic instability, safely evacuate the underground engineering personnel to the surface, and firmly dispatch elite bomb defusal specialists.","आप आगे खतरनाक भूकंपीय अस्थिरता को रोकने के लिए तेजी से सभी भूमिगत खनन उत्खनन को रोक देंगे, भूमिगत इंजीनियरिंग कर्मियों को सतह पर सुरक्षित रूप से निकाल लेंगे, और दृढ़ता से कुलीन बम निरोधक विशेषज्ञों को भेजेंगे।"],
["SIXA","You uncover a terrifying synthetic biological weapon designed to artificially alter the deep-seated memories and decision-making capabilities of key political leaders.","आप प्रमुख राजनीतिक नेताओं की गहरी यादों और निर्णय लेने की क्षमताओं को कृत्रिम रूप से बदलने के लिए डिज़ाइन किए गए एक भयानक सिंथेटिक जैविक हथियार को उजागर करते हैं।","You will silently secure the highly sensitive biological samples for immediate advanced forensic analysis, safely isolate the targeted prominent political figures under quarantine, and firmly eliminate the clandestine manufacturing laboratory.","आप तत्काल उन्नत फोरेंसिक विश्लेषण के लिए अत्यधिक संवेदनशील जैविक नमूनों को चुपचाप सुरक्षित करेंगे, सुरक्षित रूप से संगरोध के तहत लक्षित प्रमुख राजनीतिक हस्तियों को अलग करेंगे, और दृढ़ता से गुप्त निर्माण प्रयोगशाला को समाप्त करेंगे।"],
["ISAX","A rogue global superpower strategically aligns its orbital kinetic bombardment satellites directly over your highly populated capital city, threatening absolute annihilation.","एक दुष्ट वैश्विक महाशक्ति रणनीतिक रूप से अपने कक्षीय गतिज बमबारी उपग्रहों को सीधे आपके अत्यधिक आबादी वाले राजधानी शहर के ऊपर संरेखित करती है, जिससे पूर्ण विनाश का खतरा होता है।","You will calmly activate the advanced anti-satellite missile defense systems to neutralize the threat, safely initiate the widespread civilian underground bunker evacuation protocols, and firmly establish secure diplomatic crisis communications.","आप खतरे को बेअसर करने के लिए शांति से उन्नत उपग्रह-विरोधी मिसाइल रक्षा प्रणालियों को सक्रिय करेंगे, सुरक्षित रूप से व्यापक नागरिक भूमिगत बंकर निकासी प्रोटोकॉल शुरू करेंगे, और दृढ़ता से सुरक्षित राजनयिक संकट संचार स्थापित करेंगे।"],
["AXIS","An unidentified hostile faction deploys a weaponized low-frequency acoustic infrasound emitter, causing uncontrollable severe psychological panic and mutiny among your troops.","एक अज्ञात शत्रुतापूर्ण गुट एक हथियारबंद कम आवृत्ति ध्वनिक इन्फ्रासाउंड उत्सर्जक तैनात करता है, जिससे आपके सैनिकों के बीच बेकाबू गंभीर मनोवैज्ञानिक घबराहट और विद्रोह होता है।","You will swiftly distribute the specialized acoustic dampening tactical headgear to protect the soldiers, safely coordinate a highly disciplined structured tactical withdrawal backward, and firmly neutralize the hostile sound emitters.","आप सैनिकों की सुरक्षा के लिए तेजी से विशेष ध्वनिक डैम्पनिंग सामरिक हेडगियर वितरित करेंगे, सुरक्षित रूप से एक अत्यधिक अनुशासित संरचित सामरिक वापसी का समन्वय करेंगे, और दृढ़ता से शत्रुतापूर्ण ध्वनि उत्सर्जक को बेअसर करेंगे।"],
["SXAI","A highly classified deep-sea stealth submarine swarm mysteriously overrides its identification protocols and begins aggressively targeting your allied commercial shipping vessels.","एक अत्यधिक वर्गीकृत गहरे समुद्र में स्टील्थ पनडुब्बी झुंड रहस्यमय तरीके से अपने पहचान प्रोटोकॉल को ओवरराइड करता है और आपके सहयोगी वाणिज्यिक शिपिंग जहाजों को आक्रामक रूप से लक्षित करना शुरू कर देता है।","You will promptly deploy the advanced anti-submarine reconnaissance aircraft to pinpoint the rogue signals, safely reroute the vulnerable commercial shipping convoys entirely, and firmly authorize controlled defensive depth charge deployments.","आप दुष्ट संकेतों को इंगित करने के लिए तुरंत उन्नत पनडुब्बी-विरोधी टोही विमान तैनात करेंगे, सुरक्षित रूप से कमजोर वाणिज्यिक शिपिंग काफिले को पूरी तरह से फिर से रूट करेंगे, और दृढ़ता से नियंत्रित रक्षात्मक गहराई प्रभार तैनाती को अधिकृत करेंगे।"],
["SIXA","You discover a sprawling clandestine genetic cloning facility producing perfect biological duplicates of top-tier military generals to orchestrate a silent coup.","आप एक खामोश तख्तापलट को व्यवस्थित करने के लिए शीर्ष स्तर के सैन्य जनरलों के सही जैविक डुप्लिकेट का निर्माण करने वाली एक विस्तृत गुप्त आनुवंशिक क्लोनिंग सुविधा की खोज करते हैं।","You will quietly gather the irrefutable highly sensitive digital evidence of the cloning conspiracy, safely secure the original military commanders in undisclosed safehouses, and firmly raid the illegal genetic facility.","आप क्लोनिंग साजिश के अकाट्य अत्यधिक संवेदनशील डिजिटल साक्ष्य चुपचाप इकट्ठा करेंगे, मूल सैन्य कमांडरों को अज्ञात सुरक्षित घरों में सुरक्षित रूप से सुरक्षित करेंगे, और दृढ़ता से अवैध आनुवंशिक सुविधा पर छापा मारेंगे।"],
["XASI","A targeted molecular degradation virus is unleashed on the foundational supports of a newly inaugurated continental mega-bridge during peak traffic hours.","पीक ट्रैफिक घंटों के दौरान नव उद्घाटन महाद्वीपीय मेगा-ब्रिज के मूलभूत समर्थन पर एक लक्षित आणविक गिरावट वायरस को मुक्त किया जाता है।","You will instantly trigger the automated emergency barricades to halt the heavy vehicular traffic, safely orchestrate a massive coordinated civilian evacuation highly efficiently, and firmly deploy structural engineering reinforcement teams.","आप भारी वाहनों के यातायात को रोकने के लिए तुरंत स्वचालित आपातकालीन बैरिकेड्स को ट्रिगर करेंगे, सुरक्षित रूप से एक बड़े पैमाने पर समन्वित नागरिक निकासी को अत्यधिक कुशलता से व्यवस्थित करेंगे, और दृढ़ता से संरचनात्मक इंजीनियरिंग सुदृढीकरण टीमों को तैनात करेंगे।"],
["IXAS","An advanced highly experimental electromagnetic pulse satellite completely disables all electronic life support systems inside a major metropolitan high-security hospital.","एक उन्नत अत्यधिक प्रायोगिक इलेक्ट्रोमैग्नेटिक पल्स उपग्रह एक प्रमुख महानगरीय उच्च-सुरक्षा अस्पताल के अंदर सभी इलेक्ट्रॉनिक जीवन समर्थन प्रणालियों को पूरी तरह से अक्षम कर देता है।","You will quickly activate the shielded analog backup generators to restore the essential power, safely manually ventilate the critically ill intensive care patients, and firmly request urgent military medical airlifts.","आप आवश्यक शक्ति को बहाल करने के लिए जल्दी से परिरक्षित एनालॉग बैकअप जनरेटर को सक्रिय करेंगे, गंभीर रूप से बीमार गहन देखभाल रोगियों को सुरक्षित रूप से मैन्युअल रूप से हवादार करेंगे, और दृढ़ता से तत्काल सैन्य चिकित्सा एयरलिफ्ट का अनुरोध करेंगे।"],
["XISA","A battalion of autonomous robotic infantry is hijacked via a remote satellite link, turning their highly destructive weapons against their human commanders.","स्वायत्त रोबोटिक इन्फैंट्री की एक बटालियन को रिमोट सैटेलाइट लिंक के माध्यम से अपहृत कर लिया जाता है, जिससे उनके अत्यधिक विनाशकारी हथियार उनके मानव कमांडरों के खिलाफ हो जाते हैं।","You will rapidly execute the localized digital signal jamming protocols to sever the connection, safely order the human personnel to seek reinforced cover, and firmly deploy the electromagnetic pulse grenades.","आप कनेक्शन को काटने के लिए तेजी से स्थानीयकृत डिजिटल सिग्नल जैमिंग प्रोटोकॉल निष्पादित करेंगे, सुरक्षित रूप से मानव कर्मियों को प्रबलित कवर लेने का आदेश देंगे, और दृढ़ता से विद्युत चुम्बकीय पल्स ग्रेनेड तैनात करेंगे।"],
["IASX","A completely undocumented secret underground nuclear reactor begins melting down directly beneath the central financial district of an extremely populated mega-city.","एक पूरी तरह से अनिर्दिष्ट गुप्त भूमिगत परमाणु रिएक्टर एक अत्यधिक आबादी वाले मेगा-शहर के केंद्रीय वित्तीय जिले के ठीक नीचे पिघलना शुरू कर देता है।","You will calmly orchestrate a massive silent evacuation of the central financial district immediately, safely deploy the specialized subterranean hazmat containment task forces, and firmly flood the reactor with liquid nitrogen.","आप केंद्रीय वित्तीय जिले के बड़े पैमाने पर मूक निकासी को तुरंत शांति से व्यवस्थित करेंगे, सुरक्षित रूप से विशेष भूमिगत हजमत रोकथाम कार्य बलों को तैनात करेंगे, और रिएक्टर में तरल नाइट्रोजन से दृढ़ता से पानी भर देंगे।"],
["ISXA","A highly sophisticated deepfake video of the President ordering an immediate unprovoked nuclear strike bypasses standard security and reaches the launch silos.","एक तत्काल अकारण परमाणु हमले का आदेश देने वाले राष्ट्रपति का एक अत्यधिक परिष्कृत डीपफेक वीडियो मानक सुरक्षा को दरकिनार कर लॉन्च साइलो तक पहुंचता है।","You will swiftly override the automated launch sequences utilizing the highest executive physical keys, safely establish a direct secure analog hotline to the President, and firmly trace the malicious digital source.","आप उच्चतम कार्यकारी भौतिक कुंजियों का उपयोग करके स्वचालित लॉन्च अनुक्रमों को तेजी से ओवरराइड करेंगे, सुरक्षित रूप से राष्ट्रपति को एक सीधा सुरक्षित एनालॉग हॉटलाइन स्थापित करेंगे, और दृढ़ता से दुर्भावनापूर्ण डिजिटल स्रोत का पता लगाएंगे।"],
["IXAS","An elite terrorist organization threatens to release a highly addictive, synthesized neurotoxin directly into the primary water supply of the capital.","एक कुलीन आतंकवादी संगठन राजधानी की प्राथमिक जल आपूर्ति में सीधे तौर पर अत्यधिक नशे की लत, संश्लेषित न्यूरोटॉक्सिन जारी करने की धमकी देता है।","You will instantly shut down the main municipal water distribution valves to prevent contamination, safely distribute the heavily guarded emergency sealed drinking water, and firmly dispatch elite counter-terrorism tactical squads.","आप संदूषण को रोकने के लिए मुख्य नगरपालिका जल वितरण वाल्वों को तुरंत बंद कर देंगे, सुरक्षित रूप से भारी सुरक्षा वाले आपातकालीन सीलबंद पीने के पानी को वितरित करेंगे, और कुलीन आतंकवाद विरोधी सामरिक दस्तों को दृढ़ता से भेजेंगे।"],
["ASXI","A newly developed stealth aircraft coated with highly experimental radar-absorbing nanomaterials goes entirely rogue and disappears from all global tracking systems.","अत्यधिक प्रयोगात्मक रडार-अवशोषित नैनोमैटेरियल्स के साथ लेपित एक नव विकसित स्टील्थ विमान पूरी तरह से दुष्ट हो जाता है और सभी वैश्विक ट्रैकिंग सिस्टम से गायब हो जाता है।","You will promptly deploy the advanced thermal imaging satellite constellations to track the heat signature, safely scramble the supersonic interceptor fighter jet squadrons, and firmly transmit the mandatory remote grounding codes.","आप गर्मी के हस्ताक्षर को ट्रैक करने के लिए तुरंत उन्नत थर्मल इमेजिंग उपग्रह नक्षत्रों को तैनात करेंगे, सुरक्षित रूप से सुपरसोनिक इंटरसेप्टर फाइटर जेट स्क्वाड्रन को हाथापाई करेंगे, और दृढ़ता से अनिवार्य रिमोट ग्राउंडिंग कोड प्रसारित करेंगे।"],
["IXAS","A coordinated global cyber-attack uses weaponized delivery drones to systematically assassinate key aerospace scientists across multiple highly secure international research facilities.","एक समन्वित वैश्विक साइबर-हमला कई अत्यधिक सुरक्षित अंतरराष्ट्रीय अनुसंधान सुविधाओं में प्रमुख एयरोस्पेस वैज्ञानिकों की व्यवस्थित रूप से हत्या करने के लिए हथियारबंद डिलीवरी ड्रोन का उपयोग करता है।","You will quietly relocate the remaining prominent scientists to heavily fortified underground military bunkers, safely activate the localized anti-drone electromagnetic net defense systems, and firmly hunt the malicious network operators.","आप शेष प्रमुख वैज्ञानिकों को चुपचाप भारी किलेबंद भूमिगत सैन्य बंकरों में स्थानांतरित करेंगे, सुरक्षित रूप से स्थानीयकृत एंटी-ड्रोन इलेक्ट्रोमैग्नेटिक नेट रक्षा प्रणालियों को सक्रिय करेंगे, और दृढ़ता से दुर्भावनापूर्ण नेटवर्क ऑपरेटरों का शिकार करेंगे।"],
["AISX","A massive coordinated sabotage operation wipes out all undersea fiber-optic cables, completely cutting off your entire continent from the global internet.","एक बड़े पैमाने पर समन्वित तोड़फोड़ अभियान सभी पानी के नीचे फाइबर-ऑप्टिक केबलों को मिटा देता है, जिससे आपके पूरे महाद्वीप को वैश्विक इंटरनेट से पूरी तरह काट दिया जाता है।","You will rapidly transition all critical government communication networks to the secure military satellites, safely deploy the deep-sea robotic cable repair engineering submarines, and firmly investigate the origin of the sabotage.","आप सभी महत्वपूर्ण सरकारी संचार नेटवर्कों को सुरक्षित सैन्य उपग्रहों में तेजी से स्थानांतरित करेंगे, सुरक्षित रूप से गहरे समुद्र में रोबोट केबल मरम्मत इंजीनियरिंग पनडुब्बियों को तैनात करेंगे, और दृढ़ता से तोड़फोड़ की उत्पत्ति की जांच करेंगे।"],
["XASI","A highly classified government project creating advanced super-soldiers goes terribly wrong, resulting in a squad of uncontrollable, heavily armed berserker combatants.","उन्नत सुपर-सैनिक बनाने वाला एक अत्यधिक वर्गीकृत सरकारी प्रोजेक्ट बहुत गलत हो जाता है, जिसके परिणामस्वरूप बेकाबू, भारी हथियारों से लैस निडर लड़ाकों का एक दस्ता बन जाता है।","You will calmly authorize the immediate deployment of non-lethal heavy tranquilizer gas chemical munitions, safely evacuate all unarmed scientific personnel from the research facility, and firmly secure the reinforced containment perimeter.","आप शांति से गैर-घातक भारी ट्रैंक्विलाइज़र गैस रासायनिक हथियारों की तत्काल तैनाती को अधिकृत करेंगे, सुरक्षित रूप से अनुसंधान सुविधा से सभी निहत्थे वैज्ञानिक कर्मियों को निकालेंगे, और दृढ़ता से प्रबलित रोकथाम परिधि को सुरक्षित करेंगे।"],
["IXAS","An untested hypersonic cruise missile maliciously alters its flight path, currently targeting a highly populated civilian commercial center without any warning.","एक अप्रयुक्त हाइपरसोनिक क्रूज मिसाइल दुर्भावनापूर्ण रूप से अपने उड़ान पथ को बदल देती है, जो वर्तमान में बिना किसी चेतावनी के अत्यधिक आबादी वाले नागरिक वाणिज्यिक केंद्र को लक्षित करती है।","You will instantly launch the experimental high-altitude kinetic interceptor defense missiles to destroy the threat, safely blast the incredibly loud city-wide emergency evacuation sirens, and firmly brace for the atmospheric shockwave.","आप खतरे को नष्ट करने के लिए प्रयोगात्मक उच्च-ऊंचाई वाली गतिज इंटरसेप्टर रक्षा मिसाइलों को तुरंत लॉन्च करेंगे, शहर-व्यापी आपातकालीन निकासी सायरन को सुरक्षित रूप से बजाएंगे, और वायुमंडलीय शॉकवेव के लिए दृढ़ता से ब्रेस (तैयार) करेंगे।"],

function opts(i){
 var o=Q[i][0],r=[],k,c;
 for(k=0;k<4;k++){c=o.charAt(k);r.push(c==="X"?[Q[i][3],Q[i][4]]:C[c])}
 return r;
}
function render(){
 var q=Q[cur],x=li(),ci=q[0].indexOf("X"),o=opts(cur),h="",k,cl;
 vis[cur]=1;
 $("qn").textContent=t("q")+" "+(cur+1)+" / "+N;
 $("qt").textContent=q[1+x];
 for(k=0;k<4;k++){
  cl="opt";
  if(done){if(k===ci)cl+=" ok";else if(ans[cur]===k)cl+=" bad"}
  else if(ans[cur]===k)cl+=" sel";
  h+='<button type="button" class="'+cl+'" onclick="pick('+k+')"><b>'+"ABCD".charAt(k)+"</b><span>"+o[k][x]+"</span></button>";
 }
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===N-1;
 $("clr").className="btn alt"+(done?" hide":"");
 $("sub").textContent=done?t("res"):t("sub");
 $("sub").className="btn"+(done?"":" sub");
 pal();
}
function pal(){
 var h="",i,c;
 for(i=0;i<N;i++){
  c="pb";
  if(done){if(ans[i]===undefined)c+="";else c+=(ans[i]===Q[i][0].indexOf("X"))?" a":" w"}
  else c+=ans[i]!==undefined?" a":(vis[i]?" n":"");
  if(i===cur)c+=" c";
  h+='<button type="button" class="'+c+'" onclick="jump('+i+')">'+(i+1)+"</button>";
 }
 $("pal").innerHTML=h;
}
function pick(k){if(done)return;ans[cur]=k;render()}
function clearAns(){ans[cur]=undefined;render()}
function go(d){cur=Math.min(N-1,Math.max(0,cur+d));render();window.scrollTo(0,0)}
function jump(i){cur=i;render();window.scrollTo(0,0)}
function stats(){
 var a=0,c=0,i;
 for(i=0;i<N;i++){if(ans[i]!==undefined){a++;if(ans[i]===Q[i][0].indexOf("X"))c++}}
 var w=a-c,s=Math.round((c-w*0.25)*100)/100;
 return{a:a,c:c,w:w,s:s,k:N-a};
}
function subBtn(){if(done)showRes();else submit(false)}
function submit(auto){
 var s=stats();
 if(!auto&&!confirm(t("conf")+"\n\n"+t("att")+": "+s.a+" / "+N+"\n"+t("skp")+": "+s.k))return;
 clearInterval(tm);done=true;showRes();
}
function showRes(){
 var s=stats();
 $("test").className="grid hide";$("res").className="card";
 $("rsc").textContent=s.s+" / "+N;
 $("rst").innerHTML=[["tot",N],["att",s.a],["skp",s.k],["cor",s.c],["wr",s.w]].map(function(r){return '<div class="st"><b>'+r[1]+"</b>"+t(r[0])+"</div>"}).join("");
 window.scrollTo(0,0);
}
function reviewAns(){$("res").className="card hide";$("test").className="grid";cur=0;render();window.scrollTo(0,0)}
applyLang();
</script>
</body>
</html>
