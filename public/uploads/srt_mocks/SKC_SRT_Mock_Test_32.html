<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKC DEFENCE ACADEMY - SRT Mock Test 32</title>
<style>
:root{--navy:#0b2a5b;--navy2:#143d86;--saf:#ff9933;--grn:#138808;--bg:#f2f5fa;--card:#fff;--tx:#1b2433;--mut:#6b7686;--bd:#d9e0ec;--red:#d32f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Mangal","Nirmala UI",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--saf);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.hin{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid var(--saf);flex:none}
.brand{flex:1;min-width:150px}
.brand b{display:block;font-size:18px;letter-spacing:.5px}
.brand span{font-size:12px;opacity:.85}
.tools{display:flex;align-items:center;gap:8px}
.timer{background:#fff;color:var(--navy);font-weight:800;font-size:18px;padding:5px 12px;border-radius:8px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.timer.low{background:var(--red);color:#fff}
.btn{border:0;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--navy2);color:#fff}
.b-grn{background:var(--grn);color:#fff}
.b-saf{background:var(--saf);color:#222}
.b-out{background:#fff;color:var(--navy2);border:2px solid var(--navy2)}
.lang{display:flex;border-radius:8px;overflow:hidden;border:2px solid var(--saf)}
.lang button{border:0;background:transparent;color:#fff;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--saf);color:#222}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hide{display:none!important}
.start{max-width:640px;margin:20px auto;text-align:center}
.start h1{color:var(--navy);margin:6px 0}
.start ul{text-align:left;padding-left:20px}
.start input{width:100%;padding:12px;font-size:16px;border:2px solid var(--bd);border-radius:8px;margin:8px 0 14px;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:600}
.qtext{font-size:18px;font-weight:600;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#e8edf6;color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--navy2);background:#e9f0ff}
.opt.sel .l{background:var(--navy2);color:#fff}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nav .sp{flex:1}
.pal h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pg button{height:40px;border-radius:8px;border:2px solid var(--bd);background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.pg button.ans{background:var(--grn);border-color:var(--grn);color:#fff}
.pg button.vis{background:#ffe5e5;border-color:var(--red)}
.pg button.cur{outline:3px solid var(--saf);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;margin-top:12px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--bd)}
.ptog{display:none;width:100%;margin-bottom:10px}
.res{max-width:760px;margin:10px auto}
.res h2{text-align:center;color:var(--navy);margin:4px 0}
.score{text-align:center;font-size:46px;font-weight:800;color:var(--navy2);margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.st{border-radius:10px;padding:12px;text-align:center;background:#f2f5fa;border:1px solid var(--bd)}
.st b{display:block;font-size:24px}
.st span{font-size:12px;color:var(--mut)}
.rv{border-top:1px solid var(--bd);padding:12px 0}
.rv .q{font-weight:600;margin-bottom:6px}
.rv .o{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:15px;border:1px solid var(--bd)}
.rv .o.ok{background:#e3f5e1;border-color:var(--grn)}
.rv .o.no{background:#ffe5e5;border-color:var(--red)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:380px;width:100%;text-align:center}
footer{text-align:center;font-size:12px;color:var(--mut);padding:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.ptog{display:block}.pal{display:none}.pal.open{display:block}.qtext{font-size:17px}.brand b{font-size:15px}}
</style>
</head>
<body>
<header><div class="hin">
 <div class="logo">SKC</div>
 <div class="brand"><b>SKC DEFENCE ACADEMY</b><span id="ttl">SRT Test Series – Mock Test 32</span></div>
 <div class="tools">
  <div class="lang"><button id="bEn" class="on" onclick="setLang('en')">English</button><button id="bHi" onclick="setLang('hi')">हिन्दी</button></div>
  <div class="timer hide" id="timer">30:00</div>
 </div>
</div></header>

<main>
<section id="start" class="card start">
 <div class="logo" style="margin:0 auto;width:64px;height:64px;font-size:20px;background:var(--navy);color:#fff">SKC</div>
 <h1 id="sT">SRT Mock Test 32</h1>
 <p id="sSub" style="color:var(--mut);margin:0 0 10px">SKC DEFENCE ACADEMY</p>
 <ul id="sIns"></ul>
 <input id="nm" type="text" maxlength="40" autocomplete="name">
 <button class="btn b-grn" id="sBtn" onclick="startTest()" style="width:100%;font-size:17px"></button>
</section>

<section id="test" class="hide">
 <button class="btn b-out ptog" id="ptog" onclick="togPal()"></button>
 <div class="grid">
  <div class="card">
   <div class="qhead"><span id="qno"></span><span id="qsts"></span></div>
   <div class="qtext" id="qtext"></div>
   <div id="opts"></div>
   <div class="nav">
    <button class="btn b-out" id="prev" onclick="go(-1)"></button>
    <button class="btn b-saf" id="clr" onclick="clearAns()"></button>
    <span class="sp"></span>
    <button class="btn b-pri" id="next" onclick="go(1)"></button>
   </div>
   <div style="margin-top:14px"><button class="btn b-grn" id="sub" onclick="askSubmit()" style="width:100%"></button></div>
  </div>
  <div class="card pal" id="pal">
   <h3 id="palT"></h3>
   <div class="pg" id="pg"></div>
   <div class="leg">
    <span><i style="background:var(--grn)"></i><b id="lA"></b></span>
    <span><i style="background:#ffe5e5;border-color:var(--red)"></i><b id="lN"></b></span>
    <span><i style="background:#fff"></i><b id="lU"></b></span>
   </div>
  </div>
 </div>
</section>

<section id="result" class="hide"><div class="card res">
 <h2 id="rT"></h2>
 <div style="text-align:center;color:var(--mut)" id="rName"></div>
 <div class="score" id="rScore"></div>
 <div style="text-align:center;color:var(--mut);font-size:13px" id="rMark"></div>
 <div class="stats" id="rStats"></div>
 <div style="text-align:center"><button class="btn b-pri" id="rvBtn" onclick="toggleRev()"></button> <button class="btn b-out" onclick="location.reload()" id="rtBtn"></button></div>
 <div id="rev" class="hide" style="margin-top:12px"></div>
</div></section>
</main>
<footer>© SKC DEFENCE ACADEMY</footer>

<div class="modal hide" id="modal"><div class="card">
 <h3 id="mT" style="margin-top:0;color:var(--navy)"></h3>
 <p id="mB"></p>
 <div style="display:flex;gap:10px;justify-content:center"><button class="btn b-out" id="mNo" onclick="closeM()"></button><button class="btn b-grn" id="mYes" onclick="finish()"></button></div>
</div></div>

<script>
var TITLE_EN="SRT Test Series – Mock Test 32", TITLE_HI="एसआरटी टेस्ट सीरीज़ – मॉक टेस्ट 32";
var DURATION=30*60, PLUS=1, MINUS=0.25;
// [question EN, question HI, [A en, A hi], [B], [C], [D], correct index 0-3]
var Q=[
["You accidentally send a highly critical message about your boss to the official office group instead of your friend.","आप गलती से अपने दोस्त के बजाय आधिकारिक कार्यालय समूह (ग्रुप) में अपने बॉस के बारे में एक अत्यधिक आलोचनात्मक संदेश भेज देते हैं।",
["Pretend your phone was hacked or accessed by someone else to completely avoid taking any professional responsibility.","यह दिखावा करें कि आपका फोन हैक हो गया था या किसी और ने एक्सेस किया था ताकि आप किसी भी पेशेवर जिम्मेदारी से पूरी तरह बच सकें।"],
["Quickly leave the group chat and switch off your phone to avoid facing immediate backlash from your colleagues.","अपने सहयोगियों से तत्काल प्रतिक्रिया का सामना करने से बचने के लिए जल्दी से ग्रुप चैट छोड़ दें और अपना फोन बंद कर दें।"],
["Immediately delete the message for everyone, apologize privately to the boss, and explain it was a misunderstanding.","तुरंत सभी के लिए संदेश हटा दें, निजी तौर पर बॉस से माफी मांगें, और समझाएं कि यह एक गलतफहमी थी।"],
["Loudly argue in the group that your criticism is valid and challenge the boss to improve their behavior.","समूह में जोर-शोर से बहस करें कि आपकी आलोचना वैध है और बॉस को अपना व्यवहार सुधारने की चुनौती दें।"],2],

["You find a beautiful wallet on a park bench. It contains old, precious family photos but absolutely no money or ID cards.","आपको पार्क की बेंच पर एक खूबसूरत बटुआ मिलता है। इसमें पुरानी, कीमती पारिवारिक तस्वीरें हैं लेकिन बिल्कुल कोई पैसा या आईडी कार्ड नहीं है।",
["Leave the wallet exactly where it is, assuming the owner will eventually retrace their steps to find it.","बटुए को वहीं छोड़ दें जहां वह है, यह मानकर कि मालिक अंततः इसे खोजने के लिए अपने कदमों पर वापस आएगा।"],
["Hand it over to the park authorities or local police station, emphasizing the emotional value of the photographs.","तस्वीरों के भावनात्मक मूल्य पर जोर देते हुए इसे पार्क अधिकारियों या स्थानीय पुलिस स्टेशन को सौंप दें।"],
["Take the photos out and pin them on a nearby notice board so the owner can spot them easily.","तस्वीरों को बाहर निकालें और उन्हें पास के नोटिस बोर्ड पर पिन करें ताकि मालिक उन्हें आसानी से देख सके।"],
["Throw the empty wallet in the dustbin as it contains no cash or legal identification of any real use.","खाली बटुए को कूड़ेदान में फेंक दें क्योंकि इसमें किसी भी वास्तविक उपयोग की कोई नकदी या कानूनी पहचान नहीं है।"],1],

["You are reading in a quiet corner of a massive public library and realize you have been locked inside after closing hours.","आप एक विशाल सार्वजनिक पुस्तकालय के एक शांत कोने में पढ़ रहे हैं और महसूस करते हैं कि आपको बंद होने के समय के बाद अंदर बंद कर दिया गया है।",
["Make yourself comfortable on a couch and decide to sleep in the library until the staff arrives the next morning.","काउच पर खुद को आरामदायक बनाएं और अगली सुबह कर्मचारियों के आने तक पुस्तकालय में सोने का फैसला करें।"],
["Try to break the glass windows using heavy books or furniture to escape before it gets too dark inside.","अंदर बहुत अंधेरा होने से पहले भागने के लिए भारी किताबों या फर्नीचर का उपयोग करके कांच की खिड़कियों को तोड़ने की कोशिश करें।"],
["Start shouting loudly from the windows and throw objects outside to grab the attention of passersby on the street.","खिड़कियों से जोर-जोर से चिल्लाना शुरू करें और सड़क पर राहगीरों का ध्यान खींचने के लिए चीजों को बाहर फेंक दें।"],
["Call the emergency numbers or local police immediately to explain your situation and wait calmly for them to open the doors.","अपनी स्थिति समझाने के लिए तुरंत आपातकालीन नंबरों या स्थानीय पुलिस को कॉल करें और दरवाजे खोलने के लिए शांति से प्रतीक्षा करें।"],3],

["A guest visiting your house accidentally breaks their own expensive watch and angrily blames your pet dog for knocking it over.","आपके घर आने वाला एक मेहमान गलती से अपनी ही महंगी घड़ी तोड़ देता है और गुस्से में आपके पालतू कुत्ते को उसे गिराने का दोष देता है।",
["Apologize profusely, accept the blame on behalf of your pet, and promise to pay for the full cost of the watch.","क्षमा मांगें, अपने पालतू जानवर की ओर से दोष स्वीकार करें, और घड़ी की पूरी कीमत चुकाने का वादा करें।"],
["Maintain your composure, politely but firmly defend your pet, and offer to help them find a good repair shop.","अपना संयम बनाए रखें, विनम्रतापूर्वक लेकिन दृढ़ता से अपने पालतू जानवर का बचाव करें, और उन्हें एक अच्छी मरम्मत की दुकान खोजने में मदद करने की पेशकश करें।"],
["Silently take your dog to another room and ignore the guest until they calm down and realize their own mistake.","चुपचाप अपने कुत्ते को दूसरे कमरे में ले जाएं और मेहमान को तब तक नजरअंदाज करें जब तक कि वे शांत न हो जाएं और अपनी गलती का एहसास न कर लें।"],
["Aggressively argue back, accuse them of being careless, and immediately ask them to leave your house for insulting your pet.","आक्रामक रूप से वापस बहस करें, उन पर लापरवाह होने का आरोप लगाएं, और अपने पालतू जानवर का अपमान करने के लिए तुरंत उन्हें अपने घर से जाने के लिए कहें।"],1],

["You are halfway through a 10-hour road trip when you realize you forgot your daily critical prescription medication at home.","आप 10 घंटे की सड़क यात्रा के बीच में हैं जब आपको एहसास होता है कि आप अपनी दैनिक महत्वपूर्ण डॉक्टर के पर्चे की दवा घर पर भूल गए हैं।",
["Stop at a local pharmacy and aggressively demand they give you the medicine without a prescription due to your emergency.","एक स्थानीय फार्मेसी में रुकें और आक्रामक रूप से मांग करें कि वे आपकी आपात स्थिति के कारण आपको बिना पर्चे के दवा दें।"],
["Consult a doctor online immediately, explain your medical history, and get a digital prescription to buy medicines at the next town.","तुरंत ऑनलाइन एक डॉक्टर से परामर्श लें, अपना चिकित्सा इतिहास बताएं, और अगले शहर में दवाएं खरीदने के लिए एक डिजिटल नुस्खा प्राप्त करें।"],
["Ignore the missing medication and continue the road trip, hoping that skipping a few doses won't cause any major health issues.","गायब दवा को अनदेखा करें और सड़क यात्रा जारी रखें, यह उम्मीद करते हुए कि कुछ खुराक छोड़ने से कोई बड़ी स्वास्थ्य समस्या नहीं होगी।"],
["Turn the car around immediately and drive 5 hours back home, completely ruining the trip but ensuring your absolute safety.","कार को तुरंत घुमाएं और 5 घंटे वापस घर चलाएं, यात्रा को पूरी तरह से बर्बाद कर दें लेकिन अपनी पूर्ण सुरक्षा सुनिश्चित करें।"],1],

["You are staying in a hotel and hear a loud, continuous false fire alarm in the middle of the night.","आप एक होटल में ठहरे हुए हैं और आधी रात को एक तेज, लगातार बजने वाला झूठा फायर अलार्म सुनते हैं।",
["Assume it is just a drill or a false alarm, put on your earphones, and go back to sleep peacefully.","मान लें कि यह सिर्फ एक ड्रिल या झूठा अलार्म है, अपने इयरफ़ोन लगाएं, और शांति से वापस सो जाएं।"],
["Angrily call the reception desk multiple times, complaining about the noise and demanding they turn the alarm off immediately.","गुस्से में कई बार रिसेप्शन डेस्क पर कॉल करें, शोर के बारे में शिकायत करें और मांग करें कि वे तुरंत अलार्म बंद कर दें।"],
["Start banging on all the neighboring doors, shouting aggressively to wake everyone up and creating a huge panic on the floor.","सभी पड़ोसी दरवाजों को पीटना शुरू करें, सभी को जगाने के लिए आक्रामक रूप से चिल्लाएं और फर्श पर एक बड़ी दहशत पैदा करें।"],
["Quickly grab your essentials, use the stairs to evacuate safely, and verify the situation with the hotel staff outside.","जल्दी से अपनी आवश्यक चीजें पकड़ें, सुरक्षित रूप से बाहर निकलने के लिए सीढ़ियों का उपयोग करें, और बाहर होटल के कर्मचारियों के साथ स्थिति की पुष्टि करें।"],3],

["You invite a friend for dinner, but they arrive two hours late without any prior notice or valid explanation.","आप एक दोस्त को रात के खाने के लिए आमंत्रित करते हैं, लेकिन वे बिना किसी पूर्व सूचना या वैध स्पष्टीकरण के दो घंटे देरी से पहुंचते हैं।",
["Serve them completely cold food without speaking a single word throughout the dinner to show your extreme displeasure.","अपनी अत्यधिक नाराजगी दिखाने के लिए रात के खाने के दौरान एक भी शब्द बोले बिना उन्हें पूरी तरह से ठंडा खाना परोसें।"],
["Refuse to open the door, send them a harsh text message, and permanently end your friendship over their lack of punctuality.","दरवाजा खोलने से इंकार करें, उन्हें एक कठोर पाठ संदेश भेजें, और समय की पाबंदी की कमी के कारण अपनी दोस्ती को स्थायी रूप से समाप्त कर दें।"],
["Smile and pretend nothing happened, suppressing your anger to completely avoid any uncomfortable confrontation with your friend.","मुस्कुराएं और दिखावा करें कि कुछ नहीं हुआ, अपने दोस्त के साथ किसी भी असुविधाजनक टकराव से पूरी तरह बचने के लिए अपने गुस्से को दबा दें।"],
["Welcome them politely, serve the food, and later gently communicate how their unannounced delay inconvenienced you.","विनम्रतापूर्वक उनका स्वागत करें, खाना परोसें, और बाद में धीरे से बताएं कि उनकी अघोषित देरी से आपको कैसे असुविधा हुई।"],3],

["You discover a colleague has been secretly taking home small office supplies like pens and notepads on a daily basis.","आपको पता चलता है कि एक सहकर्मी रोजाना पेन और नोटपैड जैसी छोटी ऑफिस की आपूर्ति (सप्लाई) चुपके से घर ले जा रहा है।",
["Ignore the situation entirely, assuming that minor office supplies do not cost much and it is none of your business.","स्थिति को पूरी तरह से अनदेखा करें, यह मानते हुए कि मामूली कार्यालय आपूर्ति में बहुत अधिक खर्च नहीं होता है और इससे आपका कोई मतलब नहीं है।"],
["Start secretly taking office supplies yourself, believing that since others are doing it, it must be an acceptable practice.","खुद भी चुपके से कार्यालय की आपूर्ति लेना शुरू करें, यह मानते हुए कि चूंकि अन्य लोग ऐसा कर रहे हैं, यह एक स्वीकार्य अभ्यास होना चाहिए।"],
["Publicly expose them in the middle of the office floor, loudly shaming them in front of all other team members.","कार्यालय के फर्श के बीच में उन्हें सार्वजनिक रूप से बेनकाब करें, अन्य सभी टीम के सदस्यों के सामने उन्हें जोर-शोर से शर्मिंदा करें।"],
["Talk to the colleague privately, warning them that this behavior is unethical and could risk their job if discovered by management.","सहकर्मी से निजी तौर पर बात करें, उन्हें चेतावनी दें कि यह व्यवहार अनैतिक है और प्रबंधन द्वारा खोजे जाने पर उनकी नौकरी को जोखिम में डाल सकता है।"],3],

["You receive a delivery package meant for your neighbor, but the box is badly torn and the contents are visible.","आपको अपने पड़ोसी के लिए एक डिलीवरी पैकेज प्राप्त होता है, लेकिन बॉक्स बुरी तरह से फटा हुआ है और सामग्री दिखाई दे रही है।",
["Secretly tape the box perfectly to hide the damage before giving it to the neighbor, so they don't blame you.","पड़ोसी को देने से पहले नुकसान को छिपाने के लिए बॉक्स को चुपके से पूरी तरह से टेप करें, ताकि वे आपको दोष न दें।"],
["Throw the damaged package away in the trash, assuming the neighbor can just claim a refund from the shopping website.","क्षतिग्रस्त पैकेज को कूड़ेदान में फेंक दें, यह मानकर कि पड़ोसी शॉपिंग वेबसाइट से धनवापसी का दावा कर सकता है।"],
["Hand it over to the neighbor immediately, clearly explaining the condition it arrived in to avoid any misunderstandings.","किसी भी गलतफहमी से बचने के लिए जिस स्थिति में यह आया था उसे स्पष्ट रूप से समझाते हुए इसे तुरंत पड़ोसी को सौंप दें।"],
["Aggressively fight with the delivery agent, refusing to accept the package and demanding they return it to the warehouse.","डिलीवरी एजेंट के साथ आक्रामक रूप से लड़ें, पैकेज को स्वीकार करने से इंकार करें और मांग करें कि वे इसे गोदाम में वापस कर दें।"],2],

["While boarding a flight, you realize you accidentally packed a prohibited sharp tool in your cabin baggage.","उड़ान में चढ़ते समय, आपको एहसास होता है कि आपने गलती से अपने केबिन बैगेज में एक प्रतिबंधित तेज उपकरण पैक कर लिया है।",
["Argue loudly with the security guards, claiming the tool is highly essential for your work and demanding to take it aboard.","सुरक्षा गार्डों के साथ जोर-शोर से बहस करें, यह दावा करते हुए कि उपकरण आपके काम के लिए अत्यधिक आवश्यक है और इसे विमान में ले जाने की मांग करें।"],
["Try to cleverly hide the tool deep inside your clothes, hoping the security scanners will miss it during the check.","चेकिंग के दौरान सुरक्षा स्कैनर इसे मिस कर देंगे, यह उम्मीद करते हुए उपकरण को चतुराई से अपने कपड़ों के अंदर गहराई में छिपाने की कोशिश करें।"],
["Promptly inform the security personnel at the checkpoint, explain the honest mistake, and voluntarily surrender the prohibited item.","चेकपॉइंट पर सुरक्षाकर्मियों को तुरंत सूचित करें, ईमानदार गलती की व्याख्या करें, और स्वेच्छा से निषिद्ध वस्तु को सरेंडर करें।"],
["Panic and run away from the security line, abandoning your luggage entirely out of fear of getting arrested.","घबराएं और सुरक्षा पंक्ति से भाग जाएं, गिरफ्तार होने के डर से अपना सामान पूरी तरह से छोड़ दें।"],2],

["You are judging a local talent competition and realize the most deserving winner cheated, but they are from a very poor background.","आप एक स्थानीय प्रतिभा प्रतियोगिता को जज कर रहे हैं और महसूस करते हैं कि सबसे योग्य विजेता ने धोखा दिया, लेकिन वे बहुत गरीब पृष्ठभूमि से हैं।",
["Publicly humiliate them on the stage, calling out their cheating in front of the entire audience to teach them a lesson.","उन्हें सबक सिखाने के लिए पूरे दर्शकों के सामने उनकी धोखाधड़ी को पुकारते हुए, मंच पर उन्हें सार्वजनिक रूप से अपमानित करें।"],
["Resign from the judging panel immediately to avoid making a tough moral decision, leaving the problem to other judges.","कठोर नैतिक निर्णय लेने से बचने के लिए तुरंत जजिंग पैनल से इस्तीफा दे दें, समस्या को अन्य जजों पर छोड़ दें।"],
["Ignore the cheating entirely out of deep sympathy for their poverty and declare them the winner to change their life.","उनकी गरीबी के लिए गहरी सहानुभूति से धोखाधड़ी को पूरी तरह से अनदेखा करें और उनका जीवन बदलने के लिए उन्हें विजेता घोषित करें।"],
["Strictly follow the rules to disqualify them for cheating, but privately offer them mentorship or financial guidance later.","धोखाधड़ी के लिए उन्हें अयोग्य घोषित करने के नियमों का सख्ती से पालन करें, लेकिन बाद में उन्हें निजी तौर पर सलाह या वित्तीय मार्गदर्शन प्रदान करें।"],3],

["You move into a rented house and discover a locked hidden room that the landlord strictly forbade you from opening.","आप एक किराए के घर में जाते हैं और एक बंद छिपा हुआ कमरा पाते हैं जिसे मकान मालिक ने आपको खोलने से सख्ती से मना किया था।",
["Respect the landlord's property rights and privacy boundaries, completely ignore the locked room, and mind your own business.","मकान मालिक के संपत्ति अधिकारों और गोपनीयता सीमाओं का सम्मान करें, बंद कमरे को पूरी तरह से अनदेखा करें, और अपने काम से काम रखें।"],
["Secretly drill a small hole in the door to peek inside, violating the agreement while trying to satisfy your deep curiosity.","अपनी गहरी जिज्ञासा को संतुष्ट करने की कोशिश करते हुए समझौते का उल्लंघन करते हुए, अंदर झांकने के लिए दरवाजे में चुपके से एक छोटा सा छेद ड्रिल करें।"],
["Call the local police immediately and file a suspicious activity report against the landlord without any concrete evidence.","बिना किसी ठोस सबूत के तुरंत स्थानीय पुलिस को फोन करें और मकान मालिक के खिलाफ संदिग्ध गतिविधि रिपोर्ट दर्ज करें।"],
["Aggressively break the lock using heavy tools to uncover the secret, assuming the landlord is hiding something highly illegal.","यह मानकर कि मकान मालिक कुछ अत्यधिक अवैध छिपा रहा है, रहस्य को उजागर करने के लिए भारी उपकरणों का उपयोग करके आक्रामक रूप से ताला तोड़ें।"],0],

["You accidentally witness a widely respected local politician shoplifting an inexpensive item from a small boutique.","आप गलती से एक व्यापक रूप से सम्मानित स्थानीय राजनेता को एक छोटे से बुटीक से एक सस्ती वस्तु की चोरी करते हुए देखते हैं।",
["Discreetly inform the boutique owner about the incident with facts, allowing them to handle the situation professionally and legally.","तथ्यों के साथ बुटीक मालिक को घटना के बारे में गुप्त रूप से सूचित करें, जिससे वे स्थिति को पेशेवर और कानूनी रूप से संभाल सकें।"],
["Record a video secretly and use it to blackmail the politician later for a large sum of illegal money.","चुपके से एक वीडियो रिकॉर्ड करें और बाद में बड़ी रकम के अवैध पैसे के लिए राजनेता को ब्लैकमेल करने के लिए इसका उपयोग करें।"],
["Ignore the incident completely, convincing yourself that powerful people are above the law and you shouldn't get involved.","घटना को पूरी तरह से अनदेखा करें, खुद को यह विश्वास दिलाएं कि शक्तिशाली लोग कानून से ऊपर हैं और आपको शामिल नहीं होना चाहिए।"],
["Loudly confront the politician in front of the entire crowd, trying to create a massive public scandal for fame.","प्रसिद्धि के लिए बड़े पैमाने पर सार्वजनिक घोटाला बनाने की कोशिश करते हुए, पूरी भीड़ के सामने जोर-शोर से राजनेता का सामना करें।"],0],

["Your neighbor urgently asks you to hold a heavy, locked briefcase for a day but doesn't return even after a week.","आपका पड़ोसी तत्काल आपको एक दिन के लिए एक भारी, बंद ब्रीफकेस रखने के लिए कहता है लेकिन एक सप्ताह के बाद भी वापस नहीं आता है।",
["Keep the briefcase hidden in your closet for years, silently waiting for the neighbor to return without taking any action.","बिना कोई कार्रवाई किए चुपचाप पड़ोसी के लौटने का इंतजार करते हुए, ब्रीफकेस को सालों तक अपनी अलमारी में छिपा कर रखें।"],
["Throw the heavy briefcase into a nearby river, getting rid of it entirely to avoid dealing with the neighbor's problems.","पड़ोसी की समस्याओं से निपटने से बचने के लिए इसे पूरी तरह से छुटकारा पाने के लिए भारी ब्रीफकेस को पास की नदी में फेंक दें।"],
["Forcefully break the lock to check if there is huge cash inside, planning to keep the money for yourself.","खुद के लिए पैसे रखने की योजना बनाते हुए, यह देखने के लिए कि क्या अंदर भारी नकदी है, बलपूर्वक ताला तोड़ें।"],
["Submit the locked briefcase to the nearest police station, explaining the situation and avoiding any potential legal complications.","स्थिति को समझाते हुए और किसी भी संभावित कानूनी जटिलताओं से बचते हुए, बंद ब्रीफकेस को निकटतम पुलिस स्टेशन में जमा करें।"],3],

["You realize the drinking water supplied to your residential society has a weird chemical smell today.","आपको एहसास होता है कि आज आपके आवासीय समाज में आपूर्ति किए गए पीने के पानी में एक अजीब रासायनिक गंध है।",
["Quietly buy bottled water for your own family and ignore the risk it poses to the rest of the unaware society.","चुपचाप अपने परिवार के लिए बोतलबंद पानी खरीदें और अनभिज्ञ समाज के बाकी हिस्सों के लिए यह जो जोखिम पैदा करता है उसे नजरअंदाज करें।"],
["Assume it is just extra chlorine added by the municipality and continue drinking it without telling anyone else.","मान लें कि यह नगरपालिका द्वारा जोड़ा गया अतिरिक्त क्लोरीन है और किसी और को बताए बिना इसे पीना जारी रखें।"],
["Immediately inform the society management, warn neighbors not to consume it, and request an urgent water quality inspection.","तुरंत सोसायटी प्रबंधन को सूचित करें, पड़ोसियों को इसका सेवन न करने की चेतावनी दें, और तत्काल जल गुणवत्ता निरीक्षण का अनुरोध करें।"],
["Aggressively protest outside the municipal office, blocking the main road and violently demanding clean water instantly.","मुख्य सड़क को अवरुद्ध करते हुए और हिंसक रूप से तुरंत स्वच्छ पानी की मांग करते हुए, नगर निगम कार्यालय के बाहर आक्रामक रूप से विरोध करें।"],2],

["During a final job interview, the HR manager suddenly breaks down crying due to a severe personal tragedy.","अंतिम नौकरी के साक्षात्कार के दौरान, एक गंभीर व्यक्तिगत त्रासदी के कारण एचआर (HR) प्रबंधक अचानक रोने लगता है।",
["Silently walk out of the room without saying a single word, abandoning the job opportunity out of extreme awkwardness.","अत्यधिक अजीबोगरीब स्थिति के कारण नौकरी के अवसर को छोड़ते हुए, एक भी शब्द कहे बिना चुपचाप कमरे से बाहर निकलें।"],
["Aggressively demand to see another manager, complaining that this emotional unprofessionalism is wasting your valuable time.","आक्रामक रूप से एक अन्य प्रबंधक को देखने की मांग करें, यह शिकायत करते हुए कि यह भावनात्मक गैर-व्यावसायिकता आपका कीमती समय बर्बाद कर रही है।"],
["Politely offer them water, express genuine empathy, and gently ask if they would like to reschedule the interview.","विनम्रतापूर्वक उन्हें पानी की पेशकश करें, वास्तविक सहानुभूति व्यक्त करें, और धीरे से पूछें कि क्या वे साक्षात्कार को पुनर्निर्धारित करना चाहेंगे।"],
["Start crying loudly along with them to show extreme fake sympathy, hoping it will guarantee you the job offer.","अत्यधिक नकली सहानुभूति दिखाने के लिए उनके साथ जोर-जोर से रोना शुरू करें, यह उम्मीद करते हुए कि यह आपको नौकरी की पेशकश की गारंटी देगा।"],2],

["You find a USB drive in a cafe that contains documented evidence of a massive local political scam.","आपको एक कैफे में एक USB ड्राइव मिलती है जिसमें एक बड़े पैमाने पर स्थानीय राजनीतिक घोटाले के प्रलेखित साक्ष्य हैं।",
["Format the USB drive completely and use it for storing your own personal movies, entirely ignoring the massive scam.","विशाल घोटाले को पूरी तरह से अनदेखा करते हुए, यूएसबी ड्राइव को पूरी तरह से प्रारूपित (format) करें और इसका उपयोग अपनी निजी फिल्मों को संग्रहीत करने के लिए करें।"],
["Use the confidential evidence to heavily blackmail the local politicians, demanding a huge sum of money for your silence.","अपनी चुप्पी के लिए भारी रकम की मांग करते हुए, स्थानीय राजनेताओं को भारी ब्लैकमेल करने के लिए गोपनीय साक्ष्य का उपयोग करें।"],

];

var T={
en:{sT:"SRT Mock Test 32",ins:["Total questions: 35 | Time: 30 minutes","Correct answer: +1 mark | Wrong answer: −0.25 mark | Unanswered: 0","Click a question number in the palette to jump to any question","You can switch between English and Hindi anytime","You can submit the test anytime; it auto-submits when time ends"],name:"Enter your name (optional)",start:"Start Test",q:"Question",of:"of",prev:"« Previous",next:"Next »",clr:"Clear",sub:"Submit Test",pal:"Question Console",pg:"Show / Hide Question Console",lA:"Answered",lN:"Not answered",lU:"Not visited",mT:"Submit Test?",mB:function(a,s){return "You have answered "+a+" and left "+s+" unanswered. Do you want to submit?"},mNo:"Cancel",mYes:"Yes, Submit",rT:"Test Result",tot:"Total Score",mk:"Marking: +1 correct, −0.25 wrong",att:"Attempted",skp:"Skipped",cor:"Correct",wro:"Wrong",tq:"Total Questions",neg:"Negative Marks",rv:"View Answers",hv:"Hide Answers",rt:"Retake Test",ok:"Correct",no:"Wrong",sk:"Skipped",ca:"Correct answer",ya:"Your answer"},
hi:{sT:"एसआरटी मॉक टेस्ट 32",ins:["कुल प्रश्न: 35 | समय: 30 मिनट","सही उत्तर: +1 अंक | गलत उत्तर: −0.25 अंक | बिना उत्तर: 0","किसी भी प्रश्न पर जाने के लिए पैलेट में प्रश्न संख्या दबाएँ","आप कभी भी अंग्रेज़ी और हिन्दी भाषा बदल सकते हैं","आप कभी भी टेस्ट सबमिट कर सकते हैं; समय समाप्त होने पर टेस्ट अपने आप सबमिट हो जाएगा"],name:"अपना नाम लिखें (वैकल्पिक)",start:"टेस्ट शुरू करें",q:"प्रश्न",of:"/",prev:"« पिछला",next:"अगला »",clr:"उत्तर हटाएँ",sub:"टेस्ट सबमिट करें",pal:"प्रश्न कंसोल",pg:"प्रश्न कंसोल दिखाएँ / छिपाएँ",lA:"उत्तर दिया",lN:"उत्तर नहीं दिया",lU:"देखा नहीं",mT:"टेस्ट सबमिट करें?",mB:function(a,s){return "आपने "+a+" प्रश्नों के उत्तर दिए हैं और "+s+" प्रश्न छोड़े हैं। क्या आप सबमिट करना चाहते हैं?"},mNo:"रद्द करें",mYes:"हाँ, सबमिट करें",rT:"टेस्ट परिणाम",tot:"कुल स्कोर",mk:"अंकन: सही +1, गलत −0.25",att:"प्रयास किए",skp:"छोड़े गए",cor:"सही",wro:"गलत",tq:"कुल प्रश्न",neg:"ऋणात्मक अंक",rv:"उत्तर देखें",hv:"उत्तर छिपाएँ",rt:"दोबारा टेस्ट दें",ok:"सही",no:"गलत",sk:"छोड़ा गया",ca:"सही उत्तर",ya:"आपका उत्तर"}
};
var lang="en",cur=0,ans=[],vis=[],endAt=0,tick=null,done=false,L="ABCD";
function $(id){return document.getElementById(id)}
function t(k){return T[lang][k]}
function pad(n){return n<10?"0"+n:""+n}
function fmt(n){return (Math.round(n*100)/100).toString()}

function applyStatic(){
 $("ttl").textContent=lang==="en"?TITLE_EN:TITLE_HI;
 $("sT").textContent=lang==="en"?TITLE_EN:TITLE_HI;
 $("sIns").innerHTML=t("ins").map(function(x){return "<li>"+x+"</li>"}).join("");
 $("nm").placeholder=t("name");$("sBtn").textContent=t("start");
 $("prev").textContent=t("prev");$("next").textContent=t("next");$("clr").textContent=t("clr");$("sub").textContent=t("sub");
 $("palT").textContent=t("pal");$("ptog").textContent=t("pg");
 $("lA").textContent=t("lA");$("lN").textContent=t("lN");$("lU").textContent=t("lU");
 $("mNo").textContent=t("mNo");$("mYes").textContent=t("mYes");$("mT").textContent=t("mT");
 document.documentElement.lang=lang==="en"?"en":"hi";
 $("bEn").className=lang==="en"?"on":"";$("bHi").className=lang==="hi"?"on":"";
}
function setLang(l){
 lang=l;applyStatic();
 if(!$("test").classList.contains("hide"))render();
 if(!$("result").classList.contains("hide"))showResult();
 if(!$("modal").classList.contains("hide"))openM();
}
function startTest(){
 for(var i=0;i<Q.length;i++){ans[i]=-1;vis[i]=false}
 $("start").classList.add("hide");$("test").classList.remove("hide");$("timer").classList.remove("hide");
 endAt=Date.now()+DURATION*1000;
 tick=setInterval(upd,500);upd();render();
 window.scrollTo(0,0);
}
function upd(){
 var s=Math.max(0,Math.round((endAt-Date.now())/1000));
 $("timer").textContent=pad(Math.floor(s/60))+":"+pad(s%60);
 if(s<=300)$("timer").className="timer low";
 if(s<=0&&!done)finish();
}
function render(){
 vis[cur]=true;var q=Q[cur],i=lang==="en"?0:1;
 $("qno").textContent=t("q")+" "+(cur+1)+" "+t("of")+" "+Q.length;
 $("qsts").textContent=ans[cur]>=0?"✔ "+t("lA"):"";
 $("qtext").textContent=(cur+1)+". "+q[i];
 var h="";
 for(var k=0;k<4;k++){h+='<button class="opt'+(ans[cur]===k?" sel":"")+'" onclick="pick('+k+')"><span class="l">'+L[k]+'</span><span>'+esc(q[2+k][i])+'</span></button>'}
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===Q.length-1;
 pal();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pal(){
 var h="";
 for(var i=0;i<Q.length;i++){
  var c=ans[i]>=0?"ans":(vis[i]?"vis":"");
  if(i===cur)c+=" cur";
  h+='<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
 }
 $("pg").innerHTML=h;
}
function pick(k){ans[cur]=k;render()}
function clearAns(){ans[cur]=-1;render()}
function go(d){var n=cur+d;if(n>=0&&n<Q.length){cur=n;render();window.scrollTo(0,0)}}
function jump(i){cur=i;render();$("pal").classList.remove("open");window.scrollTo(0,0)}
function togPal(){$("pal").classList.toggle("open")}
function counts(){var a=0;for(var i=0;i<ans.length;i++)if(ans[i]>=0)a++;return {a:a,s:Q.length-a}}
function openM(){var c=counts();$("mB").textContent=t("mB")(c.a,c.s);$("modal").classList.remove("hide")}
function askSubmit(){openM()}
function closeM(){$("modal").classList.add("hide")}
function finish(){
 if(done&&arguments.length===0&&$("test").classList.contains("hide"))return;
 done=true;clearInterval(tick);closeM();
 $("test").classList.add("hide");$("timer").classList.add("hide");$("result").classList.remove("hide");
 showResult();window.scrollTo(0,0);
}
function showResult(){
 var cor=0,wro=0,i;
 for(i=0;i<Q.length;i++){if(ans[i]>=0){if(ans[i]===Q[i][6])cor++;else wro++}}
 var att=cor+wro,skp=Q.length-att,neg=wro*MINUS,sc=cor*PLUS-neg;
 $("rT").textContent=t("rT");
 var nm=$("nm").value.replace(/^\s+|\s+$/g,"");
 $("rName").textContent=nm?nm:"";
 $("rScore").textContent=fmt(sc)+" / "+Q.length;
 $("rMark").textContent=t("mk");
 var items=[[t("tq"),Q.length,""],[t("att"),att,""],[t("skp"),skp,""],[t("cor"),cor,"color:#138808"],[t("wro"),wro,"color:#d32f2f"],[t("neg"),"−"+fmt(neg),"color:#d32f2f"]];
 $("rStats").innerHTML=items.map(function(x){return '<div class="st"><b style="'+x[2]+'">'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("");
 $("rvBtn").textContent=$("rev").classList.contains("hide")?t("rv"):t("hv");
 $("rtBtn").textContent=t("rt");
 var li=lang==="en"?0:1,h="";
 for(i=0;i<Q.length;i++){
  var q=Q[i],st=ans[i]<0?["sk","#6b7686"]:(ans[i]===q[6]?["ok","#138808"]:["no","#d32f2f"]);
  h+='<div class="rv"><div class="q">'+(i+1)+'. '+esc(q[li])+'<span class="tag" style="background:'+st[1]+'">'+t(st[0])+'</span></div>';
  for(var k=0;k<4;k++){
   var c="o";if(k===q[6])c+=" ok";else if(k===ans[i])c+=" no";
   var m=k===q[6]?" ✔":(k===ans[i]?" ✘ ("+t("ya")+")":"");
   h+='<div class="'+c+'"><b>'+L[k]+'.</b> '+esc(q[2+k][li])+m+'</div>';
  }
  h+='</div>';
 }
 $("rev").innerHTML=h;
}
function toggleRev(){$("rev").classList.toggle("hide");showResult()}
window.addEventListener("beforeunload",function(e){if(!done&&!$("test").classList.contains("hide")){e.preventDefault();e.returnValue=""}});
applyStatic();
</script>
</body>
</html>
