<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKC DEFENCE ACADEMY - SRT Mock Test 44</title>
<style>
:root{--navy:#0b2a5b;--navy2:#143d86;--saf:#ff9933;--grn:#138808;--bg:#f2f5fa;--card:#fff;--tx:#1b2433;--mut:#6b7686;--bd:#d9e0ec;--red:#d32f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Mangal","Nirmala UI",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--saf);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.hin{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid var(--saf);flex:none}
.brand{flex:1;min-width:150px}
.brand b{display:block;font-size:18px;letter-spacing:.5px}
.brand span{font-size:12px;opacity:.85}
.tools{display:flex;align-items:center;gap:8px}
.timer{background:#fff;color:var(--navy);font-weight:800;font-size:18px;padding:5px 12px;border-radius:8px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.timer.low{background:var(--red);color:#fff}
.btn{border:0;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--navy2);color:#fff}
.b-grn{background:var(--grn);color:#fff}
.b-saf{background:var(--saf);color:#222}
.b-out{background:#fff;color:var(--navy2);border:2px solid var(--navy2)}
.lang{display:flex;border-radius:8px;overflow:hidden;border:2px solid var(--saf)}
.lang button{border:0;background:transparent;color:#fff;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--saf);color:#222}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hide{display:none!important}
.start{max-width:640px;margin:20px auto;text-align:center}
.start h1{color:var(--navy);margin:6px 0}
.start ul{text-align:left;padding-left:20px}
.start input{width:100%;padding:12px;font-size:16px;border:2px solid var(--bd);border-radius:8px;margin:8px 0 14px;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:600}
.qtext{font-size:18px;font-weight:600;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#e8edf6;color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--navy2);background:#e9f0ff}
.opt.sel .l{background:var(--navy2);color:#fff}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nav .sp{flex:1}
.pal h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pg button{height:40px;border-radius:8px;border:2px solid var(--bd);background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.pg button.ans{background:var(--grn);border-color:var(--grn);color:#fff}
.pg button.vis{background:#ffe5e5;border-color:var(--red)}
.pg button.cur{outline:3px solid var(--saf);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;margin-top:12px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--bd)}
.ptog{display:none;width:100%;margin-bottom:10px}
.res{max-width:760px;margin:10px auto}
.res h2{text-align:center;color:var(--navy);margin:4px 0}
.score{text-align:center;font-size:46px;font-weight:800;color:var(--navy2);margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.st{border-radius:10px;padding:12px;text-align:center;background:#f2f5fa;border:1px solid var(--bd)}
.st b{display:block;font-size:24px}
.st span{font-size:12px;color:var(--mut)}
.rv{border-top:1px solid var(--bd);padding:12px 0}
.rv .q{font-weight:600;margin-bottom:6px}
.rv .o{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:15px;border:1px solid var(--bd)}
.rv .o.ok{background:#e3f5e1;border-color:var(--grn)}
.rv .o.no{background:#ffe5e5;border-color:var(--red)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:380px;width:100%;text-align:center}
footer{text-align:center;font-size:12px;color:var(--mut);padding:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.ptog{display:block}.pal{display:none}.pal.open{display:block}.qtext{font-size:17px}.brand b{font-size:15px}}
</style>
</head>
<body>
<header><div class="hin">
 <div class="logo">SKC</div>
 <div class="brand"><b>SKC DEFENCE ACADEMY</b><span id="ttl">SRT Test Series – Mock Test 44</span></div>
 <div class="tools">
  <div class="lang"><button id="bEn" class="on" onclick="setLang('en')">English</button><button id="bHi" onclick="setLang('hi')">हिन्दी</button></div>
  <div class="timer hide" id="timer">30:00</div>
 </div>
</div></header>

<main>
<section id="start" class="card start">
 <div class="logo" style="margin:0 auto;width:64px;height:64px;font-size:20px;background:var(--navy);color:#fff">SKC</div>
 <h1 id="sT">SRT Mock Test 44</h1>
 <p id="sSub" style="color:var(--mut);margin:0 0 10px">SKC DEFENCE ACADEMY</p>
 <ul id="sIns"></ul>
 <input id="nm" type="text" maxlength="40" autocomplete="name">
 <button class="btn b-grn" id="sBtn" onclick="startTest()" style="width:100%;font-size:17px"></button>
</section>

<section id="test" class="hide">
 <button class="btn b-out ptog" id="ptog" onclick="togPal()"></button>
 <div class="grid">
  <div class="card">
   <div class="qhead"><span id="qno"></span><span id="qsts"></span></div>
   <div class="qtext" id="qtext"></div>
   <div id="opts"></div>
   <div class="nav">
    <button class="btn b-out" id="prev" onclick="go(-1)"></button>
    <button class="btn b-saf" id="clr" onclick="clearAns()"></button>
    <span class="sp"></span>
    <button class="btn b-pri" id="next" onclick="go(1)"></button>
   </div>
   <div style="margin-top:14px"><button class="btn b-grn" id="sub" onclick="askSubmit()" style="width:100%"></button></div>
  </div>
  <div class="card pal" id="pal">
   <h3 id="palT"></h3>
   <div class="pg" id="pg"></div>
   <div class="leg">
    <span><i style="background:var(--grn)"></i><b id="lA"></b></span>
    <span><i style="background:#ffe5e5;border-color:var(--red)"></i><b id="lN"></b></span>
    <span><i style="background:#fff"></i><b id="lU"></b></span>
   </div>
  </div>
 </div>
</section>

<section id="result" class="hide"><div class="card res">
 <h2 id="rT"></h2>
 <div style="text-align:center;color:var(--mut)" id="rName"></div>
 <div class="score" id="rScore"></div>
 <div style="text-align:center;color:var(--mut);font-size:13px" id="rMark"></div>
 <div class="stats" id="rStats"></div>
 <div style="text-align:center"><button class="btn b-pri" id="rvBtn" onclick="toggleRev()"></button> <button class="btn b-out" onclick="location.reload()" id="rtBtn"></button></div>
 <div id="rev" class="hide" style="margin-top:12px"></div>
</div></section>
</main>
<footer>© SKC DEFENCE ACADEMY</footer>

<div class="modal hide" id="modal"><div class="card">
 <h3 id="mT" style="margin-top:0;color:var(--navy)"></h3>
 <p id="mB"></p>
 <div style="display:flex;gap:10px;justify-content:center"><button class="btn b-out" id="mNo" onclick="closeM()"></button><button class="btn b-grn" id="mYes" onclick="finish()"></button></div>
</div></div>

<script>
var TITLE_EN="SRT Test Series – Mock Test 44", TITLE_HI="एसआरटी टेस्ट सीरीज़ – मॉक टेस्ट 44";
var DURATION=30*60, PLUS=1, MINUS=0.25;
// [question EN, question HI, [A en, A hi], [B], [C], [D], correct index 0-3]
var Q=[
["Your late-night intercity bus breaks down in a completely deserted, dark forest area, and you are stranded alone.", "आपकी देर रात की इंटरसिटी बस एक पूरी तरह से सुनसान, अंधेरे जंगल क्षेत्र में खराब हो जाती है, और आप अकेले फंसे हुए हैं।", ["Hijack a passing private car violently using a heavy stone to force the driver to take you home.", "चालक को आपको घर ले जाने के लिए मजबूर करने के लिए एक भारी पत्थर का उपयोग करके गुजरने वाली निजी कार का हिंसक रूप से अपहरण करेंगे।"], ["Walk deep into the pitch-dark forest blindly, giving up on your own safety.", "पूरी तरह हार मानकर अपनी सुरक्षा की परवाह किए बिना घने अंधेरे जंगल में आंख मूंदकर चलेंगे।"], ["Sit helplessly on the dark road, shivering in paralyzing fear, crying silently, and waiting pathetically for the morning.", "अंधेरी सड़क पर असहाय होकर बैठेंगे, लकवाग्रस्त कर देने वाले डर से कांपेंगे, चुपचाप रोएंगे, और दयनीय रूप से सुबह का इंतजार करेंगे।"], ["Set the broken-down bus on fire deliberately to stay warm and force the emergency services to arrive.", "गर्म रहने और आपातकालीन सेवाओं को आने के लिए मजबूर करने के लिए जानबूझकर खराब बस में आग लगा देंगे।"], 2],
["You borrow your best friend's extremely expensive new smartphone, and it accidentally slips from your hand, shattering completely.", "आप अपने सबसे अच्छे दोस्त का बेहद महंगा नया स्मार्टफोन उधार लेते हैं, और यह गलती से आपके हाथ से फिसल कर पूरी तरह से चकनाचूर हो जाता है।", ["Steal a stranger's smartphone from a nearby cafe to secretly replace your friend's broken phone without telling them.", "अपने दोस्त के टूटे हुए फोन को बिना बताए गुप्त रूप से बदलने के लिए पास के कैफे से एक अजनबी का स्मार्टफोन चुराएंगे।"], ["Fall to your knees crying in utter humiliation, begging for forgiveness, and offering your own cheap phone in sheer panic.", "अत्यधिक अपमान में रोते हुए अपने घुटनों पर गिर जाएंगे, क्षमा की भीख मांगेंगे, और अत्यधिक घबराहट में अपना खुद का सस्ता फोन पेश करेंगे।"], ["Blame an innocent passerby for bumping into you and start a violent physical fight with them to escape blame.", "एक निर्दोष राहगीर को आपसे टकराने के लिए दोषी ठहराएंगे और दोष से बचने के लिए उनके साथ हिंसक शारीरिक लड़ाई शुरू करेंगे।"], ["Run away from the city permanently, completely cutting off all contact with your best friend out of intense fear.", "अत्यधिक डर के कारण अपने सबसे अच्छे दोस्त से सभी संपर्क पूरी तरह से काटकर, स्थायी रूप से शहर से भाग जाएंगे।"], 1],
["You board a premium train in a hurry, but a strict Ticket Examiner (TT) catches you without a valid ticket.", "आप जल्दी में एक प्रीमियम ट्रेन में चढ़ते हैं, लेकिन एक सख्त टिकट परीक्षक (TT) आपको बिना वैध टिकट के पकड़ लेता है।", ["Push the Ticket Examiner violently towards the open door of the moving train to escape being penalized.", "दंडित होने से बचने के लिए टिकट परीक्षक को चलती ट्रेन के खुले दरवाजे की ओर हिंसक रूप से धकेलेंगे।"], ["Snatch a valid ticket forcefully from a sleeping elderly passenger nearby to selfishly prove your own innocence.", "अपनी खुद की बेगुनाही साबित करने के लिए पास में सो रहे एक बुजुर्ग यात्री से बलपूर्वक एक वैध टिकट छीनेंगे।"], ["Jump out of the fast-moving train window out of sheer panic, guaranteeing severe, permanent physical injuries or death.", "अत्यधिक घबराहट के कारण तेजी से चलने वाली ट्रेन की खिड़की से कूद जाएंगे, जिससे गंभीर, स्थायी शारीरिक चोटों या मृत्यु की गारंटी होगी।"], ["Suffer the extreme public humiliation, pay the heavy penalty while crying helplessly, and sit miserably on the floor.", "अत्यधिक सार्वजनिक अपमान सहेंगे, बेबस होकर रोते हुए भारी जुर्माना अदा करेंगे, और दयनीय रूप से फर्श पर बैठ जाएंगे।"], 3],
["Your cunning manager steals your hard-worked presentation, completely presents it to the CEO as his own, and gets promoted.", "आपका चालाक प्रबंधक आपकी कड़ी मेहनत वाली प्रस्तुति चुरा लेता है, इसे पूरी तरह से सीईओ के सामने अपना बताकर प्रस्तुत करता है, और पदोन्नत हो जाता है।", ["Stab the manager with a sharp pen right in the middle of the boardroom out of blinding, uncontrollable rage.", "अंधे, बेकाबू गुस्से के कारण बोर्डरूम के ठीक बीच में मैनेजर को एक तेज कलम से घोंप देंगे।"], ["Silently accept the agonizing defeat, cry miserably in the office washroom, and feel completely worthless and used.", "चुपचाप दर्दनाक हार को स्वीकार करेंगे, ऑफिस के वॉशरूम में दयनीय रूप से रोएंगे, और पूरी तरह से बेकार और इस्तेमाल किया हुआ महसूस करेंगे।"], ["Secretly access the company's main server and delete the entire corporate database to exact your massive revenge.", "अपना भारी बदला लेने के लिए गुप्त रूप से कंपनी के मुख्य सर्वर तक पहुंचेंगे और पूरे कॉर्पोरेट डेटाबेस को हटा देंगे।"], ["Stand on the office desk screaming aggressively and threaten to harm yourself if you are not given the promotion.", "कार्यालय डेस्क पर आक्रामक रूप से चिल्लाते हुए खड़े होंगे और यदि आपको पदोन्नति नहीं दी गई तो खुद को नुकसान पहुंचाने की धमकी देंगे।"], 1],
["You accidentally scratch a parked luxury car, and you suddenly realize it belongs to a notorious, violent local mafia don.", "आप गलती से एक पार्क की गई लग्जरी कार को खरोंच देते हैं, और आपको अचानक एहसास होता है कि यह एक कुख्यात, हिंसक स्थानीय माफिया डॉन की है।", ["Pull out a hidden weapon and shoot the don's armed guards before they can even notice you standing there.", "इससे पहले कि वे आपको वहां खड़े देख सकें, एक छिपा हुआ हथियार निकालेंगे और डॉन के सशस्त्र गार्डों को गोली मार देंगे।"], ["Set the don's luxury car entirely on fire so the minor scratch is completely destroyed and hidden in the ashes.", "डॉन की लग्जरी कार में पूरी तरह से आग लगा देंगे ताकि मामूली खरोंच पूरी तरह से नष्ट हो जाए और राख में छिप जाए।"], ["Run away like a coward, abandoning your own vehicle, and live in constant, paralyzing paranoia of being hunted down.", "एक कायर की तरह भाग जाएंगे, अपने ही वाहन को छोड़ देंगे, और शिकार होने के निरंतर, लकवाग्रस्त करने वाले व्यामोह (paranoia) में रहेंगे।"], ["Harm yourself in the parking lot to avoid the unimaginable physical torture the mafia would inflict on you.", "माफिया द्वारा आप पर किए जाने वाले अकल्पनीय शारीरिक यातना से बचने के लिए पार्किंग स्थल में खुद को नुकसान पहुंचाएंगे।"], 2],
["An extremely aggressive neighbor falsely accuses you of stealing their expensive courier package in front of the entire society.", "एक अत्यंत आक्रामक पड़ोसी पूरे समाज के सामने आप पर उनके महंगे कूरियर पैकेज को चुराने का झूठा आरोप लगाता है।", ["Brutally beat the neighbor with a heavy metal stick for daring to ruin your reputation in public.", "सार्वजनिक रूप से आपकी प्रतिष्ठा को बर्बाद करने की हिम्मत करने के लिए भारी धातु की छड़ी से पड़ोसी को बेरहमी से पीटेंगे।"], ["Break down crying hysterically, accept the false tag of a thief in sheer fear, and avoid everyone forever out of shame.", "हिस्टीरिकल (पागलों) रूप से रोने लगेंगे, अत्यधिक डर के कारण चोर के झूठे टैग को स्वीकार करेंगे, और शर्म के मारे हमेशा के लिए सभी से बचेंगे।"], ["Burn down the neighbor's apartment at midnight to ensure they suffer a massive financial loss for their accusation.", "यह सुनिश्चित करने के लिए कि उन्हें उनके आरोप के लिए बड़े पैमाने पर वित्तीय नुकसान हो, आधी रात को पड़ोसी के अपार्टमेंट को जला देंगे।"], ["End your own life right in the society compound because you absolutely cannot bear the false, insulting accusation.", "झूठे, अपमानजनक आरोप को बिल्कुल सहन न कर पाने के कारण समाज के परिसर में ही अपना जीवन समाप्त कर लेंगे।"], 1],
["A food delivery guy drops your food in the mud, picks it up, and aggressively demands full payment, threatening violence.", "एक फूड डिलीवरी बॉय आपका खाना कीचड़ में गिरा देता है, उसे उठाता है, और आक्रामक रूप से हिंसा की धमकी देते हुए पूर्ण भुगतान की मांग करता है।", ["Attack the delivery guy viciously with a sharp kitchen knife to teach him a permanent lesson about threatening you.", "आपको धमकी देने के बारे में एक स्थायी सबक सिखाने के लिए तेज रसोई के चाकू से डिलीवरी वाले व्यक्ति पर शातिर हमला करेंगे।"], ["Throw a pot of boiling hot water directly on the delivery guy's face to blind him and escape safely.", "डिलीवरी वाले व्यक्ति को अंधा करने और सुरक्षित रूप से भागने के लिए उबलते गर्म पानी का बर्तन सीधे उसके चेहरे पर फेंक देंगे।"], ["Jump off your second-floor balcony to escape the violent confrontation, severely fracturing both your legs in the process.", "हिंसक टकराव से बचने के लिए अपनी दूसरी मंजिल की बालकनी से कूद जाएंगे, इस प्रक्रिया में आपके दोनों पैरों में गंभीर फ्रैक्चर हो जाएगा।"], ["Hand over the money silently trembling in pure fear, and eat the dirty, muddy food while weeping helplessly.", "शुद्ध डर से कांपते हुए चुपचाप पैसे सौंप देंगे, और बेबस होकर रोते हुए गंदा, कीचड़युक्त खाना खाएंगे।"], 3],
["You are stranded in a strange, dark city at 2 AM. Your phone is dead, and your wallet has been entirely stolen.", "आप रात 2 बजे एक अजीब, अंधेरे शहर में फंसे हुए हैं। आपका फोन डेड (बंद) है, और आपका बटुआ पूरी तरह से चोरी हो गया है।", ["Start aggressively robbing innocent passing pedestrians to quickly gather enough money for a train ticket back home.", "घर वापस जाने के लिए ट्रेन टिकट के लिए जल्दी से पर्याप्त धन इकट्ठा करने के लिए निर्दोष गुजरने वाले पैदल चलने वालों को आक्रामक रूप से लूटना शुरू कर देंगे।"], ["Hijack a local passing vehicle using a fake hidden weapon and force the driver to take you to your destination.", "एक नकली छिपे हुए हथियार का उपयोग करके एक स्थानीय गुजरने वाले वाहन का अपहरण करेंगे और चालक को आपको अपने गंतव्य तक ले जाने के लिए मजबूर करेंगे।"], ["Sleep shivering in a filthy, rat-infested garbage dump, crying bitterly and begging for leftover rotten food in the morning.", "एक गंदे, चूहों से भरे कचरे के ढेर में कांपते हुए सोएंगे, फूट-फूट कर रोएंगे और सुबह बचे हुए सड़े हुए खाने की भीख मांगेंगे।"], ["Give up on life and end the miserable suffering instantly.", "जीवन से हार मानकर दयनीय पीड़ा को तुरंत समाप्त कर देंगे।"], 2],
["A cunning local shopkeeper gives you a fake 500-rupee note in change and strictly refuses to take it back, insulting you.", "एक चालाक स्थानीय दुकानदार आपको छुट्टे में 500 रुपये का नकली नोट देता है और आपका अपमान करते हुए इसे वापस लेने से सख्ती से इंकार करता है।", ["Return at night and burn the entire shop to the ground to completely destroy the shopkeeper's entire livelihood.", "रात में लौटेंगे और दुकानदार की पूरी आजीविका को पूरी तरह से नष्ट करने के लिए पूरी दुकान को जलाकर राख कर देंगे।"], ["Grab a heavy rock and smash the shopkeeper's skull forcefully, killing him instantly over a mere 500 rupees.", "एक भारी पत्थर पकड़ेंगे और दुकानदार की खोपड़ी को बलपूर्वक कुचल देंगे, महज 500 रुपये के लिए उसे तुरंत मार देंगे।"], ["Intentionally pass the fake, illegal currency note to a poor, blind street beggar to secretly recover your financial loss.", "अपने वित्तीय नुकसान की गुप्त रूप से भरपाई करने के लिए जानबूझकर एक गरीब, अंधे सड़क के भिखारी को नकली, अवैध मुद्रा नोट दे देंगे।"], ["Silently walk away with your head down, crying over the financial loss, and cursing your pathetic, cowardly luck.", "अपना सिर झुकाकर चुपचाप चले जाएंगे, वित्तीय नुकसान पर रोएंगे, और अपनी दयनीय, कायरतापूर्ण किस्मत को कोसेंगे।"], 3],
["While jogging alone in a deserted park at dawn, a rabid stray dog violently bites your leg, tearing the flesh.", "भोर में एक सुनसान पार्क में अकेले जॉगिंग करते समय, एक खूंखार आवारा कुत्ता हिंसक रूप से आपके पैर को काट लेता है, जिससे मांस फट जाता है।", ["Brutally capture and kill all the stray dogs in the entire park using heavy stones out of sheer bloody vengeance.", "भारी पत्थरों का उपयोग करके पूरे पार्क में सभी आवारा कुत्तों को बेरहमी से पकड़ेंगे और मार डालेंगे, जो कि शुद्ध खूनी प्रतिशोध है।"], ["End your life immediately to escape the agonizing pain and potential rabies.", "दर्दनाक पीड़ा और संभावित रेबीज से बचने के लिए तुरंत अपना जीवन समाप्त कर देंगे।"], ["Panic wildly, run home heavily bleeding, and lock yourself inside without getting medical help, fearing the massive hospital bills.", "बेतहाशा घबराएंगे, भारी खून बहते हुए घर भागेंगे, और भारी अस्पताल के बिलों के डर से चिकित्सा सहायता प्राप्त किए बिना खुद को अंदर बंद कर लेंगे।"], ["Aggressively attack and severely beat the innocent park security guard with a stick for failing to protect you.", "आपकी रक्षा करने में विफल रहने के लिए निर्दोष पार्क सुरक्षा गार्ड पर आक्रामक हमला करेंगे और उसे लाठी से बुरी तरह पीटेंगे।"], 0],
["Your entire luggage, containing your passport and all cash, gets completely stolen at the railway station right before your train arrives.", "आपका पूरा सामान, जिसमें आपका पासपोर्ट और सारी नकदी है, आपकी ट्रेन आने से ठीक पहले रेलवे स्टेशन पर पूरी तरह से चोरी हो जाता है।", ["Steal another innocent passenger's expensive luggage aggressively to unfairly compensate for your own devastating personal loss.", "अपने स्वयं के विनाशकारी व्यक्तिगत नुकसान की अनुचित भरपाई के लिए किसी अन्य निर्दोष यात्री के महंगे सामान को आक्रामक रूप से चुराएंगे।"], ["Sit on the filthy platform floor, crying inconsolably, and abandon your entire important journey in utter, miserable defeat.", "गंदे प्लेटफॉर्म के फर्श पर बैठेंगे, असंगत रूप से रोएंगे, और अपनी पूरी महत्वपूर्ण यात्रा को पूरी तरह से दयनीय हार में छोड़ देंगे।"], ["Push the innocent station master directly onto the live railway tracks in a fit of uncontrollable, violent anger.", "बेकाबू, हिंसक गुस्से के दौरे में निर्दोष स्टेशन मास्टर को सीधे लाइव रेलवे पटरियों पर धकेल देंगे।"], ["Give up completely and end your life immediately, without any attempt to seek help.", "पूरी तरह हार मानकर बिना मदद मांगे तुरंत अपना जीवन समाप्त कर देंगे।"], 1],
["You accidentally stumble and spill scalding hot coffee directly onto a muscular stranger's highly expensive laptop at a cafe.", "एक कैफे में आप गलती से लड़खड़ा जाते हैं और सीधे एक मांसल अजनबी के अत्यधिक महंगे लैपटॉप पर खौलता हुआ गर्म कॉफी गिरा देते हैं।", ["Run out of the cafe immediately like a complete coward, leaving the angry stranger screaming violently behind you.", "एक पूर्ण कायर की तरह तुरंत कैफे से बाहर भाग जाएंगे, क्रोधित अजनबी को अपने पीछे हिंसक रूप से चिल्लाते हुए छोड़ देंगे।"], ["Hit the muscular stranger aggressively with a heavy wooden chair before they can even demand the massive repair money.", "इससे पहले कि वे बड़े पैमाने पर मरम्मत के पैसे की मांग कर सकें, एक भारी लकड़ी की कुर्सी से आक्रामक रूप से मांसल अजनबी को मारेंगे।"], ["Grab the heavily ruined, wet laptop and smash it entirely into tiny pieces on the floor in pure panic.", "भारी बर्बाद, गीले लैपटॉप को पकड़ेंगे और शुद्ध घबराहट में इसे फर्श पर पूरी तरह से छोटे टुकड़ों में तोड़ देंगे।"], ["Stab yourself deeply with a metal fork right there to force the furious stranger to feel immense pity for you.", "उग्र अजनबी को आपके लिए अत्यधिक दया महसूस करने के लिए मजबूर करने के लिए वहीं एक धातु के कांटे से खुद को गहराई से छुरा घोंपेंगे।"], 0],
["Your greedy landlord maliciously increases your apartment rent by 50% overnight and threatens aggressive, immediate physical eviction.", "आपका लालची मकान मालिक दुर्भावनापूर्ण रूप से आपके अपार्टमेंट का किराया रातोरात 50% बढ़ा देता है और आक्रामक, तत्काल शारीरिक बेदखली की धमकी देता है।", ["Quietly murder the greedy landlord in his sleep to permanently solve your terrifying financial and housing crisis.", "अपने भयानक वित्तीय और आवास संकट को स्थायी रूप से हल करने के लिए लालची मकान मालिक की नींद में चुपचाप हत्या कर देंगे।"], ["Burn the entire apartment flat to absolute ashes so that nobody else can ever rent the property again.", "पूरे अपार्टमेंट के फ्लैट को पूरी तरह से राख कर देंगे ताकि कोई और कभी भी संपत्ति किराए पर न ले सके।"], ["Weep helplessly, quickly pack your fragile bags in the middle of the night, and sleep on the freezing street.", "बेबस होकर रोएंगे, आधी रात को जल्दी से अपने नाजुक बैग पैक करेंगे, और जमने वाली सड़क पर सोएंगे।"], ["Threaten to harm yourself from the building terrace instantly if the landlord does not heavily reduce the sudden rent.", "यदि मकान मालिक अचानक किराए में भारी कमी नहीं करता है तो तुरंत इमारत की छत से खुद को नुकसान पहुंचाने की धमकी देंगे।"], 2],
["You witness a minor road rage incident, but the heavily armed, violent goons suddenly turn their weapons directly towards you.", "आप सड़क पर मामूली विवाद की घटना देखते हैं, लेकिन भारी हथियारों से लैस, हिंसक गुंडे अचानक अपने हथियार सीधे आपकी ओर कर लेते हैं।", ["Pull out a highly illegal, unregistered loaded gun and shoot all the approaching goons dead on the public street.", "एक अत्यधिक अवैध, अपंजीकृत लोडेड बंदूक निकालेंगे और सड़क पर आने वाले सभी गुंडों को गोली मार देंगे।"], ["Freeze in absolute paralyzing terror, let them violently slap and humiliate you, and run away weeping pathetically.", "पूर्ण रूप से लकवाग्रस्त करने वाले आतंक में जम जाएंगे, उन्हें हिंसक रूप से आपको थप्पड़ मारने और अपमानित करने देंगे, और दयनीय रूप से रोते हुए भाग जाएंगे।"], ["Accelerate your car aggressively and run completely over the violent goons, crushing their bodies to death instantly.", "अपनी कार को आक्रामक रूप से गति देंगे और हिंसक गुंडों के ऊपर पूरी तरह से चढ़ा देंगे, उनके शरीर को तुरंत कुचल कर मार डालेंगे।"], ["Fall to your knees and loudly beg them to mercilessly kill the other driver instead of harming you.", "अपने घुटनों पर गिर जाएंगे और जोर-जोर से उनसे भीख मांगेंगे कि वे आपको नुकसान पहुंचाने के बजाय दूसरे ड्राइवर को बेरहमी से मार डालें।"], 1],
["You accidentally transfer your entire month's hard-earned salary to a highly sophisticated, untraceable online international scammer.", "आप गलती से अपने पूरे महीने की गाढ़ी कमाई एक अत्यधिक परिष्कृत, अप्राप्य ऑनलाइन अंतरराष्ट्रीय स्कैमर को हस्तांतरित कर देते हैं।", ["End your own life immediately due to the severe, unbearable financial and emotional loss.", "गंभीर, असहनीय वित्तीय और भावनात्मक नुकसान के कारण तुरंत अपना जीवन समाप्त कर देंगे।"], ["Break all the expensive electronic items in your house completely in a blind, heavily destructive, and uncontrollable rage.", "एक अंधे, भारी विनाशकारी और बेकाबू गुस्से में अपने घर के सभी महंगे इलेक्ट्रॉनिक सामानों को पूरी तरह से तोड़ देंगे।"], ["Go to a highly dangerous local mafia gang and hire them to track and brutally murder the unknown scammer.", "एक अत्यधिक खतरनाक स्थानीय माफिया गिरोह के पास जाएंगे और अज्ञात स्कैमर को ट्रैक करने और बेरहमी से हत्या करने के लिए उन्हें नियुक्त करेंगे।"], ["Fall into deep, paralyzing depression, skip all your meals for days, and completely accept your miserable financial ruin.", "गहरे, पंगु बना देने वाले अवसाद में गिर जाएंगे, दिनों तक अपना सारा भोजन छोड़ देंगे, और अपनी दयनीय वित्तीय बर्बादी को पूरी तरह से स्वीकार करेंगे।"], 1],
["You are entirely falsely accused of cheating in a crucial university exam by a highly strict, unreasonable invigilator.", "आप पर एक अत्यधिक सख्त, अनुचित पर्यवेक्षक द्वारा एक महत्वपूर्ण विश्वविद्यालय परीक्षा में धोखाधड़ी करने का पूरी तरह से झूठा आरोप लगाया गया है।", ["Physically attack the strict invigilator aggressively and violently tear up all the other students' final exam papers.", "सख्त पर्यवेक्षक पर आक्रामक रूप से शारीरिक हमला करेंगे और अन्य सभी छात्रों के अंतिम परीक्षा के प्रश्नपत्रों को हिंसक रूप से फाड़ देंगे।"], ["Cry completely helplessly, falsely accept the shameful cheating tag, and get suspended in absolute, life-ruining humiliation.", "पूरी तरह से असहाय होकर रोएंगे, शर्मनाक धोखाधड़ी टैग को झूठा स्वीकार करेंगे, और पूर्ण, जीवन-बर्बाद करने वाले अपमान में निलंबित हो जाएंगे।"], ["Pour highly flammable liquid and set the entire examination hall completely on fire to exact your extreme revenge.", "अत्यधिक ज्वलनशील तरल डालेंगे और अपना चरम बदला लेने के लिए पूरे परीक्षा हॉल में पूरी तरह से आग लगा देंगे।"], ["End your life immediately to permanently escape the unbearable public shame and unfair accusation.", "असहनीय सार्वजनिक शर्म और अनुचित आरोप से स्थायी रूप से बचने के लिए तुरंत अपना जीवन समाप्त कर देंगे।"], 1],
["A massive, highly aggressive stray bull suddenly charges directly at you in a completely narrow, inescapable dark alleyway.", "एक विशाल, अत्यधिक आक्रामक आवारा सांड अचानक एक पूरी तरह से संकीर्ण, अपरिहार्य अंधेरी गली में सीधे आपकी ओर आता है।", ["Throw highly corrosive burning acid directly onto the charging bull's face to permanently blind and severely torture it.", "चार्जिंग बुल के चेहरे पर सीधे अत्यधिक संक्षारक जलने वाला एसिड फेंकेंगे ताकि वह स्थायी रूप से अंधा हो जाए और उसे गंभीर रूप से प्रताड़ित कर सके।"], ["Aggressively push an innocent walking bystander directly in front of the violent bull to selfishly save your own life.", "अपनी जान बचाने के लिए आक्रामक रूप से एक निर्दोष चलने वाले राहगीर को हिंसक सांड के ठीक सामने धकेल देंगे।"], ["Curl into a terrified ball in the filthy drain, crying in sheer fear, and let the heavy bull crush your leg.", "गंदी नाली में एक भयभीत गेंद की तरह सिकुड़ जाएंगे, अत्यधिक डर में रोएंगे, और भारी सांड को अपना पैर कुचलने देंगे।"], ["Pull out a large hidden knife and try to brutally slaughter the massive charging bull in the narrow alley.", "एक बड़ा छिपा हुआ चाकू निकालेंगे और संकरी गली में विशालकाय सांड को बेरहमी से मारने की कोशिश करेंगे।"], 3],
["You find out your deeply trusted sibling has stolen your entire life savings completely just to buy illegal drugs.", "आपको पता चलता है कि आपके अत्यधिक भरोसेमंद भाई-बहन ने केवल अवैध ड्रग्स खरीदने के लिए आपकी जीवन भर की बचत पूरी तरह से चुरा ली है।", ["Beat your addicted sibling brutally to death in a blinding fit of absolute, uncontrollable, and psychotic rage.", "पूर्ण, बेकाबू और मानसिक क्रोध के अंधेरे में अपने नशेड़ी भाई-बहन को बेरहमी से पीट-पीट कर मार डालेंगे।"], ["Weep completely silently in your dark room, accept the total horrific betrayal, and entirely give up your future goals.", "अपने अंधेरे कमरे में पूरी तरह से चुपचाप रोएंगे, कुल भयानक विश्वासघात को स्वीकार करेंगे, और अपने भविष्य के लक्ष्यों को पूरी तरह से छोड़ देंगे।"], ["Mix lethal heavy poison into your sibling's daily food to teach them a final, deadly, and permanent lesson.", "अपने भाई-बहन के दैनिक भोजन में घातक भारी जहर मिलाएंगे ताकि उन्हें एक अंतिम, घातक और स्थायी सबक सिखाया जा सके।"], ["Set your own house completely on fire and forcefully lock yourself inside the burning rooms with your sibling.", "अपने ही घर में पूरी तरह से आग लगा लेंगे और अपने भाई-बहन के साथ जलते हुए कमरों के अंदर खुद को बलपूर्वक बंद कर लेंगे।"], 1],
["You miss your highly crucial, life-changing international flight because the cab driver intentionally took a heavily congested traffic route.", "आप अपनी अत्यधिक महत्वपूर्ण, जीवन बदलने वाली अंतरराष्ट्रीय उड़ान से चूक जाते हैं क्योंकि कैब ड्राइवर ने जानबूझकर भारी भीड़भाड़ वाला यातायात मार्ग लिया था।", ["Physically assault the poor cab driver severely, beating him mercilessly on the highway for driving so slowly.", "गरीब कैब ड्राइवर पर गंभीर रूप से शारीरिक हमला करेंगे, इतनी धीमी गति से गाड़ी चलाने के लिए उसे राजमार्ग पर बेरहमी से पीटेंगे।"], ["Smash all the thick airport terminal glass doors heavily in a massive, uncontrollable, and destructive temper tantrum.", "एक बड़े पैमाने पर, बेकाबू और विनाशकारी नखरे (temper tantrum) में सभी मोटे हवाई अड्डे के टर्मिनल कांच के दरवाजों को भारी रूप से तोड़ देंगे।"], ["Sit miserably on the dirty pavement outside, crying loudly in sheer despair, and give up the trip completely.", "बाहर गंदे फुटपाथ पर दयनीय रूप से बैठेंगे, अत्यधिक निराशा में जोर-जोर से रोएंगे, और यात्रा को पूरी तरह से छोड़ देंगे।"], ["Call the airport security and make a completely fake, highly illegal bomb threat just to fatally delay the flight.", "हवाई अड्डे की सुरक्षा को कॉल करेंगे और उड़ान में घातक देरी करने के लिए पूरी तरह से नकली, अत्यधिक अवैध बम की धमकी देंगे।"], 2],
["A heavily drunk, aggressive passenger vomits completely all over your expensive clothes during a long, crowded night bus journey.", "एक लंबी, भीड़भाड़ वाली रात की बस यात्रा के दौरान एक भारी नशे में धुत, आक्रामक यात्री आपके महंगे कपड़ों पर पूरी तरह से उल्टी कर देता है।", ["Grab the heavily drunk passenger forcefully and violently throw him entirely out of the fast-moving bus window.", "भारी नशे में धुत यात्री को बलपूर्वक पकड़ेंगे और उसे तेजी से चलती बस की खिड़की से पूरी तरह से हिंसक रूप से बाहर फेंक देंगे।"], ["Sit completely quietly in the foul, disgusting smell, crying pathetically, too deeply afraid to confront the drunk man.", "शराबी आदमी का सामना करने से बहुत गहराई से डरते हुए, दुर्गंधयुक्त, घृणित गंध में पूरी तरह से चुपचाप बैठेंगे, दयनीय रूप से रोएंगे।"], ["Pull out a sharp metal pen and start brutally stabbing the drunk passenger out of extreme, uncontrollable anger.", "एक तेज धातु का पेन निकालेंगे और अत्यधिक, बेकाबू गुस्से के कारण नशे में धुत यात्री को बेरहमी से छुरा घोंपना शुरू कर देंगे।"], ["Attack the main driver, grab the steering wheel, and steer the moving bus into a gorge to kill everyone.", "मुख्य चालक पर हमला करेंगे, स्टीयरिंग व्हील पकड़ेंगे, और सभी को मारने के लिए चलती बस को खाई में ले जाएंगे।"], 1],
["Your highly ambitious new business venture fails completely, leaving you drowning in massive, unpayable debt to dangerous loan sharks.", "आपका अत्यधिक महत्वाकांक्षी नया व्यावसायिक उद्यम पूरी तरह से विफल हो जाता है, जिससे आप खतरनाक लोन शार्क के भारी, न चुकाने योग्य कर्ज में डूब जाते हैं।", ["Secretly murder your primary wealthy investors completely to illegally escape the terrifying, life-threatening massive debt trap entirely.", "भयानक, जानलेवा बड़े पैमाने पर कर्ज के जाल से पूरी तरह से अवैध रूप से बचने के लिए अपने प्राथमिक धनी निवेशकों की गुप्त रूप से पूरी तरह से हत्या कर देंगे।"], ["Voluntarily sell your vital body organs in the highly illegal, deadly underground black market to somehow pay off the debt.", "कर्ज चुकाने के लिए अत्यधिक अवैध, घातक भूमिगत काले बाजार में स्वेच्छा से अपने महत्वपूर्ण शरीर के अंगों को बेच देंगे।"], ["Absorb the agonizing total failure, declare humiliating public bankruptcy, and live the rest of your miserable life in extreme poverty.", "दर्दनाक कुल विफलता को अवशोषित करेंगे, अपमानजनक सार्वजनिक दिवालियापन की घोषणा करेंगे, और अपने शेष दयनीय जीवन को अत्यधिक गरीबी में जीएंगे।"], ["End your life immediately to permanently escape the heavy, unbearable financial and psychological burden.", "भारी, असहनीय वित्तीय और मनोवैज्ञानिक बोझ से स्थायी रूप से बचने के लिए तुरंत अपना जीवन समाप्त कर देंगे।"], 2],
["A toxic, manipulative colleague actively blackmails you over a minor, totally unintentional mistake you made several years ago.", "एक विषैला, जोड़-तोड़ करने वाला सहयोगी आपके द्वारा कई साल पहले की गई एक मामूली, पूरी तरह से अनजाने में की गई गलती को लेकर सक्रिय रूप से आपको ब्लैकमेल करता है।", ["Hire a dangerous local contract thug to violently assassinate the toxic colleague entirely before they leak the old information.", "पुरानी जानकारी लीक होने से पहले पूरी तरह से विषैले सहयोगी की हिंसक रूप से हत्या करने के लिए एक खतरनाक स्थानीय अनुबंध ठग (contract thug) को काम पर रखेंगे।"], ["Quietly surrender to the highly illegal blackmail, paying them heavy monthly cash while living in constant, deeply paralyzing fear.", "अत्यधिक अवैध ब्लैकमेल के सामने चुपचाप आत्मसमर्पण करेंगे, निरंतर, गहराई से लकवाग्रस्त करने वाले डर में रहते हुए उन्हें भारी मासिक नकद भुगतान करेंगे।"], ["Forcefully kidnap the manipulative colleague's young child to brutally force them to permanently delete the blackmail evidence entirely.", "ब्लैकमेल सबूतों को पूरी तरह से स्थायी रूप से हटाने के लिए उन्हें बेरहमी से मजबूर करने के लिए चालाकी करने वाले सहयोगी के छोटे बच्चे का बलपूर्वक अपहरण करेंगे।"], ["Secretly plant and detonate a highly explosive crude device directly inside the blackmailing colleague's personal family car.", "ब्लैकमेल करने वाले सहकर्मी की निजी पारिवारिक कार के ठीक अंदर एक अत्यधिक विस्फोटक कच्चे उपकरण को गुप्त रूप से लगाएंगे और विस्फोट करेंगे।"], 1],
["You get incredibly severe, agonizing food poisoning the exact night entirely before your highly anticipated, lavish destination wedding.", "आपको अपनी बहुप्रतीक्षित, भव्य गंतव्य शादी से ठीक पहले की रात अविश्वसनीय रूप से गंभीर, दर्दनाक खाद्य विषाक्तता (food poisoning) हो जाती है।", ["Cancel the entire expensive wedding silently through a simple text, deeply humiliating both families, and run away entirely like a coward.", "एक साधारण पाठ के माध्यम से पूरी महंगी शादी को चुपचाप रद्द कर देंगे, दोनों परिवारों को गहराई से अपमानित करेंगे, और पूरी तरह से कायर की तरह भाग जाएंगे।"], ["Violently murder the hired head caterer who carelessly provided the highly poisonous, stale food for the wedding event.", "शादी के कार्यक्रम के लिए अत्यधिक जहरीला, बासी भोजन लापरवाही से उपलब्ध कराने वाले किराए के हेड कैटरर की हिंसक हत्या कर देंगे।"], ["Secretly start a massive, uncontrollable fire at the luxury wedding venue to create a complete chaotic distraction entirely.", "पूरी तरह से अराजक ध्यान भटकाने के लिए लक्जरी शादी स्थल पर गुप्त रूप से एक बड़े पैमाने पर, बेकाबू आग लगा देंगे।"], ["End your life immediately to permanently escape the intense social embarrassment of canceling the wedding.", "शादी रद्द करने की तीव्र सामाजिक शर्मिंदगी से स्थायी रूप से बचने के लिए तुरंत अपना जीवन समाप्त कर देंगे।"], 0],

 $("qtext").textContent=(cur+1)+". "+q[i];
 var h="";
 for(var k=0;k<4;k++){h+='<button class="opt'+(ans[cur]===k?" sel":"")+'" onclick="pick('+k+')"><span class="l">'+L[k]+'</span><span>'+esc(q[2+k][i])+'</span></button>'}
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===Q.length-1;
 pal();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pal(){
 var h="";
 for(var i=0;i<Q.length;i++){
  var c=ans[i]>=0?"ans":(vis[i]?"vis":"");
  if(i===cur)c+=" cur";
  h+='<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
 }
 $("pg").innerHTML=h;
}
function pick(k){ans[cur]=k;render()}
function clearAns(){ans[cur]=-1;render()}
function go(d){var n=cur+d;if(n>=0&&n<Q.length){cur=n;render();window.scrollTo(0,0)}}
function jump(i){cur=i;render();$("pal").classList.remove("open");window.scrollTo(0,0)}
function togPal(){$("pal").classList.toggle("open")}
function counts(){var a=0;for(var i=0;i<ans.length;i++)if(ans[i]>=0)a++;return {a:a,s:Q.length-a}}
function openM(){var c=counts();$("mB").textContent=t("mB")(c.a,c.s);$("modal").classList.remove("hide")}
function askSubmit(){openM()}
function closeM(){$("modal").classList.add("hide")}
function finish(){
 if(done&&arguments.length===0&&$("test").classList.contains("hide"))return;
 done=true;clearInterval(tick);closeM();
 $("test").classList.add("hide");$("timer").classList.add("hide");$("result").classList.remove("hide");
 showResult();window.scrollTo(0,0);
}
function showResult(){
 var cor=0,wro=0,i;
 for(i=0;i<Q.length;i++){if(ans[i]>=0){if(ans[i]===Q[i][6])cor++;else wro++}}
 var att=cor+wro,skp=Q.length-att,neg=wro*MINUS,sc=cor*PLUS-neg;
 $("rT").textContent=t("rT");
 var nm=$("nm").value.replace(/^\s+|\s+$/g,"");
 $("rName").textContent=nm?nm:"";
 $("rScore").textContent=fmt(sc)+" / "+Q.length;
 $("rMark").textContent=t("mk");
 var items=[[t("tq"),Q.length,""],[t("att"),att,""],[t("skp"),skp,""],[t("cor"),cor,"color:#138808"],[t("wro"),wro,"color:#d32f2f"],[t("neg"),"−"+fmt(neg),"color:#d32f2f"]];
 $("rStats").innerHTML=items.map(function(x){return '<div class="st"><b style="'+x[2]+'">'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("");
 $("rvBtn").textContent=$("rev").classList.contains("hide")?t("rv"):t("hv");
 $("rtBtn").textContent=t("rt");
 var li=lang==="en"?0:1,h="";
 for(i=0;i<Q.length;i++){
  var q=Q[i],st=ans[i]<0?["sk","#6b7686"]:(ans[i]===q[6]?["ok","#138808"]:["no","#d32f2f"]);
  h+='<div class="rv"><div class="q">'+(i+1)+'. '+esc(q[li])+'<span class="tag" style="background:'+st[1]+'">'+t(st[0])+'</span></div>';
  for(var k=0;k<4;k++){
   var c="o";if(k===q[6])c+=" ok";else if(k===ans[i])c+=" no";
   var m=k===q[6]?" ✔":(k===ans[i]?" ✘ ("+t("ya")+")":"");
   h+='<div class="'+c+'"><b>'+L[k]+'.</b> '+esc(q[2+k][li])+m+'</div>';
  }
  h+='</div>';
 }
 $("rev").innerHTML=h;
}
function toggleRev(){$("rev").classList.toggle("hide");showResult()}
window.addEventListener("beforeunload",function(e){if(!done&&!$("test").classList.contains("hide")){e.preventDefault();e.returnValue=""}});
applyStatic();
</script>
</body>
</html>
