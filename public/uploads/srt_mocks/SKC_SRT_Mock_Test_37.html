["QPVX","You accidentally send a highly confidential office email meant for your boss to a competing company's email address.","आप गलती से अपने बॉस के लिए एक अत्यधिक गोपनीय कार्यालय ईमेल एक प्रतिस्पर्धी कंपनी के ईमेल पते पर भेज देते हैं।","You will quickly trigger the immediate recall function, safely inform your senior manager, and politely explain the genuine error.","आप जल्दी से तत्काल रिकॉल फ़ंक्शन को ट्रिगर करेंगे, सुरक्षित रूप से अपने वरिष्ठ प्रबंधक को सूचित करेंगे, और विनम्रतापूर्वक वास्तविक त्रुटि की व्याख्या करेंगे।"],
["QPVX","You notice your online food delivery order has been marked as 'Delivered', but you haven't received anything yet.","आप देखते हैं कि आपके ऑनलाइन फूड डिलीवरी ऑर्डर को 'डिलीवर' के रूप में चिह्नित किया गया है, लेकिन आपको अभी तक कुछ नहीं मिला है।","You will calmly check the outside main door, safely contact the delivery agent, and politely raise a customer ticket.","आप शांति से बाहर के मुख्य दरवाजे की जांच करेंगे, सुरक्षित रूप से डिलीवरी एजेंट से संपर्क करेंगे, और विनम्रतापूर्वक एक ग्राहक टिकट बढ़ाएंगे।"],
["XPQV","A close relative gifts you an expensive but extremely tight-fitting shirt for your birthday, asking you to wear it.","एक करीबी रिश्तेदार आपके जन्मदिन पर आपको एक महंगी लेकिन बेहद तंग फिटिंग वाली शर्ट उपहार में देता है, और आपको इसे पहनने के लिए कहता है।","You will politely thank the loving relative, calmly appreciate the beautiful gift, and safely request an exchange for size.","आप विनम्रतापूर्वक प्यार करने वाले रिश्तेदार को धन्यवाद देंगे, शांति से खूबसूरत उपहार की सराहना करेंगे, और सुरक्षित रूप से आकार के लिए विनिमय का अनुरोध करेंगे।"],
["QPXV","You are at a formal dinner and accidentally spill a dark beverage entirely over the white tablecloth.","आप एक औपचारिक रात्रिभोज में हैं और गलती से एक गहरा पेय पूरी तरह से सफेद मेज़पोश पर गिरा देते हैं।","You will calmly offer a very sincere apology, quickly use the dry napkins, and politely assist the serving staff.","आप शांति से एक बहुत ही ईमानदार माफी की पेशकश करेंगे, जल्दी से सूखे नैपकिन का उपयोग करेंगे, और विनम्रतापूर्वक सेवारत कर्मचारियों की सहायता करेंगे।"],
["PXQV","You find a USB drive labeled 'Confidential' lying in the waiting area of your dentist's clinic.","आपको अपने दंत चिकित्सक के क्लिनिक के प्रतीक्षा क्षेत्र में 'गोपनीय' लेबल वाला एक यूएसबी (USB) ड्राइव पड़ा हुआ मिलता है।","You will safely pick the unknown digital drive, strictly avoid opening internal files, and firmly submit the clinic receptionist.","आप सुरक्षित रूप से अज्ञात डिजिटल ड्राइव को उठाएंगे, आंतरिक फाइलों को खोलने से सख्ती से बचेंगे, और दृढ़ता से क्लिनिक रिसेप्शनिस्ट को सौंपेंगे।"],
["XQPV","While boarding a bus, you realize your monthly transit pass has expired exactly today.","बस में चढ़ते समय, आपको एहसास होता है कि आपका मासिक पारगमन पास ठीक आज ही समाप्त हो गया है।","You will calmly inform the busy bus conductor, safely pay the regular daily cash fare, and politely renew later.","आप शांति से व्यस्त बस कंडक्टर को सूचित करेंगे, सुरक्षित रूप से नियमित दैनिक नकद किराया का भुगतान करेंगे, और विनम्रतापूर्वक बाद में नवीनीकृत करेंगे।"],
["PQXV","A neighbor mistakenly receives your online shopping parcel and opens it before realizing the error.","एक पड़ोसी को गलती से आपका ऑनलाइन शॉपिंग पार्सल मिल जाता है और वह गलती का एहसास होने से पहले उसे खोल देता है।","You will safely accept the mistakenly opened parcel, calmly check the internal items, and politely forgive the honest mistake.","आप सुरक्षित रूप से गलती से खोले गए पार्सल को स्वीकार करेंगे, शांति से आंतरिक वस्तुओं की जांच करेंगे, और विनम्रतापूर्वक ईमानदार गलती को माफ कर देंगे।"],
["VQPX","You hear a loud, continuous car alarm ringing in your apartment's basement parking late at night.","आप देर रात अपने अपार्टमेंट की बेसमेंट पार्किंग में एक तेज, लगातार कार अलार्म बजते हुए सुनते हैं।","You will calmly look through the balcony window, safely call the building security guard, and politely request a check.","आप शांति से बालकनी की खिड़की से देखेंगे, सुरक्षित रूप से इमारत के सुरक्षा गार्ड को बुलाएंगे, और विनम्रतापूर्वक जांच का अनुरोध करेंगे।"],
["PQVX","During a team meeting, a junior team member points out a glaring mistake in your heavily researched presentation.","एक टीम मीटिंग के दौरान, एक जूनियर टीम का सदस्य आपकी भारी शोध वाली प्रस्तुति में एक स्पष्ट गलती की ओर इशारा करता है।","You will calmly verify the pointed factual error, politely accept the genuine mistake, and firmly correct the presentation slide.","आप शांति से इंगित तथ्यात्मक त्रुटि को सत्यापित करेंगे, विनम्रतापूर्वक वास्तविक गलती को स्वीकार करेंगे, और दृढ़ता से प्रस्तुति स्लाइड को ठीक करेंगे।"],
["XQVP","You are driving and notice the car behind you is constantly honking despite heavy, unmoving traffic.","आप गाड़ी चला रहे हैं और देखते हैं कि भारी, न हिलने वाले यातायात के बावजूद आपके पीछे वाली कार लगातार हॉर्न बजा रही है।","You will calmly ignore the annoying loud noise, safely maintain your steady driving lane, and strictly avoid unnecessary conflict.","आप शांति से कष्टप्रद तेज आवाज को नजरअंदाज करेंगे, सुरक्षित रूप से अपनी स्थिर ड्राइविंग लेन बनाए रखेंगे, और सख्ती से अनावश्यक संघर्ष से बचेंगे।"],
["PXVQ","You are at a crowded movie theater and the person next to you starts taking a loud phone call.","आप एक भीड़भाड़ वाले मूवी थियेटर में हैं और आपके बगल वाला व्यक्ति जोर से फोन पर बात करने लगता है।","You will calmly lean towards the loud person, politely request maintaining absolute silence, and firmly focus the playing movie.","आप शांति से जोर से बोलने वाले व्यक्ति की ओर झुकेंगे, विनम्रतापूर्वक पूर्ण मौन बनाए रखने का अनुरोध करेंगे, और दृढ़ता से चल रही फिल्म पर ध्यान केंद्रित करेंगे।"],
["XQPV","You accidentally break a valuable fragile item in a retail store while trying to examine it closely.","करीब से जांच करने की कोशिश करते समय आप गलती से खुदरा स्टोर में एक मूल्यवान नाजुक वस्तु को तोड़ देते हैं।","You will safely collect the broken fragile pieces, calmly approach the store manager, and politely pay the damage cost.","आप सुरक्षित रूप से टूटे हुए नाजुक टुकड़ों को इकट्ठा करेंगे, शांति से स्टोर मैनेजर के पास जाएंगे, और विनम्रतापूर्वक नुकसान की कीमत चुकाएंगे।"],

var N=Q.length,cur=0,ans=[],vis=[],lang="en",done=false,end=0,tm=null;
function $(i){return document.getElementById(i)}
function t(k){return L[lang][k]}
function pad(n){return n<10?"0"+n:""+n}
function li(){return lang==="en"?0:1}

function applyLang(){
 var e=document.querySelectorAll("[data-k]"),i;
 for(i=0;i<e.length;i++){e[i].textContent=t(e[i].getAttribute("data-k"))}
 $("lg").textContent=t("lgb");
 document.documentElement.lang=lang==="en"?"en":"hi";
 document.title="SKC DEFENCE ACADEMY – "+t("title");
 $("lgd").innerHTML='<span><i style="background:#3d8b37"></i>'+t("a")+'</span><span><i style="background:#d9822b"></i>'+t("n")+'</span><span><i style="background:#e3e7de;border:1px solid #b8c1ad"></i>'+t("v")+'</span>';
 if(!$("test").classList.contains("hide"))render();
 if(!$("res").classList.contains("hide"))showRes();
}
function toggleLang(){lang=lang==="en"?"hi":"en";applyLang()}

function startTest(){
 $("start").className="card hide";$("test").className="grid";
 $("timer").className="timer";
 end=Date.now()+1800000;
 tm=setInterval(tick,500);tick();render();window.scrollTo(0,0);
}
function tick(){
 var s=Math.max(0,Math.round((end-Date.now())/1000));
 $("timer").textContent=pad(Math.floor(s/60))+":"+pad(s%60);
 $("timer").className="timer"+(s<300?" low":"");
 if(s<=0&&!done)submit(true);
}
function opts(i){
 var o=Q[i][0],r=[],k,c;
 for(k=0;k<4;k++){c=o.charAt(k);r.push(c==="X"?[Q[i][3],Q[i][4]]:C[c])}
 return r;
}
function render(){
 var q=Q[cur],x=li(),ci=q[0].indexOf("X"),o=opts(cur),h="",k,cl;
 vis[cur]=1;
 $("qn").textContent=t("q")+" "+(cur+1)+" / "+N;
 $("qt").textContent=q[1+x];
 for(k=0;k<4;k++){
  cl="opt";
  if(done){if(k===ci)cl+=" ok";else if(ans[cur]===k)cl+=" bad"}
  else if(ans[cur]===k)cl+=" sel";
  h+='<button type="button" class="'+cl+'" onclick="pick('+k+')"><b>'+"ABCD".charAt(k)+"</b><span>"+o[k][x]+"</span></button>";
 }
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===N-1;
 $("clr").className="btn alt"+(done?" hide":"");
 $("sub").textContent=done?t("res"):t("sub");
 $("sub").className="btn"+(done?"":" sub");
 pal();
}
function pal(){
 var h="",i,c;
 for(i=0;i<N;i++){
  c="pb";
  if(done){if(ans[i]===undefined)c+="";else c+=(ans[i]===Q[i][0].indexOf("X"))?" a":" w"}
  else c+=ans[i]!==undefined?" a":(vis[i]?" n":"");
  if(i===cur)c+=" c";
  h+='<button type="button" class="'+c+'" onclick="jump('+i+')">'+(i+1)+"</button>";
 }
 $("pal").innerHTML=h;
}
function pick(k){if(done)return;ans[cur]=k;render()}
function clearAns(){ans[cur]=undefined;render()}
function go(d){cur=Math.min(N-1,Math.max(0,cur+d));render();window.scrollTo(0,0)}
function jump(i){cur=i;render();window.scrollTo(0,0)}
function stats(){
 var a=0,c=0,i;
 for(i=0;i<N;i++){if(ans[i]!==undefined){a++;if(ans[i]===Q[i][0].indexOf("X"))c++}}
 var w=a-c,s=Math.round((c-w*0.25)*100)/100;
 return{a:a,c:c,w:w,s:s,k:N-a};
}
function subBtn(){if(done)showRes();else submit(false)}
function submit(auto){
 var s=stats();
 if(!auto&&!confirm(t("conf")+"\n\n"+t("att")+": "+s.a+" / "+N+"\n"+t("skp")+": "+s.k))return;
 clearInterval(tm);done=true;showRes();
}
function showRes(){
 var s=stats();
 $("test").className="grid hide";$("res").className="card";
 $("rsc").textContent=s.s+" / "+N;
 $("rst").innerHTML=[["tot",N],["att",s.a],["skp",s.k],["cor",s.c],["wr",s.w]].map(function(r){return '<div class="st"><b>'+r[1]+"</b>"+t(r[0])+"</div>"}).join("");
 window.scrollTo(0,0);
}
function reviewAns(){$("res").className="card hide";$("test").className="grid";cur=0;render();window.scrollTo(0,0)}
applyLang();
</script>
</body>
</html>
