<script>
var Q=[
["You borrowed an expensive watch from your senior for an interview, but it accidentally falls and stops working.","आपने एक साक्षात्कार के लिए अपने सीनियर से एक महंगी घड़ी उधार ली थी, लेकिन वह गलती से गिर जाती है और काम करना बंद कर देती है।",[["You will secretly put it back in his room and pretend you know nothing.","आप चुपके से इसे उसके कमरे में वापस रख देंगे और ऐसा दिखावा करेंगे कि आप कुछ नहीं जानते।"],["You will blame a junior for dropping it to save yourself.","आप खुद को बचाने के लिए इसे गिराने का दोष किसी जूनियर पर लगा देंगे।"],["You will honestly confess the mistake to the senior, apologize, and pay for the repairs from your pocket.","आप ईमानदारी से सीनियर के सामने अपनी गलती कबूल करेंगे, माफी मांगेंगे, और अपनी जेब से मरम्मत का भुगतान करेंगे।"],["You will stop talking to the senior and avoid meeting him.","आप सीनियर से बात करना बंद कर देंगे और उससे मिलने से बचेंगे।"]],2],
["While traveling in a train, a female passenger asks you to hold her crying baby for a minute but doesn't return for an hour.","ट्रेन में यात्रा करते समय, एक महिला यात्री आपसे अपने रोते हुए बच्चे को एक मिनट के लिए पकड़ने के लिए कहती है, लेकिन एक घंटे तक वापस नहीं आती है।",[["You will hand over the baby to another passenger and go to sleep.","आप बच्चे को दूसरे यात्री को सौंप देंगे और सोने चले जाएंगे।"],["You will calmly comfort the baby, ask fellow passengers to look after your luggage, and search for the lady with the help of the TTE/RPF.","आप शांति से बच्चे को चुप कराएंगे, सहयात्रियों से अपने सामान की देखभाल करने के लिए कहेंगे, और टीटीई/आरपीएफ (TTE/RPF) की मदद से महिला की तलाश करेंगे।"],["You will leave the baby on the seat and change your coach immediately.","आप बच्चे को सीट पर छोड़ देंगे और तुरंत अपना कोच बदल लेंगे।"],["You will start shouting and blaming the railway authorities for poor security.","आप चिल्लाना शुरू कर देंगे और खराब सुरक्षा के लिए रेलवे अधिकारियों को दोष देंगे।"]],1],
["You are standing in a small room and a highly venomous snake blocks the only narrow exit.","आप एक छोटे से कमरे में खड़े हैं और एक अत्यधिक जहरीला सांप एकमात्र संकरे निकास (रास्ते) को रोक लेता है।",[["You will aggressively jump over the snake to escape the room.","आप कमरे से भागने के लिए आक्रामक रूप से सांप के ऊपर से कूदेंगे।"],["You will throw heavy books or chairs at the snake to kill it.","आप सांप को मारने के लिए उस पर भारी किताबें या कुर्सियाँ फेंकेंगे।"],["You will start screaming loudly to scare the snake away.","आप सांप को डराने के लिए जोर-जोर से चिल्लाने लगेंगे।"],["You will stand completely still, avoid sudden movements, let the snake slide away on its own, and quietly step out.","आप बिल्कुल स्थिर खड़े रहेंगे, अचानक कोई हरकत नहीं करेंगे, सांप को अपने आप खिसकने देंगे, और चुपचाप बाहर निकल जाएंगे।"]],3],
["You are walking near a canal and see a person drowning, but you do not know how to swim.","आप एक नहर के पास चल रहे हैं और एक व्यक्ति को डूबते हुए देखते हैं, लेकिन आपको तैरना नहीं आता है।",[["You will immediately shout for help, throw a rope, long branch, or floating object towards him, and pull him to safety.","आप तुरंत मदद के लिए चिल्लाएंगे, उसकी ओर एक रस्सी, लंबी शाखा, या तैरती हुई वस्तु फेंकेंगे, और उसे सुरक्षित बाहर खींचेंगे।"],["You will jump into the canal anyway to show your bravery.","आप अपनी बहादुरी दिखाने के लिए वैसे भी नहर में कूद जाएंगे।"],["You will record the drowning person on your phone for evidence.","आप सबूत के लिए डूबते हुए व्यक्ति को अपने फोन पर रिकॉर्ड करेंगे।"],["You will run away from the spot out of fear of police inquiry.","आप पुलिस पूछताछ के डर से मौके से भाग जाएंगे।"]],0],
["You need urgent police clearance for an SSB interview, and the local clerk demands a bribe to process your file today.","आपको एसएसबी साक्षात्कार के लिए तत्काल पुलिस क्लीयरेंस की आवश्यकता है, और स्थानीय क्लर्क आज आपकी फाइल को प्रोसेस करने के लिए रिश्वत की मांग करता है।",[["You will pay the bribe because your career is more important than rules.","आप रिश्वत देंगे क्योंकि आपका करियर नियमों से ज्यादा महत्वपूर्ण है।"],["You will tear up your application in anger and give up on the interview.","आप गुस्से में अपना आवेदन फाड़ देंगे और साक्षात्कार छोड़ देंगे।"],["You will firmly refuse the bribe, immediately meet the senior police officer in charge, explain your urgency, and get it processed legally.","आप रिश्वत देने से दृढ़ता से मना करेंगे, तुरंत प्रभारी वरिष्ठ पुलिस अधिकारी से मिलेंगे, अपनी तत्परता (अर्जेंसी) बताएंगे, और इसे कानूनी रूप से प्रोसेस करवाएंगे।"],["You will start fighting with the clerk and abuse him publicly.","आप क्लर्क से लड़ने लगेंगे और उसे सार्वजनिक रूप से गाली देंगे।"]],2],
["You are driving through an unknown, deserted village at midnight, and your car's engine suddenly overheats and stops.","आप आधी रात को एक अनजान, सुनसान गांव से गुजर रहे हैं, और आपकी कार का इंजन अचानक ज्यादा गर्म होकर बंद हो जाता है।",[["You will abandon the car and walk alone into the dark village.","आप कार छोड़ देंगे और अंधेरे गांव में अकेले चले जाएंगे।"],["You will securely lock the doors, park on the side, wait for the engine to cool down, add reserve water, and cautiously drive to the nearest highway.","आप दरवाजों को सुरक्षित रूप से लॉक करेंगे, कार किनारे खड़ी करेंगे, इंजन के ठंडा होने का इंतजार करेंगे, रिज़र्व पानी डालेंगे, और सावधानी से निकटतम राजमार्ग (हाईवे) तक ड्राइव करेंगे।"],["You will sleep outside on the road to watch for passing vehicles.","आप गुजरते वाहनों को देखने के लिए बाहर सड़क पर सो जाएंगे।"],["You will open the radiator cap instantly to check the water level.","आप पानी के स्तर की जांच करने के लिए तुरंत रेडिएटर का ढक्कन खोल देंगे।"]],1],
["During a cleanliness drive camp, your juniors refuse to clean a dirty drain saying it is below their dignity.","एक स्वच्छता अभियान शिविर के दौरान, आपके जूनियर एक गंदी नाली को साफ करने से यह कहते हुए मना कर देते हैं कि यह उनकी गरिमा (इज्जत) के खिलाफ है।",[["You will complain to the commanding officer and punish them.","आप कमांडिंग ऑफिसर से शिकायत करेंगे और उन्हें सजा देंगे।"],["You will agree with them and leave the drain dirty.","आप उनसे सहमत होंगे और नाली को गंदा ही छोड़ देंगे।"],["You will verbally abuse them for showing a bad attitude.","आप खराब रवैया दिखाने के लिए उन्हें मौखिक रूप से गाली देंगे।"],["You will lead by example, pick up the tools, start cleaning the drain yourself to motivate them, and explain the dignity of labor.","आप एक उदाहरण पेश करेंगे, उपकरण उठाएंगे, उन्हें प्रेरित करने के लिए खुद नाली की सफाई शुरू करेंगे, और श्रम की गरिमा (डिग्निटी ऑफ लेबर) को समझाएंगे।"]],3],
["You hear the painful cries of a stray dog that has fallen into a deep, dry well.","आपको एक आवारा कुत्ते के दर्दनाक रोने की आवाज सुनाई देती है जो एक गहरे, सूखे कुएं में गिर गया है।",[["You will gather local people, arrange a long thick rope and a basket/sack, lower it down, encourage the dog to step in, and safely pull it up.","आप स्थानीय लोगों को इकट्ठा करेंगे, एक लंबी मोटी रस्सी और एक टोकरी/बोरी की व्यवस्था करेंगे, इसे नीचे उतारेंगे, कुत्ते को अंदर आने के लिए प्रोत्साहित करेंगे, और सुरक्षित रूप से ऊपर खींच लेंगे।"],["You will ignore the cries and walk away because it is just an animal.","आप रोने की आवाज को नजरअंदाज करेंगे और चले जाएंगे क्योंकि यह सिर्फ एक जानवर है।"],["You will jump into the well immediately without any ropes.","आप बिना किसी रस्सी के तुरंत कुएं में कूद जाएंगे।"],["You will throw food into the well and leave it there permanently.","आप कुएं में खाना फेंक देंगे और उसे वहीं हमेशा के लिए छोड़ देंगे।"]],0],
["You are getting late for a very crucial final exam, no transport is available, and you see an unlocked bicycle parked on the street.","आप एक बहुत ही महत्वपूर्ण अंतिम परीक्षा के लिए लेट हो रहे हैं, कोई वाहन उपलब्ध नहीं है, और आप सड़क पर एक बिना ताले की साइकिल खड़ी देखते हैं।",[["You will take the bicycle quietly, give the exam, and leave it anywhere.","आप चुपचाप साइकिल ले लेंगे, परीक्षा देंगे, और इसे कहीं भी छोड़ देंगे।"],["You will run towards the center, ask for a lift from passing bikers politely, and reach on time through your own stamina and effort.","आप केंद्र की ओर दौड़ेंगे, गुजरने वाले बाइकर्स से विनम्रतापूर्वक लिफ्ट मांगेंगे, और अपनी सहनशक्ति और प्रयास के माध्यम से समय पर पहुंचेंगे।"],["You will steal the bicycle to prove your resourcefulness.","आप अपनी साधन-संपन्नता साबित करने के लिए साइकिल चुरा लेंगे।"],["You will skip the exam and blame the public transport system.","आप परीक्षा छोड़ देंगे और सार्वजनिक परिवहन प्रणाली को दोष देंगे।"]],1],
["You witness a mob of angry people mercilessly beating a man they suspect to be a child kidnapper.","आप गुस्साई लोगों की भीड़ को एक ऐसे व्यक्ति को बेरहमी से पीटते हुए देखते हैं जिस पर उन्हें बच्चा अपहरणकर्ता होने का संदेह है।",[["You will join the mob and hit the man to show public solidarity.","आप भीड़ में शामिल हो जाएंगे और सार्वजनिक एकजुटता दिखाने के लिए उस आदमी को मारेंगे।"],["You will run away quickly to avoid becoming a target.","आप लक्ष्य बनने से बचने के लिए जल्दी से भाग जाएंगे।"],["You will bravely intervene, firmly stop the mob using strong persuasion, protect the man from further harm, and immediately call the police.","आप बहादुरी से हस्तक्षेप करेंगे, मजबूत अनुनय (समझाने) का उपयोग करके भीड़ को दृढ़ता से रोकेंगे, आदमी को और नुकसान से बचाएंगे, और तुरंत पुलिस को बुलाएंगे।"],["You will stand quietly and record the incident on your phone.","आप चुपचाप खड़े रहेंगे और घटना को अपने फोन पर रिकॉर्ड करेंगे।"]],2],
["Your best friend confesses to you that he has stolen the upcoming semester's question paper from the staff room.","आपका सबसे अच्छा दोस्त आपसे कबूल करता है कि उसने स्टाफ रूम से आगामी सेमेस्टर का प्रश्न पत्र चुरा लिया है।",[["You will firmly counsel him about the severe consequences, refuse to look at the paper, and make him anonymously return/destroy it and confess to the HOD.","आप उसे गंभीर परिणामों के बारे में दृढ़ता से समझाएंगे, पेपर देखने से मना करेंगे, और उससे गुमनाम रूप से इसे वापस करवाएंगे/नष्ट करवाएंगे और विभागाध्यक्ष (HOD) के सामने कबूल करवाएंगे।"],["You will memorize the questions to secure top marks in the exam.","आप परीक्षा में सर्वोच्च अंक प्राप्त करने के लिए प्रश्नों को याद कर लेंगे।"],["You will secretly distribute the paper to the whole class.","आप चुपके से पूरी कक्षा को पेपर बांट देंगे।"],["You will physically beat your friend and break the friendship.","आप अपने दोस्त को शारीरिक रूप से पीटेंगे और दोस्ती तोड़ देंगे।"]],0],
["A loud blast occurs in the neighborhood due to an LPG cylinder explosion, and the adjacent house catches massive fire.","एलपीजी (LPG) सिलेंडर फटने के कारण पड़ोस में एक तेज धमाका होता है, और बगल वाले घर में भीषण आग लग जाती है।",[["You will lock your own house from inside and hide under the bed.","आप अपने घर को अंदर से बंद कर लेंगे और बिस्तर के नीचे छिप जाएंगे।"],["You will run to the terrace and start taking a video for Instagram.","आप छत पर दौड़ेंगे और इंस्टाग्राम के लिए वीडियो बनाना शुरू कर देंगे।"],["You will panic and shout at the neighbors to run away.","आप घबरा जाएंगे और पड़ोसियों पर भागने के लिए चिल्लाएंगे।"],["You will instantly call the fire brigade, turn off your own house's main power/gas, gather neighbors, and rescue trapped people using wet blankets.","आप तुरंत फायर ब्रिगेड को बुलाएंगे, अपने घर की मुख्य बिजली/गैस बंद करेंगे, पड़ोसियों को इकट्ठा करेंगे, और गीले कंबलों का उपयोग करके फंसे हुए लोगों को बचाएंगे।"]],3],
["You realize you have lost your hard copy Admit Card just 15 minutes before entering the examination hall.","परीक्षा हॉल में प्रवेश करने से ठीक 15 मिनट पहले आपको एहसास होता है कि आपने अपने एडमिट कार्ड की हार्ड कॉपी खो दी है।",[["You will start crying and go back home.","आप रोने लगेंगे और घर वापस चले जाएंगे।"],["You will stay calm, quickly download a copy from your phone, rush to the nearest cyber cafe/print shop, print it, and enter on time.","आप शांत रहेंगे, जल्दी से अपने फोन से एक प्रति डाउनलोड करेंगे, निकटतम साइबर कैफे/प्रिंट शॉप पर दौड़ेंगे, इसे प्रिंट करेंगे, और समय पर प्रवेश करेंगे।"],["You will fight with the security guard to let you in without it.","आप बिना इसके अंदर जाने देने के लिए सुरक्षा गार्ड से लड़ेंगे।"],["You will steal another candidate's admit card from his bag.","आप किसी अन्य उम्मीदवार के बैग से उसका एडमिट कार्ड चुरा लेंगे।"]],1],
["You are the anchor of your team in a Tug-of-War match, and your team is rapidly losing ground and morale.","आप रस्साकशी (टग-ऑफ-वार) मैच में अपनी टीम के एंकर (सबसे पीछे वाले खिलाड़ी) हैं, और आपकी टीम तेजी से जमीन और मनोबल खो रही है।",[["You will let go of the rope suddenly to make the opponent fall.","आप प्रतिद्वंद्वी को गिराने के लिए अचानक रस्सी छोड़ देंगे।"],["You will blame the front players for being weak.","आप कमजोर होने के लिए आगे के खिलाड़ियों को दोष देंगे।"],["You will firmly hold your ground, shout loudly to synchronize the team's pull (Heave-Ho!), boost their morale, and coordinate a massive reverse pull.","आप मजबूती से अपनी जमीन पर टिके रहेंगे, टीम के खिंचाव को तालमेल में लाने के लिए जोर से चिल्लाएंगे, उनका मनोबल बढ़ाएंगे, और एक मजबूत उल्टे खिंचाव का समन्वय (कोऑर्डिनेट) करेंगे।"],["You will accept defeat and drop the rope to save energy.","आप हार स्वीकार करेंगे और ऊर्जा बचाने के लिए रस्सी छोड़ देंगे।"]],2],
["You are mistakenly arrested by the police due to a confusion in identity with a wanted criminal in another state.","दूसरे राज्य में एक वांछित अपराधी के साथ पहचान में भ्रम के कारण आपको पुलिस द्वारा गलती से गिरफ्तार कर लिया जाता है।",[["You will not resist, stay calm, logically provide your valid ID proofs (Aadhar/College ID), request a phone call to your family/lawyer, and cooperate until cleared.","आप विरोध नहीं करेंगे, शांत रहेंगे, तार्किक रूप से अपने वैध आईडी प्रमाण (आधार/कॉलेज आईडी) प्रदान करेंगे, अपने परिवार/वकील को फोन करने का अनुरोध करेंगे, और स्पष्ट होने तक सहयोग करेंगे।"],["You will try to snatch the policeman's gun and escape.","आप पुलिसकर्मी की बंदूक छीनने और भागने की कोशिश करेंगे।"],["You will start aggressively abusing the police officers.","आप पुलिस अधिकारियों को आक्रामक रूप से गाली देना शुरू कर देंगे।"],["You will confess to the false crime out of fear of getting beaten.","आप पिटाई के डर से झूठे अपराध को कबूल कर लेंगे।"]],0],
["Right before walking into the interview room, a waiter accidentally spills hot tea all over your white formal shirt.","इंटरव्यू रूम में जाने से ठीक पहले, एक वेटर गलती से आपकी सफेद फॉर्मल शर्ट पर गर्म चाय गिरा देता है।",[["You will slap the waiter and cancel the interview.","आप वेटर को थप्पड़ मारेंगे और इंटरव्यू रद्द कर देंगे।"],["You will hide in the washroom and miss your turn out of shame.","आप शर्म के मारे वॉशरूम में छिप जाएंगे और अपनी बारी छोड़ देंगे।"],["You will wear the stained shirt, cry during the interview, and beg for sympathy.","आप दाग वाली शर्ट पहनेंगे, इंटरव्यू के दौरान रोएंगे, और सहानुभूति की भीख मांगेंगे।"],["You will quickly clean the stain with water/tissues, borrow a jacket if available, enter confidently, apologize briefly for the appearance, and focus entirely on the interview.","आप जल्दी से पानी/टिश्यू से दाग साफ करेंगे, यदि उपलब्ध हो तो जैकेट उधार लेंगे, आत्मविश्वास से प्रवेश करेंगे, उपस्थिति के लिए संक्षेप में माफी मांगेंगे, और पूरी तरह से साक्षात्कार पर ध्यान केंद्रित करेंगे।"]],3],
["You discover that your roommate has contracted a highly infectious viral disease but refuses to isolate or wear a mask.","आपको पता चलता है कि आपके रूममेट को एक अत्यधिक संक्रामक वायरल बीमारी हो गई है लेकिन वह अलग-थलग (आइसोलेट) रहने या मास्क पहनने से मना करता है।",[["You will beat him and throw his luggage out of the room.","आप उसे पीटेंगे और उसका सामान कमरे से बाहर फेंक देंगे।"],["You will continue to live normally and risk getting infected.","आप सामान्य रूप से रहना जारी रखेंगे और संक्रमित होने का जोखिम उठाएंगे।"],["You will firmly explain the medical risks, inform the hostel warden/parents, wear a mask yourself, and shift him or yourself to a medical isolation room.","आप दृढ़ता से चिकित्सा जोखिमों को समझाएंगे, हॉस्टल वार्डन/माता-पिता को सूचित करेंगे, खुद मास्क पहनेंगे, और उसे या खुद को चिकित्सा अलगाव (आइसोलेशन) कक्ष में स्थानांतरित करेंगे।"],["You will secretly mix sleeping pills in his food to keep him asleep.","आप उसे सुलाए रखने के लिए चुपके से उसके खाने में नींद की गोलियां मिला देंगे।"]],2],
["During a high-altitude trek, your group leader faints due to lack of oxygen, and panic spreads among the group.","एक उच्च-ऊंचाई वाले ट्रेक (पहाड़ी यात्रा) के दौरान, आपका ग्रुप लीडर ऑक्सीजन की कमी के कारण बेहोश हो जाता है, और समूह में दहशत फैल जाती है।",[["You will abandon the group and run downhill alone.","आप समूह को छोड़ देंगे और अकेले नीचे की ओर भागेंगे।"],["You will take charge, calm the group, loosen the leader's tight clothes, provide immediate oxygen/water if available, and organize a safe descent to a lower altitude.","आप कमान संभालेंगे, समूह को शांत करेंगे, नेता के तंग कपड़े ढीले करेंगे, यदि उपलब्ध हो तो तत्काल ऑक्सीजन/पानी देंगे, और कम ऊंचाई पर सुरक्षित वापसी (डिसेंट) का आयोजन करेंगे।"],["You will start crying and wait for a rescue helicopter.","आप रोने लगेंगे और बचाव हेलीकॉप्टर का इंतजार करेंगे।"],["You will aggressively shake and slap the leader to wake him up.","आप नेता को जगाने के लिए आक्रामक रूप से हिलाएंगे और थप्पड़ मारेंगे।"]],1],
["On a severely hot summer afternoon, an elderly woman faints on the road while carrying heavy bags.","बहुत भीषण गर्मी की दोपहर में, भारी बैग ले जा रही एक बुजुर्ग महिला सड़क पर बेहोश हो जाती है।",[["You will quickly move her to a shaded area, sprinkle water on her face, give her ORS/glucose when she regains consciousness, and drop her safely home.","आप जल्दी से उसे छायादार क्षेत्र में ले जाएंगे, उसके चेहरे पर पानी छिड़केंगे, होश में आने पर उसे ओआरएस (ORS)/ग्लूकोज देंगे, और उसे सुरक्षित घर छोड़ देंगे।"],["You will steal her heavy bags while she is unconscious.","उसके बेहोश रहने के दौरान आप उसके भारी बैग चुरा लेंगे।"],["You will assume she is dead and walk away in fear.","आप मान लेंगे कि वह मर चुकी है और डर के मारे चले जाएंगे।"],["You will just look at her from a distance and do nothing.","आप बस दूर से उसे देखेंगे और कुछ नहीं करेंगे।"]],0],
["You are walking past an Army Cantonment gate and notice a suspicious person secretly taking photos of the security layout.","आप एक आर्मी कैंटोनमेंट गेट के पास से गुजर रहे हैं और देखते हैं कि एक संदिग्ध व्यक्ति चुपके से सुरक्षा लेआउट (इमारतों) की तस्वीरें ले रहा है।",[["You will quietly snatch his phone and run away with it.","आप चुपचाप उसका फोन छीन लेंगे और उसे लेकर भाग जाएंगे।"],["You will ignore him because photography is a common hobby.","आप उसे नजरअंदाज कर देंगे क्योंकि फोटोग्राफी एक आम शौक है।"],["You will start beating the man mercilessly on the road.","आप सड़क पर उस आदमी को बेरहमी से पीटना शुरू कर देंगे।"],["You will keep an eye on him, immediately alert the military sentry/guard at the gate, and assist them in apprehending the suspect for questioning.","आप उस पर नज़र रखेंगे, तुरंत गेट पर मौजूद सैन्य संतरी/गार्ड को सतर्क करेंगे, और पूछताछ के लिए संदिग्ध को पकड़ने में उनकी सहायता करेंगे।"]],3],
["You urgently need to pay your college fee, but the ATM deducts the amount from your account without dispensing any cash.","आपको तत्काल अपने कॉलेज की फीस जमा करनी है, लेकिन एटीएम नकद (कैश) निकाले बिना आपके खाते से राशि काट लेता है।",[["You will physically break the ATM machine in frustration.","आप हताशा में एटीएम मशीन को शारीरिक रूप से तोड़ देंगे।"],["You will start shouting at the other customers in the queue.","आप कतार में लगे अन्य ग्राहकों पर चिल्लाना शुरू कर देंगे।"],["You will keep the transaction slip/SMS safely, immediately register a complaint with bank customer care, and ask a friend/family for a temporary loan to pay the fee.","आप लेनदेन की पर्ची/एसएमएस सुरक्षित रखेंगे, तुरंत बैंक कस्टमर केयर में शिकायत दर्ज करेंगे, और फीस का भुगतान करने के लिए किसी दोस्त/परिवार से अस्थायी ऋण (लोन) मांगेंगे।"],["You will give up your studies and return home permanently.","आप अपनी पढ़ाई छोड़ देंगे और स्थायी रूप से घर लौट आएंगे।"]],2],
["Your conservative parents want you to get married immediately, but your sole aim is to join the Indian Air Force.","आपके रूढ़िवादी माता-पिता चाहते हैं कि आप तुरंत शादी कर लें, लेकिन आपका एकमात्र उद्देश्य भारतीय वायु सेना में शामिल होना है।",[["You will blindly obey them and ruin your career dreams.","आप आंख मूंदकर उनकी बात मानेंगे और अपने करियर के सपनों को बर्बाद कर देंगे।"],["You will logically discuss your career goals, explain the honor of serving the nation, ask for dedicated time to prove yourself, and crack the exam with full focus.","आप तार्किक रूप से अपने करियर के लक्ष्यों पर चर्चा करेंगे, देश की सेवा करने के सम्मान को समझाएंगे, खुद को साबित करने के लिए समर्पित समय मांगेंगे, और पूरे ध्यान के साथ परीक्षा पास करेंगे।"],["You will run away from home without telling anyone.","आप किसी को बताए बिना घर से भाग जाएंगे।"],["You will start a hunger strike and threaten suicide.","आप भूख हड़ताल शुरू कर देंगे और आत्महत्या की धमकी देंगे।"]],1],
["While visiting a famous hilltop temple, an aggressive monkey snatches the folder containing your original certificates.","एक प्रसिद्ध पहाड़ी मंदिर के दर्शन के दौरान, एक आक्रामक बंदर आपके मूल प्रमाण पत्रों (ओरिजिनल सर्टिफिकेट्स) वाला फोल्डर छीन लेता है।",[["You will stay calm, offer bananas/food items to the monkey to distract it, wait for it to drop the folder, and safely retrieve it.","आप शांत रहेंगे, बंदर का ध्यान भटकाने के लिए उसे केले/खाने की चीजें देंगे, उसके फोल्डर गिराने का इंतजार करेंगे, और इसे सुरक्षित रूप से वापस ले लेंगे।"],["You will throw heavy stones at the monkey in anger.","आप गुस्से में बंदर पर भारी पत्थर फेंकेंगे।"],["You will climb the tree and start a physical fight with the monkey.","आप पेड़ पर चढ़ जाएंगे और बंदर के साथ शारीरिक लड़ाई शुरू कर देंगे।"],["You will accept that your documents are gone forever and leave.","आप यह मान लेंगे कि आपके दस्तावेज़ हमेशा के लिए चले गए हैं और चले जाएंगे।"]],0],
["During a high-pressure group task (PGT), two of your group members lose their temper and start physically fighting.","एक उच्च दबाव वाले समूह कार्य (PGT) के दौरान, आपके समूह के दो सदस्य अपना आपा खो देते हैं और शारीरिक रूप से लड़ने लगते हैं।",[["You will complain to the Group Testing Officer (GTO) to disqualify them.","आप उन्हें अयोग्य घोषित करने के लिए ग्रुप टेस्टिंग ऑफिसर (GTO) से शिकायत करेंगे।"],["You will join the fight to support your favorite member.","आप अपने पसंदीदा सदस्य का समर्थन करने के लिए लड़ाई में शामिल हो जाएंगे।"],["You will silently sit in a corner and watch them fight.","आप चुपचाप एक कोने में बैठेंगे और उन्हें लड़ते हुए देखेंगे।"],["You will forcefully step in to separate them, sternly remind them of the objective and discipline, cool them down, and refocus the group on completing the task.","आप उन्हें अलग करने के लिए बलपूर्वक बीच में आएंगे, उन्हें सख्ती से उद्देश्य और अनुशासन की याद दिलाएंगे, उन्हें शांत करेंगे, और समूह का ध्यान कार्य पूरा करने पर फिर से केंद्रित करेंगे।"]],3],
["You are driving down a steep hill and suddenly realize that the brakes of your car have completely failed.","आप एक खड़ी पहाड़ी से नीचे गाड़ी चला रहे हैं और अचानक महसूस करते हैं कि आपकी कार के ब्रेक पूरी तरह से फेल हो गए हैं।",[["You will panic and jump out of the moving car immediately.","आप घबरा जाएंगे और तुरंत चलती कार से कूद जाएंगे।"],["You will close your eyes, take your hands off the steering, and pray.","आप अपनी आंखें बंद करेंगे, स्टीयरिंग से हाथ हटा लेंगे, और प्रार्थना करेंगे।"],["You will stay alert, continuously pump the brake pedal, downshift gears to reduce speed via engine braking, use the handbrake gradually, and steer to the safe side of the hill.","आप सतर्क रहेंगे, ब्रेक पैडल को लगातार पंप करेंगे, इंजन ब्रेकिंग के माध्यम से गति कम करने के लिए गियर डाउन करेंगे, धीरे-धीरे हैंडब्रेक का उपयोग करेंगे, और पहाड़ी के सुरक्षित किनारे की ओर स्टीयर करेंगे।"],["You will purposefully crash head-on into an oncoming truck.","आप जानबूझकर सामने से आ रहे एक ट्रक से सीधे टकरा जाएंगे।"]],2],
["A busy shopkeeper mistakenly hands you Rs. 2000 extra while giving you the change.","एक व्यस्त दुकानदार आपको छुट्टे देते समय गलती से 2000 रुपये अधिक दे देता है।",[["You will happily keep the money and spend it on a party.","आप खुशी-खुशी पैसे रख लेंगे और इसे एक पार्टी में खर्च करेंगे।"],["You will immediately point out the error to the shopkeeper and honestly return the extra amount.","आप तुरंत दुकानदार को उसकी गलती बताएंगे और ईमानदारी से अतिरिक्त राशि वापस कर देंगे।"],["You will give the extra Rs. 2000 to a beggar outside.","आप अतिरिक्त 2000 रुपये बाहर एक भिखारी को दे देंगे।"],["You will buy more items from his shop using his own extra money.","आप उसी के अतिरिक्त पैसे का उपयोग करके उसकी दुकान से और सामान खरीद लेंगे।"]],1],
["You are in a packed cinema hall when someone suddenly shouts \"Bomb!\" causing a massive stampede towards the exit.","आप एक खचाखच भरे सिनेमा हॉल में हैं जब अचानक कोई \"बम!\" चिल्लाता है, जिससे निकास द्वार की ओर भारी भगदड़ मच जाती है।",[["You will stay calm, stand on a chair to assess the situation, loudly urge people not to panic, and guide them in an orderly line towards all available emergency exits.","आप शांत रहेंगे, स्थिति का आकलन करने के लिए कुर्सी पर खड़े होंगे, जोर से लोगों से न घबराने का आग्रह करेंगे, और उन्हें सभी उपलब्ध आपातकालीन निकासों की ओर एक व्यवस्थित कतार में मार्गदर्शन करेंगे।"],["You will push old people and women out of the way to save yourself first.","आप खुद को सबसे पहले बचाने के लिए बूढ़े लोगों और महिलाओं को रास्ते से हटा देंगे (धक्का देंगे)।"],["You will lock yourself inside the washroom.","आप खुद को वॉशरूम के अंदर बंद कर लेंगे।"],["You will start shouting \"Bomb!\" even louder to increase the fear.","आप डर बढ़ाने के लिए और भी जोर से \"बम!\" चिल्लाने लगेंगे।"]],0],
["You overhear your close friends planning to use performance-enhancing drugs (doping) for the upcoming physical recruitment rally.","आप अपने करीबी दोस्तों को आगामी शारीरिक भर्ती रैली के लिए प्रदर्शन बढ़ाने वाली दवाओं (डोपिंग) का उपयोग करने की योजना बनाते हुए सुनते हैं।",[["You will ask them to share the drugs with you so you can win too.","आप उनसे आपके साथ दवाएं साझा करने के लिए कहेंगे ताकि आप भी जीत सकें।"],["You will ignore the conversation completely.","आप बातचीत को पूरी तरह से नजरअंदाज कर देंगे।"],["You will immediately report them to the police anonymously.","आप तुरंत पुलिस को गुमनाम रूप से उनकी रिपोर्ट करेंगे।"],["You will confront them firmly, explain the severe health hazards and permanent career ban, and convince them to trust their natural hard work and training.","आप दृढ़ता से उनका सामना करेंगे, गंभीर स्वास्थ्य खतरों और स्थायी करियर प्रतिबंध के बारे में बताएंगे, और उन्हें अपनी प्राकृतिक कड़ी मेहनत और प्रशिक्षण पर भरोसा करने के लिए मनाएंगे।"]],3],
["You are swimming in the deep end of a river and suddenly experience a severe muscle cramp in your leg.","आप एक नदी के गहरे हिस्से में तैर रहे हैं और अचानक आपके पैर की मांसपेशियों में गंभीर ऐंठन (क्रैम्प) आ जाती है।",[["You will flail your arms violently and swallow a lot of water.","आप बेतहाशा अपने हाथ-पैर मारेंगे और बहुत सारा पानी निगल लेंगे।"],["You will try to aggressively swim faster against the current.","आप धारा के विरुद्ध आक्रामक रूप से तेजी से तैरने की कोशिश करेंगे।"],["You will stay completely calm, turn on your back to float, gently massage the cramped muscle, and paddle slowly to the shallow shore using your arms.","आप पूरी तरह से शांत रहेंगे, तैरने के लिए अपनी पीठ के बल हो जाएंगे, ऐंठन वाली मांसपेशी की धीरे-धीरे मालिश करेंगे, और अपने हाथों का उपयोग करके धीरे-धीरे उथले किनारे की ओर बढ़ेंगे।"],["You will accept that you are going to drown and give up.","आप मान लेंगे कि आप डूबने वाले हैं और हार मान लेंगे।"]],2],
["During a heavy rainstorm, a massive tree falls completely blocking the only main road connecting your village to the city.","भारी बारिश और तूफान के दौरान, एक विशाल पेड़ गिर जाता है जो आपके गांव को शहर से जोड़ने वाली एकमात्र मुख्य सड़क को पूरी तरह से अवरुद्ध (ब्लॉक) कर देता है।",[["You will sit at home and wait for the government to fix it next week.","आप घर पर बैठेंगे और अगले सप्ताह सरकार द्वारा इसे ठीक करने का इंतजार करेंगे।"],["You will gather village youths, arrange axes/saws, chop the obstructing branches, clear a usable path for emergencies, and inform the public works department.","आप गांव के युवाओं को इकट्ठा करेंगे, कुल्हाड़ी/आरी की व्यवस्था करेंगे, बाधा डालने वाली शाखाओं को काटेंगे, आपात स्थिति के लिए एक उपयोगी रास्ता साफ करेंगे, और लोक निर्माण विभाग को सूचित करेंगे।"],["You will try to cross the tree with your bike and get injured.","आप अपनी बाइक से पेड़ को पार करने की कोशिश करेंगे और घायल हो जाएंगे।"],["You will start a protest against the forest department.","आप वन विभाग के खिलाफ विरोध प्रदर्शन शुरू कर देंगे।"]],1],
["A poor, barefooted child approaches you on the street, begging for money to buy school books.","सड़क पर एक गरीब, नंगे पैर वाला बच्चा आपके पास आता है, और स्कूल की किताबें खरीदने के लिए पैसे मांगता है।",[["You will refuse cash, take the child to a nearby stationery shop yourself, buy the required books and basic supplies, and encourage him to study.","आप नकद देने से इंकार करेंगे, बच्चे को खुद पास की स्टेशनरी की दुकान पर ले जाएंगे, आवश्यक किताबें और बुनियादी सामग्री खरीदेंगे, और उसे पढ़ने के लिए प्रोत्साहित करेंगे।"],["You will forcefully scold the child for begging and walk away.","आप भीख मांगने के लिए बच्चे को बलपूर्वक डांटेंगे और चले जाएंगे।"],["You will give him a 500-rupee note without asking any questions.","आप बिना कोई सवाल पूछे उसे 500 रुपये का नोट दे देंगे।"],["You will ignore the child and assume it is a gang scam.","आप बच्चे को नजरअंदाज करेंगे और मान लेंगे कि यह एक गिरोह (गैंग) का घोटाला है।"]],0],
["Your colleague steals your innovative idea, presents it to the boss as his own, and gets highly praised.","आपका सहकर्मी आपके अभिनव (इनोवेटिव) विचार को चुरा लेता है, इसे अपने विचार के रूप में बॉस के सामने प्रस्तुत करता है, और अत्यधिक प्रशंसा प्राप्त करता है।",[["You will resign from the company immediately in protest.","आप विरोध में तुरंत कंपनी से इस्तीफा दे देंगे।"],["You will physically assault the colleague outside the office.","आप कार्यालय के बाहर सहकर्मी पर शारीरिक हमला करेंगे।"],["You will quietly accept defeat and stop working hard.","आप चुपचाप हार स्वीकार कर लेंगे और कड़ी मेहनत करना बंद कर देंगे।"],["You will stay composed, request a private meeting with the boss, professionally present your original drafts/proof of the idea, and reclaim your credit gracefully.","आप शांत रहेंगे, बॉस के साथ एक निजी बैठक का अनुरोध करेंगे, पेशेवर रूप से अपने मूल ड्राफ्ट/विचार का प्रमाण प्रस्तुत करेंगे, और शालीनता से अपना श्रेय (क्रेडिट) वापस प्राप्त करेंगे।"]],3],
["You are camping in the forest. At midnight, someone accidentally knocks over a lantern and the tent catches fire.","आप जंगल में कैंपिंग कर रहे हैं। आधी रात को, कोई गलती से एक लालटेन गिरा देता है और तंबू में आग लग जाती है।",[["You will run outside immediately leaving your friends sleeping inside.","आप अपने दोस्तों को अंदर सोता हुआ छोड़कर तुरंत बाहर भाग जाएंगे।"],["You will throw dry leaves on the fire to cover it.","आप आग को ढकने के लिए उस पर सूखी पत्तियां फेंकेंगे।"],["You will instantly wake everyone up, tear/unzip the tent exit, evacuate everyone, and smother the fire using sand or thick blankets.","आप तुरंत सभी को जगाएंगे, तंबू के निकास को फाड़ेंगे/खोलेंगे, सभी को बाहर निकालेंगे, और रेत या मोटे कंबलों का उपयोग करके आग बुझाएंगे।"],["You will panic, scream, and freeze in your place.","आप घबराएंगे, चिल्लाएंगे और अपनी जगह पर सुन्न (फ्रीज) हो जाएंगे।"]],2],
["You witness a hit-and-run accident where a speeding truck hits a motorcyclist and escapes into the dark.","आप एक हिट-एंड-रन दुर्घटना देखते हैं जहाँ एक तेज रफ्तार ट्रक एक मोटरसाइकिल सवार को टक्कर मारता है और अंधेरे में भाग जाता है।",[["You will chase the fast truck on your cycle to fight the driver.","आप ड्राइवर से लड़ने के लिए अपनी साइकिल पर तेज ट्रक का पीछा करेंगे।"],["You will quickly memorize the truck's color/make, rush to the bleeding victim, administer first aid, stop passing vehicles for help, and call an ambulance and the police.","आप जल्दी से ट्रक का रंग/मॉडल याद करेंगे, खून से लथपथ पीड़ित के पास दौड़ेंगे, प्राथमिक उपचार देंगे, मदद के लिए गुजरते वाहनों को रोकेंगे, और एम्बुलेंस और पुलिस को बुलाएंगे।"],["You will search the victim's pockets to steal his wallet.","आप उसका बटुआ चुराने के लिए पीड़ित की जेबों की तलाशी लेंगे।"],["You will assume someone else will help and continue walking.","आप मान लेंगे कि कोई और मदद करेगा और चलना जारी रखेंगे।"]],1],
["The date of your final SSB interview directly clashes with the exact date of your real sister's wedding.","आपके अंतिम एसएसबी साक्षात्कार (SSB Interview) की तारीख आपकी सगी बहन की शादी की सही तारीख से टकराती है।",[["You will explain your lifetime goal to your sister and parents, seek their blessings, attend the interview with full dedication, and join the wedding celebrations via video call or immediately after.","आप अपनी बहन और माता-पिता को अपने जीवन भर के लक्ष्य के बारे में बताएंगे, उनका आशीर्वाद मांगेंगे, पूरे समर्पण के साथ साक्षात्कार में भाग लेंगे, और वीडियो कॉल के माध्यम से या तुरंत बाद शादी के जश्न में शामिल होंगे।"],["You will skip the interview completely because family events are more fun.","आप साक्षात्कार पूरी तरह से छोड़ देंगे क्योंकि पारिवारिक कार्यक्रम अधिक मजेदार होते हैं।"],["You will fight with your parents to postpone the wedding date.","आप शादी की तारीख टालने के लिए अपने माता-पिता से लड़ेंगे।"],["You will secretly go to the interview without telling anyone in the family.","आप परिवार में किसी को बताए बिना चुपके से इंटरव्यू के लिए चले जाएंगे।"]],0]
];
var START=141,N=Q.length,TOTAL=1800,L=0,cur=0,done=false,A=[],i;
for(i=0;i<N;i++)A.push(-1);
var T={
 en:{prev:"Previous",next:"Next",clear:"Clear",sub:"Submit Test",pal:"Question Palette",ans:"Answered",unans:"Not Answered",lang:"हिन्दी",q:"Question",cancel:"Cancel",submit:"Submit",ot:"Submit Test?",answered:"Answered",left:"Not answered",sure:"Are you sure you want to submit?"},
 hi:{prev:"पिछला",next:"अगला",clear:"हटाएँ",sub:"टेस्ट सबमिट करें",pal:"प्रश्न सूची",ans:"उत्तर दिया",unans:"उत्तर नहीं दिया",lang:"English",q:"प्रश्न",cancel:"रद्द करें",submit:"सबमिट",ot:"टेस्ट सबमिट करें?",answered:"उत्तर दिए",left:"बिना उत्तर",sure:"क्या आप सच में सबमिट करना चाहते हैं?"}
};
function $(id){return document.getElementById(id)}
function t(k){return T[L?"hi":"en"][k]}
function cls(c,v){var e=document.getElementsByClassName(c);for(var j=0;j<e.length;j++)e[j].textContent=v}
function render(){
 var q=Q[cur];
 $("qno").textContent=t("q")+" "+(cur+1)+" / "+N+"  (Q"+(START+cur)+")";
 $("qtext").textContent=q[L];
 var h="";
 for(var j=0;j<4;j++){h+='<div class="opt'+(A[cur]===j?' sel':'')+'" onclick="pick('+j+')"><b>'+"ABCD".charAt(j)+'</b><span>'+esc(q[2][j][L])+'</span></div>'}
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===N-1;
 cls("t-prev",t("prev"));cls("t-next",t("next"));cls("t-clear",t("clear"));cls("t-sub",t("sub"));cls("t-pal",t("pal"));cls("t-ans",t("ans"));cls("t-unans",t("unans"));
 $("lang").textContent=t("lang");
 grid();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function grid(){
 var h="";
 for(var j=0;j<N;j++)h+='<button class="'+(A[j]>-1?'ans ':'')+(j===cur?'cur':'')+'" onclick="jump('+j+')">'+(j+1)+'</button>';
 $("grid").innerHTML=h;
}
function pick(j){A[cur]=j;render()}
function clr(){A[cur]=-1;render()}
function go(d){cur=Math.max(0,Math.min(N-1,cur+d));render();window.scrollTo(0,0)}
function jump(j){cur=j;render();window.scrollTo(0,0)}
function toggleLang(){L=L?0:1;document.documentElement.lang=L?"hi":"en";render();if(done)showResult()}
function askSubmit(){
 var a=0;for(var j=0;j<N;j++)if(A[j]>-1)a++;
 $("ovt").textContent=t("ot");
 $("ovp").textContent=t("answered")+": "+a+" | "+t("left")+": "+(N-a)+". "+t("sure");
 $("ovno").textContent=t("cancel");$("ovyes").textContent=t("submit");
 $("ov").style.display="flex";
}
function closeOv(){$("ov").style.display="none"}
var endAt=Date.now()+TOTAL*1000,tick;
function upd(){
 var s=Math.max(0,Math.round((endAt-Date.now())/1000));
 var m=Math.floor(s/60),r=s%60;
 $("timer").textContent=(m<10?"0":"")+m+":"+(r<10?"0":"")+r;
 if(s<=300)$("timer").className="low";
 if(s<=0){finish()}
}
tick=setInterval(upd,500);
function finish(){
 if(done)return;done=true;clearInterval(tick);closeOv();
 $("test").style.display="none";$("timer").style.display="none";
 $("result").style.display="block";showResult();window.scrollTo(0,0);
}
function showResult(){
 var c=0,w=0,s=0,j;
 for(j=0;j<N;j++){if(A[j]<0)s++;else if(A[j]===Q[j][3])c++;else w++}
 var sc=c-w*0.25,hi=L===1;
 var h='<div class="card"><div style="text-align:center;font-weight:700;color:#0b2447">SKC DEFENCE ACADEMY</div>'+
 '<div class="score">'+sc.toFixed(2)+' / '+N+'</div><div style="text-align:center">'+(hi?'कुल स्कोर':'Total Score')+'</div>'+
 '<div class="stats"><div><b>'+N+'</b>'+(hi?'कुल प्रश्न':'Total Questions')+'</div><div><b>'+(c+w)+'</b>'+(hi?'प्रयास किए':'Attempted')+'</div><div><b>'+s+'</b>'+(hi?'छोड़े गए':'Skipped')+'</div><div><b style="color:#2a9d4a">'+c+'</b>'+(hi?'सही (+1)':'Correct (+1)')+'</div><div><b style="color:#d62828">'+w+'</b>'+(hi?'गलत (−0.25)':'Wrong (−0.25)')+'</div></div></div>'+
 '<div class="card"><b>'+(hi?'उत्तर समीक्षा':'Answer Review')+'</b>';
 for(j=0;j<N;j++){
  var q=Q[j],st=A[j]<0?'s':(A[j]===q[3]?'c':'w');
  h+='<div class="rv '+st+'"><b>Q'+(START+j)+'.</b> '+esc(q[L])+'<br>'+
  (hi?'आपका उत्तर: ':'Your answer: ')+(A[j]<0?(hi?'छोड़ा गया':'Skipped'):"ABCD".charAt(A[j])+') '+esc(q[2][A[j]][L]))+'<br>'+
  '<b>'+(hi?'सही उत्तर: ':'Correct answer: ')+"ABCD".charAt(q[3])+') '+esc(q[2][q[3]][L])+'</b></div>';
 }
 h+='</div><div style="text-align:center"><button style="background:#ffc933;color:#0b2447" onclick="toggleLang()">'+t("lang")+'</button> <button style="background:#0b2447;color:#fff" onclick="location.reload()">'+(hi?'दोबारा दें':'Retake Test')+'</button></div>';
 $("result").innerHTML=h;
}
render();
</script>
</body>
</html>
