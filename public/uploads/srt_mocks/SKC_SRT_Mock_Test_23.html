<script>
var PAN=["You will blindly panic the sudden fear, quickly drop the heavy bags, and rapidly run the safe home.","आप आंख मूंदकर अचानक डर में घबराएंगे, जल्दी से भारी बैग गिरा देंगे, और तेजी से सुरक्षित घर भागेंगे।"];
var ANG=["You will angrily kick the nearby object, violently shout the harsh words, and loudly create the public drama.","आप गुस्से में पास की वस्तु को लात मारेंगे, हिंसक रूप से कठोर शब्द चिल्लाएंगे, और जोर-जोर से सार्वजनिक नाटक बनाएंगे।"];
var IGN=["You will quietly ignore the whole situation, silently leave the crowded place, and strictly mind the personal business.","आप चुपचाप पूरी स्थिति को नजरअंदाज करेंगे, चुपचाप भीड़भाड़ वाले स्थान को छोड़ देंगे, और सख्ती से निजी काम पर ध्यान देंगे।"];
var Q=[
["You witness a speeding car hitting a parked bicycle and driving away rapidly.","आप एक तेज रफ्तार कार को एक खड़ी साइकिल को टक्कर मारते और तेजी से भागते हुए देखते हैं।",[["You will angrily chase the running driver, violently hit the guilty person, and loudly create the public drama.","आप गुस्से में भागते चालक का पीछा करेंगे, हिंसक रूप से दोषी व्यक्ति को मारेंगे, और जोर-जोर से सार्वजनिक नाटक बनाएंगे।"],["You will safely note the escaping vehicle, quickly check the damaged bicycle, and calmly inform the actual owner.","आप सुरक्षित रूप से भागते वाहन को नोट करेंगे, जल्दी से क्षतिग्रस्त साइकिल की जांच करेंगे, और शांति से वास्तविक मालिक को सूचित करेंगे।"],["You will quietly ignore the broken bicycle, silently leave the empty street, and strictly avoid the legal trouble.","आप चुपचाप टूटी साइकिल को नजरअंदाज करेंगे, चुपचाप खाली सड़क को छोड़ देंगे, और सख्ती से कानूनी परेशानी से बचेंगे।"],PAN],1],
["You find a beautiful lost pet parrot sitting quietly in your apartment balcony.","आप अपने अपार्टमेंट की बालकनी में एक सुंदर खोए हुए पालतू तोते को चुपचाप बैठे हुए पाते हैं।",[["You will blindly panic the sudden fear, quickly drop the hot tea, and rapidly run the safe room.","आप आंख मूंदकर अचानक डर में घबराएंगे, जल्दी से गर्म चाय गिरा देंगे, और तेजी से सुरक्षित कमरे में भागेंगे।"],["You will gently catch the tired bird, safely provide the fresh water, and calmly find the true owner.","आप धीरे से थके हुए पक्षी को पकड़ेंगे, सुरक्षित रूप से ताजा पानी प्रदान करेंगे, और शांति से सच्चे मालिक को खोजेंगे।"],["You will quietly ignore the poor animal, silently close the glass door, and strictly mind the personal business.","आप चुपचाप बेचारे जानवर को नजरअंदाज करेंगे, चुपचाप कांच का दरवाजा बंद करेंगे, और सख्ती से निजी काम पर ध्यान देंगे।"],["You will aggressively scare the lost parrot, violently throw the hard stones, and loudly shout the angry words.","आप आक्रामक रूप से खोए हुए तोते को डराएंगे, हिंसक रूप से कठोर पत्थर फेंकेंगे, और जोर-जोर से क्रोधित शब्द चिल्लाएंगे।"]],1],
["A coworker is crying silently in the office breakroom.","एक सहकर्मी कार्यालय के ब्रेकरूम में चुपचाप रो रहा है।",[ANG,["You will safely check the sad coworker, calmly call the warm coffee, and properly provide the good friend.","आप सुरक्षित रूप से उदास सहकर्मी की जांच करेंगे, शांति से गर्म कॉफी लाएंगे, और ठीक से एक अच्छे दोस्त की भूमिका प्रदान करेंगे।"],PAN,IGN],1],
["You receive a very expensive gift from an anonymous sender.","आपको एक गुमनाम प्रेषक से बहुत महंगा उपहार मिलता है।",[IGN,PAN,["You will safely check the strange parcel, calmly call the hidden sender, and properly provide the local police.","आप सुरक्षित रूप से अजीब पार्सल की जांच करेंगे, शांति से छिपे हुए प्रेषक को कॉल करेंगे, और ठीक से स्थानीय पुलिस को प्रदान करेंगे।"],ANG],2],
["The hotel room you booked is already occupied by someone else.","आपके द्वारा बुक किया गया होटल का कमरा पहले से ही किसी और के कब्जे में है।",[PAN,ANG,IGN,["You will safely check the wrong room, calmly call the main reception, and properly provide the new key.","आप सुरक्षित रूप से गलत कमरे की जांच करेंगे, शांति से मुख्य रिसेप्शन को बुलाएंगे, और ठीक से नई कुंजी (चाबी) प्रदान करेंगे।"]],3],
["Your luggage lock breaks at the busy railway station.","व्यस्त रेलवे स्टेशन पर आपके सामान का ताला टूट जाता है।",[IGN,PAN,ANG,["You will safely check the broken lock, calmly call the heavy luggage, and properly provide the safe bag.","आप सुरक्षित रूप से टूटे ताले की जांच करेंगे, शांति से भारी सामान को सुरक्षित करेंगे, और ठीक से सुरक्षित बैग प्रदान करेंगे।"]],3],
["A street light pole is sparking dangerously near a playground.","एक खेल के मैदान के पास एक स्ट्रीट लाइट पोल खतरनाक रूप से चिंगारी दे रहा है।",[PAN,IGN,ANG,["You will safely check the sparking pole, calmly call the playing kids, and properly provide the electric board.","आप सुरक्षित रूप से चिंगारी वाले खंभे की जांच करेंगे, शांति से खेल रहे बच्चों को दूर बुलाएंगे, और ठीक से बिजली बोर्ड को सूचित करेंगे।"]],3],
["You accidentally board a train going the wrong direction.","आप गलती से गलत दिशा में जाने वाली ट्रेन में चढ़ जाते हैं।",[PAN,IGN,["You will safely check the wrong train, calmly call the next station, and properly provide the right path.","आप सुरक्षित रूप से गलत ट्रेन की जांच करेंगे, शांति से अगले स्टेशन को बुलाएंगे, और ठीक से सही मार्ग प्रदान करेंगे।"],ANG],2],
["You find a loaded USB drive labeled 'Exams 2026' in the library.","आपको पुस्तकालय में 'Exams 2026' लेबल वाली एक लोडेड USB ड्राइव मिलती है।",[ANG,IGN,PAN,["You will safely check the secret drive, calmly call the library staff, and properly provide the official desk.","आप सुरक्षित रूप से गुप्त ड्राइव की जांच करेंगे, शांति से पुस्तकालय के कर्मचारियों को बुलाएंगे, और ठीक से आधिकारिक डेस्क को प्रदान करेंगे।"]],3],
["Your online bank account shows a sudden unexplained huge deposit.","आपका ऑनलाइन बैंक खाता अचानक अस्पष्टीकृत भारी जमा दिखाता है।",[["You will safely check the huge deposit, calmly call the bank manager, and properly provide the formal complaint.","आप सुरक्षित रूप से भारी जमा की जांच करेंगे, शांति से बैंक प्रबंधक को बुलाएंगे, और ठीक से औपचारिक शिकायत प्रदान करेंगे।"],PAN,IGN,ANG],0],
["A fellow passenger is smoking secretly in the train toilet.","एक सहयात्री ट्रेन के शौचालय में चुपके से धूम्रपान कर रहा है।",[PAN,IGN,ANG,["You will safely check the smoking passenger, calmly call the train guard, and properly provide the strict fine.","आप सुरक्षित रूप से धूम्रपान करने वाले यात्री की जांच करेंगे, शांति से ट्रेन गार्ड को बुलाएंगे, और ठीक से सख्त जुर्माना प्रदान करेंगे।"]],3],
["You see a toddler playing with a sharp kitchen knife.","आप एक बच्चे को तेज रसोई के चाकू से खेलते हुए देखते हैं।",[PAN,ANG,IGN,["You will safely check the sharp knife, calmly call the scared child, and properly provide the calm parent.","आप सुरक्षित रूप से तेज चाकू की जांच करेंगे, शांति से डरे हुए बच्चे को बुलाएंगे, और ठीक से शांत माता-पिता को प्रदान करेंगे।"]],3],
["Your rental car breaks down in a highly remote village.","आपकी किराये की कार एक अत्यधिक दूरस्थ गाँव में खराब हो जाती है।",[IGN,PAN,ANG,["You will safely check the broken car, calmly call the rental company, and properly provide the safe mechanic.","आप सुरक्षित रूप से टूटी हुई कार की जांच करेंगे, शांति से रेंटल कंपनी को बुलाएंगे, और ठीक से सुरक्षित मैकेनिक प्रदान करेंगे।"]],3],
["You overhear someone planning to shoplift from a retail store.","आप किसी को खुदरा स्टोर से चोरी करने की योजना बनाते हुए सुनते हैं।",[PAN,IGN,ANG,["You will safely check the bad thief, calmly call the store guard, and properly provide the stolen item.","आप सुरक्षित रूप से बुरे चोर की जांच करेंगे, शांति से स्टोर गार्ड को बुलाएंगे, और ठीक से चोरी का सामान प्रदान करेंगे।"]],3],
["You accidentally break the handle of a shop's glass door.","आप गलती से एक दुकान के कांच के दरवाजे का हैंडल तोड़ देते हैं।",[ANG,["You will safely check the broken handle, calmly call the shop owner, and properly provide the repair cost.","आप सुरक्षित रूप से टूटे हुए हैंडल की जांच करेंगे, शांति से दुकान के मालिक को बुलाएंगे, और ठीक से मरम्मत लागत प्रदान करेंगे।"],PAN,IGN],1],
["A local vendor accidentally hands you a 2000 rupee note instead of 200.","एक स्थानीय विक्रेता गलती से आपको 200 के बजाय 2000 रुपये का नोट सौंप देता है।",[IGN,["You will safely check the extra cash, calmly call the poor vendor, and properly provide the honest truth.","आप सुरक्षित रूप से अतिरिक्त नकदी की जांच करेंगे, शांति से गरीब विक्रेता को बुलाएंगे, और ठीक से ईमानदार सच प्रदान करेंगे।"],ANG,PAN],1],
["You see a blind man about to step into an open manhole.","आप एक अंधे आदमी को खुले मैनहोल में कदम रखने वाले देखते हैं।",[ANG,IGN,PAN,["You will safely check the blind man, calmly call the open manhole, and properly provide the safe path.","आप सुरक्षित रूप से अंधे आदमी की जांच करेंगे, शांति से उसे खुले मैनहोल से दूर बुलाएंगे, और ठीक से सुरक्षित मार्ग प्रदान करेंगे।"]],3],
["Your umbrella blows away in heavy rain, hitting a pedestrian.","भारी बारिश में आपका छाता उड़ जाता है, और एक पैदल यात्री को लग जाता है।",[["You will safely check the flying umbrella, calmly call the hurt pedestrian, and properly provide the sincere apology.","आप सुरक्षित रूप से उड़ते छाते की जांच करेंगे, शांति से आहत पैदल यात्री को बुलाएंगे, और ठीक से ईमानदार माफी प्रदान करेंगे।"],PAN,ANG,IGN],0],
["You find a fresh, uneaten birthday cake left on a park bench.","आप एक पार्क बेंच पर रखा हुआ एक ताजा, बिना खाया हुआ जन्मदिन का केक पाते हैं।",[PAN,ANG,IGN,["You will safely check the fresh cake, calmly call the park guard, and properly provide the lost item.","आप सुरक्षित रूप से ताजे केक की जांच करेंगे, शांति से पार्क गार्ड को बुलाएंगे, और ठीक से खोई हुई वस्तु प्रदान करेंगे।"]],3],
["A gym member drops a heavy dumbbell on their own foot.","एक जिम सदस्य अपने ही पैर पर एक भारी डम्बल गिरा देता है।",[PAN,IGN,ANG,["You will safely check the heavy dumbbell, calmly call the injured member, and properly provide the medical help.","आप सुरक्षित रूप से भारी डंबल की जांच करेंगे, शांति से घायल सदस्य को बुलाएंगे, और ठीक से चिकित्सा सहायता प्रदान करेंगे।"]],3],

];
var START=736,N=Q.length,TOTAL=1800,L=0,cur=0,done=false,A=[],i;
for(i=0;i<N;i++)A.push(-1);
var T={
 en:{prev:"Previous",next:"Next",clear:"Clear",sub:"Submit Test",pal:"Question Palette",ans:"Answered",unans:"Not Answered",lang:"हिन्दी",q:"Question",cancel:"Cancel",submit:"Submit",ot:"Submit Test?",answered:"Answered",left:"Not answered",sure:"Are you sure you want to submit?"},
 hi:{prev:"पिछला",next:"अगला",clear:"हटाएँ",sub:"टेस्ट सबमिट करें",pal:"प्रश्न सूची",ans:"उत्तर दिया",unans:"उत्तर नहीं दिया",lang:"English",q:"प्रश्न",cancel:"रद्द करें",submit:"सबमिट",ot:"टेस्ट सबमिट करें?",answered:"उत्तर दिए",left:"बिना उत्तर",sure:"क्या आप सच में सबमिट करना चाहते हैं?"}
};
function $(id){return document.getElementById(id)}
function t(k){return T[L?"hi":"en"][k]}
function cls(c,v){var e=document.getElementsByClassName(c);for(var j=0;j<e.length;j++)e[j].textContent=v}
function render(){
 var q=Q[cur];
 $("qno").textContent=t("q")+" "+(cur+1)+" / "+N+"  (Q"+(START+cur)+")";
 $("qtext").textContent=q[L];
 var h="";
 for(var j=0;j<4;j++){h+='<div class="opt'+(A[cur]===j?' sel':'')+'" onclick="pick('+j+')"><b>'+"ABCD".charAt(j)+'</b><span>'+esc(q[2][j][L])+'</span></div>'}
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===N-1;
 cls("t-prev",t("prev"));cls("t-next",t("next"));cls("t-clear",t("clear"));cls("t-sub",t("sub"));cls("t-pal",t("pal"));cls("t-ans",t("ans"));cls("t-unans",t("unans"));
 $("lang").textContent=t("lang");
 grid();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function grid(){
 var h="";
 for(var j=0;j<N;j++)h+='<button class="'+(A[j]>-1?'ans ':'')+(j===cur?'cur':'')+'" onclick="jump('+j+')">'+(j+1)+'</button>';
 $("grid").innerHTML=h;
}
function pick(j){A[cur]=j;render()}
function clr(){A[cur]=-1;render()}
function go(d){cur=Math.max(0,Math.min(N-1,cur+d));render();window.scrollTo(0,0)}
function jump(j){cur=j;render();window.scrollTo(0,0)}
function toggleLang(){L=L?0:1;document.documentElement.lang=L?"hi":"en";render();if(done)showResult()}
function askSubmit(){
 var a=0;for(var j=0;j<N;j++)if(A[j]>-1)a++;
 $("ovt").textContent=t("ot");
 $("ovp").textContent=t("answered")+": "+a+" | "+t("left")+": "+(N-a)+". "+t("sure");
 $("ovno").textContent=t("cancel");$("ovyes").textContent=t("submit");
 $("ov").style.display="flex";
}
function closeOv(){$("ov").style.display="none"}
var endAt=Date.now()+TOTAL*1000,tick;
function upd(){
 var s=Math.max(0,Math.round((endAt-Date.now())/1000));
 var m=Math.floor(s/60),r=s%60;
 $("timer").textContent=(m<10?"0":"")+m+":"+(r<10?"0":"")+r;
 if(s<=300)$("timer").className="low";
 if(s<=0){finish()}
}
tick=setInterval(upd,500);
function finish(){
 if(done)return;done=true;clearInterval(tick);closeOv();
 $("test").style.display="none";$("timer").style.display="none";
 $("result").style.display="block";showResult();window.scrollTo(0,0);
}
function showResult(){
 var c=0,w=0,s=0,j;
 for(j=0;j<N;j++){if(A[j]<0)s++;else if(A[j]===Q[j][3])c++;else w++}
 var sc=c-w*0.25,hi=L===1;
 var h='<div class="card"><div style="text-align:center;font-weight:700;color:#0b2447">SKC DEFENCE ACADEMY</div>'+
 '<div class="score">'+sc.toFixed(2)+' / '+N+'</div><div style="text-align:center">'+(hi?'कुल स्कोर':'Total Score')+'</div>'+
 '<div class="stats"><div><b>'+N+'</b>'+(hi?'कुल प्रश्न':'Total Questions')+'</div><div><b>'+(c+w)+'</b>'+(hi?'प्रयास किए':'Attempted')+'</div><div><b>'+s+'</b>'+(hi?'छोड़े गए':'Skipped')+'</div><div><b style="color:#2a9d4a">'+c+'</b>'+(hi?'सही (+1)':'Correct (+1)')+'</div><div><b style="color:#d62828">'+w+'</b>'+(hi?'गलत (−0.25)':'Wrong (−0.25)')+'</div></div></div>'+
 '<div class="card"><b>'+(hi?'उत्तर समीक्षा':'Answer Review')+'</b>';
 for(j=0;j<N;j++){
  var q=Q[j],st=A[j]<0?'s':(A[j]===q[3]?'c':'w');
  h+='<div class="rv '+st+'"><b>Q'+(START+j)+'.</b> '+esc(q[L])+'<br>'+
  (hi?'आपका उत्तर: ':'Your answer: ')+(A[j]<0?(hi?'छोड़ा गया':'Skipped'):"ABCD".charAt(A[j])+') '+esc(q[2][A[j]][L]))+'<br>'+
  '<b>'+(hi?'सही उत्तर: ':'Correct answer: ')+"ABCD".charAt(q[3])+') '+esc(q[2][q[3]][L])+'</b></div>';
 }
 h+='</div><div style="text-align:center"><button style="background:#ffc933;color:#0b2447" onclick="toggleLang()">'+t("lang")+'</button> <button style="background:#0b2447;color:#fff" onclick="location.reload()">'+(hi?'दोबारा दें':'Retake Test')+'</button></div>';
 $("result").innerHTML=h;
}
render();
</script>
</body>
</html>
