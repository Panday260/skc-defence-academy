<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKC DEFENCE ACADEMY - SRT Mock Test 43</title>
<style>
:root{--navy:#0b2a5b;--navy2:#143d86;--saf:#ff9933;--grn:#138808;--bg:#f2f5fa;--card:#fff;--tx:#1b2433;--mut:#6b7686;--bd:#d9e0ec;--red:#d32f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Mangal","Nirmala UI",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--saf);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.hin{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid var(--saf);flex:none}
.brand{flex:1;min-width:150px}
.brand b{display:block;font-size:18px;letter-spacing:.5px}
.brand span{font-size:12px;opacity:.85}
.tools{display:flex;align-items:center;gap:8px}
.timer{background:#fff;color:var(--navy);font-weight:800;font-size:18px;padding:5px 12px;border-radius:8px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.timer.low{background:var(--red);color:#fff}
.btn{border:0;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--navy2);color:#fff}
.b-grn{background:var(--grn);color:#fff}
.b-saf{background:var(--saf);color:#222}
.b-out{background:#fff;color:var(--navy2);border:2px solid var(--navy2)}
.lang{display:flex;border-radius:8px;overflow:hidden;border:2px solid var(--saf)}
.lang button{border:0;background:transparent;color:#fff;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--saf);color:#222}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hide{display:none!important}
.start{max-width:640px;margin:20px auto;text-align:center}
.start h1{color:var(--navy);margin:6px 0}
.start ul{text-align:left;padding-left:20px}
.start input{width:100%;padding:12px;font-size:16px;border:2px solid var(--bd);border-radius:8px;margin:8px 0 14px;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:600}
.qtext{font-size:18px;font-weight:600;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#e8edf6;color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--navy2);background:#e9f0ff}
.opt.sel .l{background:var(--navy2);color:#fff}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nav .sp{flex:1}
.pal h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pg button{height:40px;border-radius:8px;border:2px solid var(--bd);background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx);touch-action:manipulation}
.pg button.ans{background:var(--grn);border-color:var(--grn);color:#fff}
.pg button.vis{background:#ffe5e5;border-color:var(--red)}
.pg button.cur{outline:3px solid var(--saf);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;margin-top:12px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--bd)}
.ptog{display:none;width:100%;margin-bottom:10px}
.res{max-width:760px;margin:10px auto}
.res h2{text-align:center;color:var(--navy);margin:4px 0}
.score{text-align:center;font-size:46px;font-weight:800;color:var(--navy2);margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.st{border-radius:10px;padding:12px;text-align:center;background:#f2f5fa;border:1px solid var(--bd)}
.st b{display:block;font-size:24px}
.st span{font-size:12px;color:var(--mut)}
.rv{border-top:1px solid var(--bd);padding:12px 0}
.rv .q{font-weight:600;margin-bottom:6px}
.rv .o{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:15px;border:1px solid var(--bd)}
.rv .o.ok{background:#e3f5e1;border-color:var(--grn)}
.rv .o.no{background:#ffe5e5;border-color:var(--red)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:380px;width:100%;text-align:center}
footer{text-align:center;font-size:12px;color:var(--mut);padding:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.ptog{display:block}.pal{display:none}.pal.open{display:block}.qtext{font-size:17px}.brand b{font-size:15px}}
</style>
</head>
<body>
<header><div class="hin">
 <div class="logo">SKC</div>
 <div class="brand"><b>SKC DEFENCE ACADEMY</b><span id="ttl">SRT Test Series – Mock Test 43</span></div>
 <div class="tools">
  <div class="lang"><button id="bEn" class="on" onclick="setLang('en')">English</button><button id="bHi" onclick="setLang('hi')">हिन्दी</button></div>
  <div class="timer hide" id="timer">30:00</div>
 </div>
</div></header>

<main>
<section id="start" class="card start">
 <div class="logo" style="margin:0 auto;width:64px;height:64px;font-size:20px;background:var(--navy);color:#fff">SKC</div>
 <h1 id="sT">SRT Mock Test 43</h1>
 <p id="sSub" style="color:var(--mut);margin:0 0 10px">SKC DEFENCE ACADEMY</p>
 <ul id="sIns"></ul>
 <input id="nm" type="text" maxlength="40" autocomplete="name">
 <button class="btn b-grn" id="sBtn" onclick="startTest()" style="width:100%;font-size:17px"></button>
</section>

<section id="test" class="hide">
 <button class="btn b-out ptog" id="ptog" onclick="togPal()"></button>
 <div class="grid">
  <div class="card">
   <div class="qhead"><span id="qno"></span><span id="qsts"></span></div>
   <div class="qtext" id="qtext"></div>
   <div id="opts"></div>
   <div class="nav">
    <button class="btn b-out" id="prev" onclick="go(-1)"></button>
    <button class="btn b-saf" id="clr" onclick="clearAns()"></button>
    <span class="sp"></span>
    <button class="btn b-pri" id="next" onclick="go(1)"></button>
   </div>
   <div style="margin-top:14px"><button class="btn b-grn" id="sub" onclick="askSubmit()" style="width:100%"></button></div>
  </div>
  <div class="card pal" id="pal">
   <h3 id="palT"></h3>
   <div class="pg" id="pg"></div>
   <div class="leg">
    <span><i style="background:var(--grn)"></i><b id="lA"></b></span>
    <span><i style="background:#ffe5e5;border-color:var(--red)"></i><b id="lN"></b></span>
    <span><i style="background:#fff"></i><b id="lU"></b></span>
   </div>
  </div>
 </div>
</section>

<section id="result" class="hide"><div class="card res">
 <h2 id="rT"></h2>
 <div style="text-align:center;color:var(--mut)" id="rName"></div>
 <div class="score" id="rScore"></div>
 <div style="text-align:center;color:var(--mut);font-size:13px" id="rMark"></div>
 <div class="stats" id="rStats"></div>
 <div style="text-align:center"><button class="btn b-pri" id="rvBtn" onclick="toggleRev()"></button> <button class="btn b-out" onclick="location.reload()" id="rtBtn"></button></div>
 <div id="rev" class="hide" style="margin-top:12px"></div>
</div></section>
</main>
<footer>© SKC DEFENCE ACADEMY</footer>

<div class="modal hide" id="modal"><div class="card">
 <h3 id="mT" style="margin-top:0;color:var(--navy)"></h3>
 <p id="mB"></p>
 <div style="display:flex;gap:10px;justify-content:center"><button class="btn b-out" id="mNo" onclick="closeM()"></button><button class="btn b-grn" id="mYes" onclick="finish()"></button></div>
</div></div>

<script>
var TITLE_EN="SRT Test Series – Mock Test 43", TITLE_HI="एसआरटी टेस्ट सीरीज़ – मॉक टेस्ट 43";
var DURATION=30*60, PLUS=1, MINUS=0.25;
// [question EN, question HI, [A en, A hi], [B], [C], [D], correct index 0-3]
var Q=[
["Your cruel landlord throws all your luggage out on the street at 2 AM in the freezing rain without any prior notice.", "आपका क्रूर मकान मालिक बिना किसी पूर्व सूचना के रात 2 बजे जमा देने वाली बारिश में आपका सारा सामान सड़क पर फेंक देता है।", ["Burn the landlord's car in a fit of uncontrollable rage and wait for the police to arrest you.", "बेकाबू गुस्से में मकान मालिक की कार जला देंगे और पुलिस द्वारा आपको गिरफ्तार किए जाने का इंतजार करेंगे।"], ["Sleep on the wet street with your soaked bags, weeping silently, and accept the absolute humiliation until morning.", "अपने भीगे हुए बैगों के साथ गीली सड़क पर सो जाएंगे, चुपचाप रोएंगे, और सुबह तक पूर्ण अपमान को स्वीकार करेंगे।"], ["Break down the apartment door violently with a heavy stone to force your way back inside.", "जबरदस्ती अंदर जाने के लिए एक भारी पत्थर से अपार्टमेंट का दरवाजा हिंसक रूप से तोड़ देंगे।"], ["Give up on living and end your life immediately to escape this miserable and insulting humiliation.", "इस दयनीय और अपमानजनक स्थिति से बचने के लिए जीवन से हार मानकर तुरंत अपना जीवन समाप्त कर देंगे।"], 1],
["A corrupt traffic cop wrongly accuses you of jumping a signal, abuses your parents, and slaps you across the face.", "एक भ्रष्ट ट्रैफिक पुलिसकर्मी गलत तरीके से आप पर सिग्नल जंप करने का आरोप लगाता है, आपके माता-पिता को गाली देता है, और आपके चेहरे पर थप्पड़ मारता है।", ["Suppress your intense rage, pay the unfair fine in utter humiliation, and drive away feeling completely defeated.", "अपने तीव्र क्रोध को दबाएंगे, अत्यधिक अपमान में अनुचित जुर्माना अदा करेंगे, और पूरी तरह से हारा हुआ महसूस करते हुए दूर चले जाएंगे।"], ["Grab the policeman's collar and physically assault him severely on the road for insulting your parents.", "पुलिसकर्मी का कॉलर पकड़ लेंगे और अपने माता-पिता का अपमान करने के लिए सड़क पर उसके साथ गंभीर रूप से मारपीट करेंगे।"], ["Snatch the policeman's weapon in a panic and threaten to shoot him if he touches you again.", "घबराहट में पुलिसकर्मी का हथियार छीन लेंगे और यदि वह आपको फिर से छूता है तो उसे गोली मारने की धमकी देंगे।"], ["Ram your car into the police barricades aggressively to take revenge and escape the scene.", "बदला लेने और घटनास्थल से भागने के लिए अपनी कार को आक्रामक रूप से पुलिस बैरिकेड्स में घुसा देंगे।"], 0],
["You witness your evil neighbor intentionally feeding poison to your beloved pet dog, killing it instantly.", "आप अपने दुष्ट पड़ोसी को जानबूझकर अपने प्यारे पालतू कुत्ते को जहर खिलाते हुए देखते हैं, जिससे उसकी तुरंत मौत हो जाती है।", ["Break into the neighbor's house with a weapon and brutally attack them to avenge your innocent dog.", "एक हथियार के साथ पड़ोसी के घर में घुस जाएंगे और अपने निर्दोष कुत्ते का बदला लेने के लिए उन पर बेरहमी से हमला करेंगे।"], ["Mix lethal poison in the neighbor's water tank at night to ensure their entire family suffers the same pain.", "रात में पड़ोसी की पानी की टंकी में घातक जहर मिला देंगे ताकि यह सुनिश्चित हो सके कि उनके पूरे परिवार को भी वही दर्द हो।"], ["Fall into deep, paralyzing grief, bury your dog crying helplessly, and move out of the neighborhood out of fear.", "गहरे, पंगु बना देने वाले दुख में डूब जाएंगे, बेबस होकर रोते हुए अपने कुत्ते को दफनाएंगे, और डर के मारे पड़ोस से बाहर चले जाएंगे।"], ["End your own life because you cannot bear the extreme pain of losing your only companion.", "अपने इकलौते साथी को खोने का अत्यधिक दर्द सहन न कर पाने के कारण अपना जीवन समाप्त कर लेंगे।"], 2],
["You are unfairly fired from your corporate job because the new manager discriminates against your caste/regional background.", "आपको अपनी कॉर्पोरेट नौकरी से अनुचित तरीके से निकाल दिया जाता है क्योंकि नया प्रबंधक आपकी जाति/क्षेत्रीय पृष्ठभूमि के खिलाफ भेदभाव करता है।", ["Bitterly accept the discrimination, lose all your self-confidence, and settle for a much lower-paying, degrading job.", "कड़वाहट से भेदभाव को स्वीकार करेंगे, अपना सारा आत्मविश्वास खो देंगे, और बहुत कम वेतन वाली, अपमानजनक नौकरी से समझौता करेंगे।"], ["Destroy the company's main server room with a hammer before leaving the building to cause massive financial damage.", "बड़े पैमाने पर वित्तीय नुकसान पहुंचाने के लिए इमारत छोड़ने से पहले एक हथौड़े से कंपनी के मुख्य सर्वर रूम को नष्ट कर देंगे।"], ["Wait outside the office at night and heavily vandalize the discriminatory manager's expensive car with a metal rod.", "रात में कार्यालय के बाहर प्रतीक्षा करेंगे और एक लोहे की छड़ से भेदभावपूर्ण प्रबंधक की महंगी कार में भारी तोड़फोड़ करेंगे।"], ["Send highly abusive and threatening emails to the CEO, guaranteeing that a police case is filed against you.", "सीईओ को अत्यधिक अपमानजनक और धमकी भरे ईमेल भेजेंगे, यह गारंटी देते हुए कि आपके खिलाफ पुलिस मामला दर्ज किया जाए।"], 0],
["The computer system completely crashes during your final attempt at the UPSC mains exam, instantly destroying your lifelong dream.", "यूपीएससी (UPSC) मेन्स परीक्षा में आपके अंतिम प्रयास के दौरान कंप्यूटर सिस्टम पूरी तरह से क्रैश हो जाता है, जिससे आपका जीवन भर का सपना तुरंत नष्ट हो जाता है।", ["Attack the exam invigilator violently, blaming them for the faulty system and destroying the exam center's property.", "दोषपूर्ण प्रणाली के लिए उन्हें दोषी ठहराते हुए परीक्षा निरीक्षक पर हिंसक हमला करेंगे और परीक्षा केंद्र की संपत्ति को नष्ट कर देंगे।"], ["Give up your lifelong dream entirely, tear up all your study notes in deep despair, and return to your village defeated.", "अपने जीवन भर के सपने को पूरी तरह से छोड़ देंगे, गहरी निराशा में अपने सभी अध्ययन नोट्स फाड़ देंगे, और पराजित होकर अपने गांव लौट जाएंगे।"], ["Attempt to end your life out of sheer hopeless panic and extreme depression.", "शुद्ध निराशाजनक घबराहट और अत्यधिक अवसाद के कारण अपना जीवन समाप्त करने का प्रयास करेंगे।"], ["Steal another candidate's working computer forcefully, ruining their exam to selfishly save your own attempt.", "स्वार्थपूर्ण तरीके से अपना प्रयास बचाने के लिए किसी अन्य उम्मीदवार का काम करने वाला कंप्यूटर बलपूर्वक चुरा लेंगे, जिससे उनकी परीक्षा बर्बाद हो जाएगी।"], 1],
["A haughty waiter publicly insults your cheap clothes and kicks you out of a high-end restaurant in front of a huge crowd.", "एक घमंडी वेटर सार्वजनिक रूप से आपके सस्ते कपड़ों का अपमान करता है और भारी भीड़ के सामने आपको एक हाई-एंड रेस्तरां से बाहर निकाल देता है।", ["Throw a heavy glass bottle directly at the waiter's head to protect your ego and cause severe injury.", "अपने अहंकार की रक्षा करने और गंभीर चोट पहुंचाने के लिए सीधे वेटर के सिर पर एक भारी कांच की बोतल फेंकेंगे।"], ["Light a fire in the restaurant's reception area as revenge for the extreme public humiliation you suffered.", "आपके द्वारा सहे गए अत्यधिक सार्वजनिक अपमान के प्रतिशोध के रूप में रेस्तरां के रिसेप्शन क्षेत्र में आग लगा देंगे।"], ["Start screaming abusive words at all the customers eating there, acting completely insane and uncontrollable.", "वहां खाना खाने वाले सभी ग्राहकों पर गाली-गलौज करते हुए चिल्लाना शुरू कर देंगे, पूरी तरह से पागल और बेकाबू व्यवहार करेंगे।"], ["Walk away with your head down in deep, miserable shame, vowing bitterly to never eat out at a restaurant again.", "गहरी, दयनीय शर्म से अपना सिर झुकाकर चले जाएंगे, कड़वाहट से कसम खाएंगे कि फिर कभी किसी रेस्तरां में खाना नहीं खाएंगे।"], 3],
["A pickpocket steals your wallet; you catch him, but he suddenly pulls out a sharp, rusty blade and points it at your stomach.", "एक पिकपॉकेट आपका बटुआ चुरा लेता है; आप उसे पकड़ लेते हैं, लेकिन वह अचानक एक तेज, जंग लगा ब्लेड निकालता है और इसे आपके पेट की ओर इशारा करता है।", ["Charge at the pickpocket aggressively, trying to snatch the blade barehanded and risking a fatal stab wound.", "पिकपॉकेट पर आक्रामक रूप से प्रहार करेंगे, नंगे हाथों से ब्लेड छीनने की कोशिश करेंगे और एक घातक छुरा घोंपने का जोखिम उठाएंगे।"], ["Raise your hands in cowardly fear, let him take everything, and run away trembling and crying for your life.", "कायरतापूर्ण डर से अपने हाथ खड़े करेंगे, उसे सब कुछ लेने देंगे, और कांपते हुए और अपनी जान के लिए रोते हुए भाग जाएंगे।"], ["Pull out a heavy stone and smash the thief's skull, killing him instantly over a stolen wallet.", "एक भारी पत्थर निकालेंगे और चोर की खोपड़ी को तोड़ देंगे, चोरी हुए बटुए के लिए उसे तुरंत मार देंगे।"], ["Challenge the thief to stab you, shouting like a maniac because you no longer care if you live or die.", "चोर को आपको चाकू मारने की चुनौती देंगे, एक पागल की तरह चिल्लाएंगे क्योंकि अब आपको परवाह नहीं है कि आप जीते हैं या मरते हैं।"], 1],
["A corrupt doctor gives you a fake terminal disease diagnosis to extract all your life savings through unnecessary surgeries.", "एक भ्रष्ट डॉक्टर अनावश्यक सर्जरी के माध्यम से आपके जीवन भर की बचत को निकालने के लिए आपको एक नकली लाइलाज बीमारी का निदान देता है।", ["Kidnap the doctor's child to force him to return all your extorted life savings immediately.", "अपनी सभी जबरन वसूली गई जीवन भर की बचत को तुरंत वापस करने के लिए मजबूर करने के लिए डॉक्टर के बच्चे का अपहरण करेंगे।"], ["Burn down the entire medical clinic at night, endangering innocent patients, just to get your revenge on the doctor.", "डॉक्टर से अपना बदला लेने के लिए, रात में पूरे मेडिकल क्लिनिक को जला देंगे, जिससे निर्दोष मरीजों को खतरा होगा।"], ["Reluctantly pay your life savings out of blind fear, discovering later you are financially ruined but accepting your miserable fate.", "अंधे डर से अनिच्छा से अपनी जीवन भर की बचत का भुगतान करेंगे, बाद में पता चलेगा कि आप आर्थिक रूप से बर्बाद हो गए हैं लेकिन अपने दयनीय भाग्य को स्वीकार करेंगे।"], ["End your own life outside the hospital doors to permanently escape the fake terminal illness and the financial burden.", "नकली लाइलाज बीमारी और वित्तीय बोझ से स्थायी रूप से बचने के लिए अस्पताल के दरवाजे के बाहर अपना जीवन समाप्त कर लेंगे।"], 2],
["Your trusted best friend steals your billion-dollar startup idea, patents it under his name, and becomes insanely rich, leaving you with nothing.", "आपका सबसे भरोसेमंद दोस्त आपके बिलियन-डॉलर के स्टार्टअप विचार को चुरा लेता है, इसे अपने नाम से पेटेंट कराता है, और बेहद अमीर बन जाता है, जिससे आपके पास कुछ नहीं बचता।", ["Hire contract killers from the dark web to permanently eliminate your backstabbing best friend.", "अपने पीठ में छुरा घोंपने वाले सबसे अच्छे दोस्त को स्थायी रूप से खत्म करने के लिए डार्क वेब से भाड़े के हत्यारों (contract killers) को काम पर रखेंगे।"], ["Cut off all social contact in severe depression, isolate yourself in a dark room, and accept that you will always be a loser.", "गंभीर अवसाद में सभी सामाजिक संपर्क काट लेंगे, खुद को एक अंधेरे कमरे में अलग कर लेंगे, और स्वीकार करेंगे कि आप हमेशा एक हारे हुए इंसान रहेंगे।"], ["Break into his new mansion and steal all his expensive valuables to balance the extreme financial betrayal.", "चरम वित्तीय विश्वासघात को संतुलित करने के लिए उसकी नई हवेली में सेंध लगाएंगे और उसकी सभी महंगी कीमती सामान चुरा लेंगे।"], ["Start consuming heavy illegal drugs daily to numb the intense psychological pain and betrayal you suffered.", "आपके द्वारा सहे गए तीव्र मनोवैज्ञानिक दर्द और विश्वासघात को सुन्न करने के लिए रोजाना भारी अवैध ड्रग्स का सेवन शुरू कर देंगे।"], 1],
["Vicious neighbors spread a completely false rumor that you are a child abuser, and now the entire society hates and boycotts you.", "शातिर पड़ोसी एक पूरी तरह से झूठी अफवाह फैलाते हैं कि आप एक बाल दुर्व्यवहार करने वाले हैं, और अब पूरा समाज आपसे नफरत करता है और आपका बहिष्कार करता है।", ["Poison the society's common water tank to take mass revenge on everyone who falsely judged you.", "आपको झूठा आंकने वाले सभी लोगों से सामूहिक बदला लेने के लिए समाज के सामान्य पानी के टैंक में जहर मिला देंगे।"], ["Lock yourself inside your house, developing severe social anxiety, and wait miserably for months hoping they forget.", "खुद को अपने घर के अंदर बंद कर लेंगे, गंभीर सामाजिक चिंता (social anxiety) विकसित करेंगे, और महीनों तक दयनीय रूप से प्रतीक्षा करेंगे कि वे भूल जाएंगे।"], ["Physically assault the neighbor who started the rumor in the middle of the street with a heavy iron rod.", "सड़क के बीच में भारी लोहे की छड़ से अफवाह शुरू करने वाले पड़ोसी पर शारीरिक हमला करेंगे।"], ["Stand on your balcony and threaten to harm yourself if the society members do not apologize to you immediately.", "अपनी बालकनी पर खड़े होंगे और धमकी देंगे कि यदि समाज के सदस्य तुरंत आपसे माफी नहीं मांगते हैं तो आप खुद को नुकसान पहुंचाएंगे।"], 1],
["On the morning of your wedding, you catch your fiancé(e) intimately cheating on you with your own sibling.", "अपनी शादी की सुबह, आप अपने मंगेतर को अपने ही भाई-बहन के साथ अंतरंग रूप से आपको धोखा देते हुए पकड़ते हैं।", ["Murder both of them in the bridal suite in a fit of absolute, uncontrollable psychotic rage.", "पूर्ण, बेकाबू मानसिक क्रोध के दौरे में ब्राइडल सूट में दोनों की हत्या कर देंगे।"], ["Cancel the wedding silently, face the agonizing societal mockery alone, and isolate yourself completely from your entire family forever.", "चुपचाप शादी रद्द करेंगे, अकेले दर्दनाक सामाजिक उपहास का सामना करेंगे, और हमेशा के लिए अपने पूरे परिवार से खुद को पूरी तरह से अलग कर लेंगे।"], ["Publicly strip and beat them in front of all the wedding guests to ensure their lives are permanently destroyed.", "यह सुनिश्चित करने के लिए कि उनका जीवन स्थायी रूप से नष्ट हो जाए, सभी शादी के मेहमानों के सामने उन्हें सार्वजनिक रूप से निर्वस्त्र कर पीटेंगे।"], ["Forcefully go through with the fake wedding anyway because you are too cowardly to face the social embarrassment.", "वैसे भी जबरदस्ती नकली शादी करेंगे क्योंकि आप सामाजिक शर्मिंदगी का सामना करने के लिए बहुत कायर हैं।"], 1],
["The national bank where you deposited your entire life savings goes permanently bankrupt, and the government declares your money is lost forever.", "वह राष्ट्रीय बैंक जहां आपने अपने जीवन भर की बचत जमा की थी, स्थायी रूप से दिवालिया हो जाता है, और सरकार घोषणा करती है कि आपका पैसा हमेशा के लिए खो गया है।", ["Build a crude explosive device and detonate it inside the bank manager's office to take ultimate revenge.", "अंतिम बदला लेने के लिए एक कच्चा विस्फोटक उपकरण बनाएंगे और इसे बैंक प्रबंधक के कार्यालय के अंदर विस्फोट करेंगे।"], ["Break down emotionally, beg distant relatives for basic food, and hopelessly accept a miserable life of extreme poverty.", "भावनात्मक रूप से टूट जाएंगे, दूर के रिश्तेदारों से बुनियादी भोजन की भीख मांगेंगे, और निराशा से अत्यधिक गरीबी के दयनीय जीवन को स्वीकार करेंगे।"], ["Form a violent mob and start burning down government buses and public property across the city in rage.", "एक हिंसक भीड़ बनाएंगे और गुस्से में शहर भर में सरकारी बसों और सार्वजनिक संपत्ति को जलाना शुरू कर देंगे।"], ["End your own life because you cannot bear the thought of starting from zero again.", "फिर से शून्य से शुरू करने के विचार को सहन न कर पाने के कारण अपना जीवन समाप्त कर लेंगे।"], 1],
["Your toxic boss throws a heavy metal file directly at your face during a board meeting, splitting your lip open.", "आपका विषैला बॉस एक बोर्ड मीटिंग के दौरान एक भारी धातु की फाइल सीधे आपके चेहरे पर फेंकता है, जिससे आपका होंठ फट जाता है।", ["Pick up the papers with trembling hands, apologize profusely out of sheer fear of losing the job, and cry silently in the washroom.", "कांपते हाथों से कागजात उठाएंगे, नौकरी खोने के डर से अत्यधिक माफी मांगेंगे, और वाशरूम में चुपचाप रोएंगे।"], ["Throw a heavy laptop at the boss's head with full force, fracturing his skull and guaranteeing your arrest.", "बॉस के सिर पर पूरी ताकत से एक भारी लैपटॉप फेंकेंगे, उसकी खोपड़ी को तोड़ देंगे और अपनी गिरफ्तारी की गारंटी देंगे।"], ["Steal highly confidential company trade secrets and sell them to a rival company to bankrupt your evil boss.", "अत्यधिक गोपनीय कंपनी व्यापार रहस्य (trade secrets) चुरा लेंगे और अपने दुष्ट बॉस को दिवालिया करने के लिए उन्हें प्रतिद्वंद्वी कंपनी को बेच देंगे।"], ["Threaten to harm yourself unless the boss falls to his knees and begs for your forgiveness.", "जब तक बॉस अपने घुटनों पर नहीं गिरता और आपसे माफी की भीख नहीं मांगता, तब तक खुद को नुकसान पहुंचाने की धमकी देंगे।"], 0],
["You are brutally and mercilessly trolled online by millions of people for a harmless, slightly awkward photo you posted.", "आपके द्वारा पोस्ट की गई एक हानिरहित, थोड़ी अजीब तस्वीर के लिए लाखों लोगों द्वारा आपको क्रूरतापूर्वक और बेरहमी से ऑनलाइन ट्रोल किया जाता है।", ["Delete all your internet presence in an extreme panic, suffering from severe paranoia that people are constantly laughing at you in public.", "अत्यधिक घबराहट में अपनी सभी इंटरनेट उपस्थिति को हटा देंगे, इस गंभीर व्यामोह (paranoia) से पीड़ित होंगे कि लोग सार्वजनिक रूप से आप पर लगातार हंस रहे हैं।"], ["Hire a hacker to crash the social media platform entirely, committing a massive federal cybercrime out of fragile ego.", "नाजुक अहंकार के कारण एक बड़े पैमाने पर संघीय साइबर अपराध करते हुए, सोशल मीडिया प्लेटफॉर्म को पूरी तरह से क्रैश करने के लिए एक हैकर को नियुक्त करेंगे।"], ["Post a distressing video of yourself in severe emotional crisis to make all the internet trolls feel guilty for their actions.", "सभी इंटरनेट ट्रोल्स को उनके कार्यों के लिए दोषी महसूस कराने के लिए गंभीर भावनात्मक संकट में अपना एक परेशान करने वाला वीडियो पोस्ट करेंगे।"], ["Start excessively abusing and sending death threats to every single person who left a negative comment on your photo.", "आपकी तस्वीर पर नकारात्मक टिप्पणी करने वाले हर एक व्यक्ति को अत्यधिक गाली देना और मौत की धमकी देना शुरू कर देंगे।"], 0],
["Security guards at a mall falsely accuse you of theft, drag you to a back room, and aggressively strip-search you.", "एक मॉल में सुरक्षा गार्ड आप पर झूठा चोरी का आरोप लगाते हैं, आपको एक पिछले कमरे में खींच ले जाते हैं, और आक्रामक रूप से आपकी नग्न-तलाशी (strip-search) लेते हैं।", ["Pull out a concealed knife and stab the security guards repeatedly to defend your bodily dignity at any cost.", "किसी भी कीमत पर अपनी शारीरिक गरिमा की रक्षा के लिए एक छिपा हुआ चाकू निकालेंगे और सुरक्षा गार्डों को बार-बार छुरा घोंपेंगे।"], ["Cry silently and pitifully during the humiliating search, too terrified to speak up, and swear out of trauma to never visit a mall again.", "अपमानजनक तलाशी के दौरान चुपचाप और दयनीय रूप से रोएंगे, बोलने के लिए बहुत भयभीत होंगे, और आघात के कारण फिर कभी मॉल न जाने की कसम खाएंगे।"], ["Burn down the entire shopping mall at night to erase the location of your ultimate humiliation from the earth.", "पृथ्वी से अपने अंतिम अपमान के स्थान को मिटाने के लिए रात में पूरे शॉपिंग मॉल को जला देंगे।"], ["Strip entirely naked in the middle of the crowded mall courtyard, screaming like a lunatic to protest the unfair treatment.", "अनुचित व्यवहार का विरोध करने के लिए एक पागल की तरह चिल्लाते हुए, भीड़भाड़ वाले मॉल के प्रांगण के बीच में पूरी तरह से नग्न हो जाएंगे।"], 1],
["You contract a highly contagious, severe disease, and your cruel roommates immediately kick you out onto the street in the rain.", "आपको एक अत्यधिक संक्रामक, गंभीर बीमारी हो जाती है, और आपके क्रूर रूममेट्स आपको तुरंत बारिश में सड़क पर निकाल देते हैं।", ["Intentionally spit and bleed all over their personal belongings before leaving so that they definitely catch the fatal disease too.", "जाने से पहले जानबूझकर उनके सभी निजी सामानों पर थूकेंगे और खून बहाएंगे ताकि वे भी निश्चित रूप से घातक बीमारी की चपेट में आ जाएं।"], ["Break their bones with a metal pipe so they understand the physical pain of suffering before you leave the flat.", "धातु के पाइप से उनकी हड्डियां तोड़ देंगे ताकि वे फ्लैट छोड़ने से पहले पीड़ित होने के शारीरिक दर्द को समझ सकें।"], ["Drag yourself to a cheap, filthy lodge, coughing violently, and suffer completely alone in utter misery without any proper medical help.", "हिंसक रूप से खांसते हुए खुद को एक सस्ते, गंदे लॉज में घसीटेंगे, और बिना किसी उचित चिकित्सा सहायता के घोर दुख में पूरी तरह से अकेले पीड़ित होंगे।"], ["Give up on life and end your suffering, since you have no one to help you.", "जीवन से हार मानकर अपनी पीड़ा समाप्त कर देंगे, क्योंकि आपकी मदद करने वाला कोई नहीं है।"], 2],
["Your greedy older sibling physically beats you and forces you to sign away your entire share of the ancestral inheritance.", "आपका लालची बड़ा भाई-बहन आपको शारीरिक रूप से पीटता है और आपको पैतृक विरासत के अपने पूरे हिस्से पर हस्ताक्षर करने के लिए मजबूर करता है।", ["Reluctantly sign away your lawful rights crying in fear of more family violence, walking away penniless, broken, and defeated.", "परिवार की और अधिक हिंसा के डर से रोते हुए अनिच्छा से अपने कानूनी अधिकारों पर हस्ताक्षर कर देंगे, और कंगाल, टूटे हुए और पराजित होकर चले जाएंगे।"], ["Pick up a kitchen knife and slash your sibling's throat to ensure nobody gets the ancestral property ever.", "रसोई का चाकू उठाएंगे और अपने भाई-बहन का गला काट देंगे ताकि यह सुनिश्चित हो सके कि पैतृक संपत्ति कभी किसी को न मिले।"], ["Hire local goons to kidnap your sibling's children and demand the entire ancestral property as ransom.", "अपने भाई-बहन के बच्चों का अपहरण करने के लिए स्थानीय गुंडों को काम पर रखेंगे और फिरौती के रूप में पूरी पैतृक संपत्ति की मांग करेंगे।"], ["Harm yourself in front of your sibling so they are traumatized for the rest of their life.", "अपने भाई-बहन के सामने खुद को नुकसान पहुंचाएंगे ताकि उन्हें जीवन भर के लिए आघात पहुंचे।"], 0],
["A wealthy, arrogant man crashes his luxury SUV into your bicycle, completely destroying it, and then violently slaps you for being in his way.", "एक धनी, घमंडी आदमी अपनी लक्ज़री एसयूवी (SUV) को आपकी साइकिल में दुर्घटनाग्रस्त कर देता है, इसे पूरी तरह से नष्ट कर देता है, और फिर उसके रास्ते में आने के लिए आपको हिंसक रूप से थप्पड़ मारता है।", ["Smash his expensive car windshield with a heavy brick, pull him out, and beat him half to death on the highway.", "एक भारी ईंट से उसकी महंगी कार की विंडशील्ड को तोड़ देंगे, उसे बाहर खींचेंगे, और राजमार्ग पर उसे अधमरा होने तक पीटेंगे।"], ["Apologize to him profusely out of sheer terror, abandon your broken bicycle in the dirt, and limp all the way home in miserable pain.", "शुद्ध आतंक के कारण उससे बहुत माफी मांगेंगे, अपनी टूटी हुई साइकिल को गंदगी में छोड़ देंगे, और दयनीय दर्द में लंगड़ाते हुए घर जाएंगे।"], ["Jump onto the hood of his moving SUV, screaming frantically and refusing to get off until he runs you over completely.", "उसकी चलती एसयूवी के हुड पर कूद जाएंगे, पागलों की तरह चिल्लाएंगे और तब तक उतरने से इंकार करेंगे जब तक कि वह आपको पूरी तरह से कुचल न दे।"], ["Follow him to his house secretly at night and set his luxury car on fire to exact your fiery revenge.", "रात में गुप्त रूप से उसके घर तक उसका पीछा करेंगे और अपना उग्र बदला लेने के लिए उसकी लक्जरी कार में आग लगा देंगे।"], 1],
["Your corrupt university professor threatens to fail you in the final degree exam unless you pay him a massive, dirty bribe.", "आपका भ्रष्ट विश्वविद्यालय प्रोफेसर आपको अंतिम डिग्री परीक्षा में फेल करने की धमकी देता है जब तक कि आप उसे बड़े पैमाने पर, गंदी रिश्वत का भुगतान नहीं करते।", ["Swallow your morals entirely, take a heavy debt from loan sharks, and pay the dirty bribe crying just to save your academic year.", "अपनी नैतिकता को पूरी तरह से निगल लेंगे, लोन शार्क से भारी कर्ज लेंगे, और केवल अपना शैक्षणिक वर्ष बचाने के लिए रोते हुए गंदी रिश्वत देंगे।"], ["Murder the corrupt professor in his office to ensure he can never exploit any other helpless student ever again.", "भ्रष्ट प्रोफेसर की उसके कार्यालय में हत्या कर देंगे ताकि यह सुनिश्चित हो सके कि वह कभी भी किसी अन्य असहाय छात्र का शोषण न कर सके।"], ["Start a massive violent riot in the university campus, destroying all the laboratories and classrooms in a blind fury.", "अंधी उग्रता में सभी प्रयोगशालाओं और कक्षाओं को नष्ट करते हुए, विश्वविद्यालय परिसर में बड़े पैमाने पर हिंसक दंगा शुरू कर देंगे।"], ["Harm yourself in the professor's classroom during a lecture to leave a permanent trauma on him and the students.", "प्रोफेसर और छात्रों पर स्थायी आघात छोड़ने के लिए एक व्याख्यान के दौरान प्रोफेसर की कक्षा में खुद को नुकसान पहुंचाएंगे।"], 0],
["A violent mob of rioters suddenly surrounds your car, carrying flaming torches and metal rods, looking for people to attack.", "दंगाइयों की एक हिंसक भीड़ अचानक आपकी कार को घेर लेती है, जिसमें जलती हुई मशालें और लोहे की छड़ें होती हैं, जो हमला करने के लिए लोगों की तलाश कर रही होती हैं।", ["Accelerate your car at maximum speed directly into the mob, intentionally crushing and killing dozens of people to escape.", "अपनी कार को अधिकतम गति से सीधे भीड़ में घुसा देंगे, भागने के लिए दर्जनों लोगों को जानबूझकर कुचल कर मार डालेंगे।"], ["Step out of the car and start hurling heavy stones at the rioters, guaranteeing that they beat you to death.", "कार से बाहर निकलेंगे और दंगाइयों पर भारी पत्थर फेंकना शुरू कर देंगे, यह गारंटी देते हुए कि वे आपको पीट-पीट कर मार डालेंगे।"], ["Abandon your expensive car to be burned, run into a filthy open sewer to hide, and stay there terrified, shivering in the muck all night.", "अपनी महंगी कार को जलने के लिए छोड़ देंगे, छिपने के लिए एक गंदे खुले सीवर में भाग जाएंगे, और पूरी रात गंदगी में कांपते हुए, भयभीत रहेंगे।"], ["Choose to end your own life inside the car to deny the mob the satisfaction of killing you themselves.", "भीड़ को आपको खुद मारने की संतुष्टि से वंचित करने के लिए कार के अंदर अपना जीवन समाप्त करने का चुनाव करेंगे।"], 2],
["A highly incompetent doctor misdiagnoses you with a terminal illness giving you one week to live. You sell all your assets, only to find out you are perfectly healthy.", "एक अत्यधिक अक्षम डॉक्टर आपको एक लाइलाज बीमारी का गलत निदान करता है जिससे आपको जीने के लिए एक सप्ताह का समय मिलता है। आप अपनी सभी संपत्तियां बेच देते हैं, केवल यह पता लगाने के लिए कि आप पूरी तरह से स्वस्थ हैं।", ["Track down the incompetent doctor and permanently blind him with acid so he can never practice medicine again.", "अक्षम डॉक्टर को ट्रैक करेंगे और उसे तेजाब से स्थायी रूप से अंधा कर देंगे ताकि वह फिर कभी चिकित्सा का अभ्यास न कर सके।"], ["Accept that you are now completely homeless, broke, and ruined, weeping bitterly on the street over the permanent loss of your entire livelihood.", "स्वीकार करेंगे कि आप अब पूरी तरह से बेघर, कंगाल और बर्बाद हो गए हैं, अपनी पूरी आजीविका के स्थायी नुकसान पर सड़क पर फूट-फूट कर रोएंगे।"], ["Hold the entire hospital staff hostage with a fake bomb vest until they refund every single penny you lost.", "पूरे अस्पताल के कर्मचारियों को एक नकली बम बनियान के साथ बंधक बना लेंगे जब तक कि वे आपके द्वारा खोए गए हर एक पैसे को वापस न कर दें।"], ["Give up on life and end your existence, because living as a healthy but destitute person is worse than dying.", "जीवन से हार मानकर अपना अस्तित्व समाप्त कर देंगे, क्योंकि एक स्वस्थ लेकिन निराश्रित व्यक्ति के रूप में जीना मरने से भी बदतर है।"], 1],
["A highly vindictive ex-partner hacks your phone and threatens to leak fake, career-destroying chats to your new boss.", "एक अत्यधिक तामसिक (vindictive) पूर्व-साथी आपके फोन को हैक कर लेता है और आपके नए बॉस को फर्जी, करियर बर्बाद करने वाले चैट लीक करने की धमकी देता है।", ["Quit your dream job voluntarily in a severe panic to prevent the leak, sacrificing your entire career and sinking into miserable depression.", "रिसाव को रोकने के लिए गंभीर घबराहट में स्वेच्छा से अपनी सपनों की नौकरी छोड़ देंगे, अपने पूरे करियर का बलिदान कर देंगे और दयनीय अवसाद में डूब जाएंगे।"], ["Hire a professional hitman to permanently silence your ex-partner before they can press the send button.", "सेंड बटन दबाने से पहले अपने पूर्व-साथी को स्थायी रूप से चुप कराने के लिए एक पेशेवर हिटमैन को काम पर रखेंगे।"], ["Bomb your boss's office building so that the company closes down and the leaked chats won't matter anymore.", "अपने बॉस के कार्यालय की इमारत में बम लगा देंगे ताकि कंपनी बंद हो जाए और लीक हुए चैट का कोई मतलब न रहे।"], ["Harm yourself during a live video call with your ex-partner to punish them with lifelong severe guilt.", "अपने पूर्व-साथी को आजीवन गंभीर अपराधबोध से दंडित करने के लिए उनके साथ लाइव वीडियो कॉल के दौरान खुद को नुकसान पहुंचाएंगे।"], 0],
["The corrupt local police falsely arrest you for possessing heavy illegal drugs belonging to a powerful politician's son.", "भ्रष्ट स्थानीय पुलिस आपको एक शक्तिशाली राजनेता के बेटे से संबंधित भारी अवैध ड्रग्स रखने के आरोप में झूठा गिरफ्तार करती है।", ["Steal a police officer's loaded service revolver in the lockup and shoot your way out of the heavily guarded police station.", "लॉकअप में एक पुलिस अधिकारी की लोडेड सर्विस रिवॉल्वर चुराएंगे और भारी सुरक्षा वाले पुलिस स्टेशन से बाहर निकलने के लिए गोलियां चलाएंगे।"], ["Plead guilty out of sheer terror of brutal police torture, accepting a fake, horrible criminal record that will ruin the rest of your life.", "क्रूर पुलिस यातना के शुद्ध आतंक से दोषी मान लेंगे, एक नकली, भयानक आपराधिक रिकॉर्ड स्वीकार करेंगे जो आपके शेष जीवन को बर्बाद कर देगा।"], ["Start violently harming yourself inside the cell out of despair until you are badly injured.", "निराशा में सेल के अंदर हिंसक रूप से खुद को नुकसान पहुंचाना शुरू कर देंगे जब तक कि आप बुरी तरह घायल न हो जाएं।"], ["Organize a deadly prison riot with the hardcore criminals to burn the entire jail down and escape in the chaos.", "पूरी जेल को जलाने और अराजकता में भागने के लिए कट्टर अपराधियों के साथ एक घातक जेल दंगा आयोजित करेंगे।"], 1],
["While walking home late at night, a pack of rabid, highly aggressive wild dogs surrounds you in an empty, dark alley.", "देर रात घर लौटते समय, एक खाली, अंधेरी गली में खूंखार, अत्यधिक आक्रामक जंगली कुत्तों का एक झुंड आपको घेर लेता है।", ["Freeze in absolute, paralyzing terror, let them bite and tear your leg, and slowly crawl away while bleeding heavily and crying.", "पूर्ण, लकवाग्रस्त आतंक में जम जाएंगे, उन्हें अपने पैर को काटने और फाड़ने देंगे, और भारी खून बहने और रोने के दौरान धीरे-धीरे रेंगते हुए दूर जाएंगे।"], ["Pull out a pocket knife and start brutally slaughtering every single dog in a violent, bloody frenzy.", "एक पॉकेट चाकू निकालेंगे और एक हिंसक, खूनी उन्माद में हर एक कुत्ते को बेरहमी से मारना शुरू कर देंगे।"], ["Deliberately stop fighting and let the rabid dogs attack you, choosing a quick end over a slow mauling.", "जानबूझकर लड़ना बंद कर देंगे और खूंखार कुत्तों को आप पर हमला करने देंगे, धीमे हमले के बजाय जल्दी अंत चुनेंगे।"], ["Break into a random stranger's house by shattering their glass windows, violently trespassing to save your own skin.", "एक यादृच्छिक अजनबी के घर के शीशे की खिड़कियों को तोड़कर घुस जाएंगे, अपनी खुद की जान बचाने के लिए हिंसक रूप से अतिचार (trespassing) करेंगे।"], 0],
["Ruthless armed dacoits board your train and hold a loaded gun directly to your elderly mother's head, demanding everything.", "निर्मम हथियारों से लैस डकैत आपकी ट्रेन में चढ़ते हैं और आपकी बुजुर्ग मां के सिर पर सीधे एक भरी हुई बंदूक तानते हैं, सब कुछ मांगते हैं।", ["Attack the heavily armed dacoits barehanded in a blind rage, guaranteeing that both you and your mother are shot dead instantly.", "एक अंधे क्रोध में नंगे हाथों से भारी हथियारों से लैस डकैतों पर हमला करेंगे, यह गारंटी देते हुए कि आप और आपकी माँ दोनों को तुरंत गोली मार दी जाए।"], ["Use a hidden knife to take another innocent passenger hostage, threatening to kill them if the dacoits don't leave your mother.", "एक अन्य निर्दोष यात्री को बंधक बनाने के लिए एक छिपे हुए चाकू का उपयोग करेंगे, अगर डकैत आपकी माँ को नहीं छोड़ते हैं तो उन्हें मारने की धमकी देंगे।"], ["Fall at the dacoits' feet crying uncontrollably, hand over every single piece of jewelry, and beg pitifully like a coward for her life.", "डकैतों के पैरों पर बेकाबू होकर रोते हुए गिर जाएंगे, गहनों का एक-एक टुकड़ा सौंप देंगे, और एक कायर की तरह उसकी जान की दयनीय भीख मांगेंगे।"], ["Open the fast-moving train's door and jump out into the dark ravines alone, abandoning your mother to her gruesome fate.", "तेजी से चलने वाली ट्रेन का दरवाजा खोलेंगे और अकेले अंधेरी खाइयों में कूद जाएंगे, अपनी माँ को उसके भीषण भाग्य पर छोड़ देंगे।"], 2],
["A massive fire erupts in your office building. The main exit is blocked by roaring flames, and you are trapped on the 3rd floor.", "आपके कार्यालय भवन में भीषण आग लग जाती है। मुख्य निकास गर्जना की लपटों से अवरुद्ध है, और आप तीसरी मंजिल पर फंस गए हैं।", ["Push your weaker colleagues aggressively into the fire to create a human bridge for you to walk over and escape.", "अपने लिए चलने और भागने के लिए मानव पुल बनाने के लिए अपने कमजोर सहयोगियों को आक्रामक रूप से आग में धकेल देंगे।"], ["Jump blindly from the 3rd-floor window, permanently shattering both your legs and spine in agony, just to escape the agonizing fire.", "दर्दनाक आग से बचने के लिए, 3-मंजिल की खिड़की से आँख बंद करके कूद जाएंगे, दर्द में अपने दोनों पैरों और रीढ़ को स्थायी रूप से चकनाचूर कर देंगे।"], ["Give up instantly and choose to stay in the burning floor without any attempt to escape.", "तुरंत हार मान लेंगे और बच निकलने का कोई प्रयास किए बिना जलती हुई मंजिल पर ही रुक जाएंगे।"], ["Start attacking the locked emergency glass door with your bare fists until you are badly injured.", "जब तक आप गंभीर रूप से घायल न हो जाएं, तब तक नंगे मुक्कों से बंद आपातकालीन कांच के दरवाजे पर हमला करना शुरू कर देंगे।"], 1],
["A sophisticated identity thief takes massive, illegal loans in your name. Vicious recovery agents corner you in an alley and start beating you.", "एक परिष्कृत पहचान चोर (identity thief) आपके नाम पर बड़े पैमाने पर, अवैध ऋण लेता है। शातिर रिकवरी एजेंट आपको एक गली में घेर लेते हैं और आपको पीटना शुरू कर देते हैं।", ["Pull out an illegal hidden firearm and shoot all the recovery agents dead in the middle of the street.", "एक अवैध छिपा हुआ आग्नेयास्त्र (firearm) निकालेंगे और सड़क के बीच में सभी रिकवरी एजेंटों को गोली मार देंगे।"], ["Absorb the severe physical beatings silently, sell your precious ancestral land crying to pay off a fake debt, and live in absolute ruins.", "गंभीर शारीरिक पिटाई को चुपचाप सहेंगे, एक नकली कर्ज चुकाने के लिए रोते हुए अपनी कीमती पैतृक जमीन बेच देंगे, और पूर्ण खंडहरों में रहेंगे।"], ["Harm yourself violently in front of the recovery agents to show them that they can never take your money alive.", "रिकवरी एजेंटों को दिखाने के लिए उनके सामने खुद को हिंसक रूप से नुकसान पहुंचाएंगे कि वे आपका पैसा कभी जीवित रहते नहीं ले सकते।"], ["Join a dangerous local mafia gang and offer to do illegal contract killings for them to pay off the massive debt.", "एक खतरनाक स्थानीय माफिया गिरोह में शामिल होंगे और भारी कर्ज चुकाने के लिए उनके लिए अवैध अनुबंध हत्या (contract killings) करने की पेशकश करेंगे।"], 1],
["You are a passenger on a small commercial plane. Suddenly, both engines completely fail, and the plane begins a terrifying, vertical nosedive.", "आप एक छोटे वाणिज्यिक विमान में यात्री हैं। अचानक, दोनों इंजन पूरी तरह से विफल हो जाते हैं, और विमान एक भयानक, लंबवत गोता (nosedive) लगाना शुरू कर देता है।", ["Suffer a severe, humiliating panic attack, vomit on yourself in extreme fear, and pray helplessly while waiting for a miracle crash-landing.", "एक गंभीर, अपमानजनक पैनिक अटैक का सामना करेंगे, अत्यधिक डर से खुद पर उल्टी करेंगे, और चमत्कारिक क्रैश-लैंडिंग की प्रतीक्षा करते हुए असहाय होकर प्रार्थना करेंगे।"], ["Unbuckle your seatbelt and aggressively try to break open the emergency exit door mid-air to escape the plane without a parachute.", "अपनी सीटबेल्ट खोलेंगे और बिना पैराशूट के विमान से बचने के लिए बीच हवा में आपातकालीन निकास द्वार को तोड़ने का आक्रामक प्रयास करेंगे।"], ["Attack the flight attendants violently, blaming them for the mechanical failure and causing bloody chaos in your final moments.", "फ्लाइट अटेंडेंट पर हिंसक हमला करेंगे, उन्हें यांत्रिक विफलता के लिए दोषी ठहराएंगे और अपने अंतिम क्षणों में खूनी अराजकता पैदा करेंगे।"], ["Break the cockpit door open with a fire extinguisher and strangle the pilots for failing to save the plane.", "आग बुझाने वाले यंत्र से कॉकपिट का दरवाजा तोड़कर खोलेंगे और विमान को बचाने में विफल रहने के लिए पायलटों का गला घोंट देंगे।"], 0],
["While exploring a deep, completely isolated jungle alone, you are bitten on the toe by a highly venomous, lethal snake.", "अकेले एक गहरे, पूरी तरह से अलग-थलग जंगल की खोज करते समय, आपको पैर के अंगूठे पर एक अत्यधिक विषैले, घातक सांप द्वारा काट लिया जाता है।", ["Brutally chop off your own infected toe with a dirty, rusted pocket knife in screaming desperation, risking severe infection and blood loss.", "चीखते हुए हताशा में एक गंदे, जंग लगे पॉकेट चाकू से अपने स्वयं के संक्रमित पैर के अंगूठे को बेरहमी से काट देंगे, जिससे गंभीर संक्रमण और खून बहने का खतरा होगा।"], ["Chase down the venomous snake and tear it apart with your bare hands and teeth out of pure, dying vengeance.", "विषैले सांप का पीछा करेंगे और शुद्ध, मरते हुए प्रतिशोध से अपने नंगे हाथों और दांतों से उसे फाड़ देंगे।"], ["Accept your fate immediately, lie down in the wet mud, and let the deadly venom stop your heart peacefully without struggling.", "तुरंत अपने भाग्य को स्वीकार करेंगे, गीली मिट्टी में लेट जाएंगे, और घातक जहर को बिना संघर्ष किए शांति से अपना दिल रोकने देंगे।"], ["Start running aimlessly through the thick jungle screaming like a madman, ensuring the poison pumps into your heart much faster.", "पागलों की तरह चीखते हुए घने जंगल में लक्ष्यहीन होकर भागना शुरू कर देंगे, यह सुनिश्चित करते हुए कि जहर आपके दिल में बहुत तेजी से पंप करे।"], 0],
["You are brutally kidnapped and thrown into a pitch-black, freezing basement. The masked kidnappers tell you that nobody will ever pay your ransom.", "आपका क्रूरतापूर्वक अपहरण कर लिया जाता है और एक गहरे काले, ठंडे तहखाने में फेंक दिया जाता है। नकाबपोश अपहरणकर्ता आपको बताते हैं कि कोई भी आपकी फिरौती नहीं देगा।", ["Make a highly dangerous, desperate attempt to grab their weapon during feeding time, guaranteeing they shoot you in the head.", "भोजन के समय उनके हथियार को हथियाने का अत्यधिक खतरनाक, हताश प्रयास करेंगे, यह गारंटी देते हुए कि वे आपके सिर में गोली मार देंगे।"], ["Submit completely to the kidnappers' physical abuse, sobbing endlessly in the dark, and pathetically agree to become their lifetime slave to stay alive.", "अपहरणकर्ताओं के शारीरिक शोषण के सामने पूरी तरह से घुटने टेक देंगे, अंधेरे में अंतहीन सिसकते रहेंगे, और जीवित रहने के लिए दयनीय रूप से उनके आजीवन गुलाम बनने के लिए सहमत होंगे।"], ["Choose to die in the pitch-black darkness so that they cannot torture you any further.", "घने अंधेरे में मरने का चुनाव कर लेंगे ताकि वे आपको और यातना न दे सकें।"], ["Start worshiping the kidnappers, completely losing your mind and developing extreme Stockholm syndrome to the point of insanity.", "अपहरणकर्ताओं की पूजा करना शुरू कर देंगे, पूरी तरह से अपना दिमाग खो देंगे और पागलपन की हद तक चरम स्टॉकहोम सिंड्रोम विकसित कर लेंगे।"], 1],
["A heavily obsessed, psychotic stalker throws a bottle of highly corrosive acid directly at your face while you are walking home.", "एक अत्यधिक जुनूनी, मानसिक रूप से बीमार स्टॉकर जब आप घर जा रहे होते हैं तो सीधे आपके चेहरे पर अत्यधिक संक्षारक (corrosive) एसिड की बोतल फेंकता है।", ["Take a heavy brick and beat the stalker to a bloody pulp on the street while your own face burns away.", "एक भारी ईंट लेंगे और सड़क पर स्टॉकर को तब तक पीटेंगे जब तक कि वह लहूलुहान न हो जाए, जबकि आपका अपना चेहरा जल रहा हो।"], ["Suffer horrific, agonizing permanent disfigurement, completely ruin your life by never stepping out of the house again, and live in perpetual, paralyzing fear.", "भयानक, दर्दनाक स्थायी विकृति का सामना करेंगे, कभी भी घर से बाहर न निकलकर अपने जीवन को पूरी तरह से बर्बाद कर लेंगे, और हमेशा के लिए, लकवाग्रस्त कर देने वाले डर में रहेंगे।"], ["Choose death to end the unbearable, burning physical agony instantly.", "असहनीय, जलती हुई शारीरिक पीड़ा को तुरंत समाप्त करने के लिए मृत्यु का चुनाव कर लेंगे।"], ["Track down the stalker's innocent family members later and throw acid on all of them to make the stalker feel the exact same pain.", "बाद में स्टॉकर के निर्दोष परिवार के सदस्यों को ट्रैक करेंगे और उन सभी पर तेजाब फेंकेंगे ताकि स्टॉकर को बिल्कुल वैसा ही दर्द महसूस हो।"], 1],
["You have been lost and starving in a strange, highly hostile city for four days with absolutely no money and no help.", "आप बिल्कुल बिना पैसे और बिना किसी मदद के चार दिनों से एक अजीब, अत्यधिक शत्रुतापूर्ण शहर में खोए हुए और भूखे हैं।", ["Break into a local grocery store at midnight, steal all the food you can carry, and severely injure the night watchman.", "आधी रात को एक स्थानीय किराने की दुकान में सेंध लगाएंगे, जितना हो सके उतना खाना चुरा लेंगे, और रात के चौकीदार को गंभीर रूप से घायल कर देंगे।"], ["Deliberately get yourself run over by a car just so you can be taken to a hospital to get a free meal.", "जानबूझकर खुद को एक कार से कुचलवा लेंगे ताकि आपको मुफ्त भोजन पाने के लिए अस्पताल ले जाया जा सके।"], ["Eat completely rotten, filthy, maggot-infested garbage directly from a street dumpster in supreme humiliation to barely survive another agonizing night.", "एक और दर्दनाक रात तक मुश्किल से जीवित रहने के लिए अत्यधिक अपमान में सीधे गली के कूड़ेदान से पूरी तरह से सड़ा हुआ, गंदा, मैगट (कीड़े) से भरा कचरा खाएंगे।"], ["Give up completely and end your own life because dying of starvation is too slow and painful.", "पूरी तरह हार मानकर अपना जीवन समाप्त कर देंगे, क्योंकि भुखमरी से मरना बहुत धीमा और दर्दनाक है।"], 2],
["A highly vindictive female colleague files a completely fake, career-destroying false rape accusation against you to get you fired.", "एक अत्यधिक तामसिक (vindictive) महिला सहयोगी आपको नौकरी से निकालने के लिए आपके खिलाफ पूरी तरह से फर्जी, करियर बर्बाद करने वाला झूठा बलात्कार का आरोप दर्ज करती है।", ["Drop to your knees crying loudly in front of the entire office, begging her to withdraw it, and offering your entire life savings and resignation in sheer panic.", "पूरे ऑफिस के सामने जोर-जोर से रोते हुए अपने घुटनों पर गिर जाएंगे, उससे इसे वापस लेने की भीख मांगेंगे, और अत्यधिक घबराहट में अपनी जीवन भर की बचत और इस्तीफा दे देंगे।"], ["Murder the accusing colleague brutally in the office parking lot to make sure she can never testify against you in court.", "यह सुनिश्चित करने के लिए कि वह कभी भी अदालत में आपके खिलाफ गवाही न दे सके, कार्यालय की पार्किंग में आरोप लगाने वाली सहयोगी की बेरहमी से हत्या कर देंगे।"], ["Flee the country immediately using a fake passport and live the rest of your life hiding as a highly wanted fugitive.", "फर्जी पासपोर्ट का उपयोग करके तुरंत देश से भाग जाएंगे और अपना शेष जीवन एक अत्यधिक वांछित भगोड़े के रूप में छिपकर व्यतीत करेंगे।"], ["End your own life inside the HR manager's office to prove your absolute innocence and make them feel guilty forever.", "अपनी पूर्ण बेगुनाही साबित करने और उन्हें हमेशा के लिए दोषी महसूस कराने के लिए एचआर (HR) मैनेजर के कार्यालय के अंदर अपना जीवन समाप्त कर लेंगे।"], 0],
["You are hopelessly lost in the middle of a scorching, deadly desert. You have been without a single drop of water for two full days.", "आप एक चिलचिलाती, घातक रेगिस्तान के बीच में निराशाजनक रूप से खो गए हैं। आप पूरे दो दिनों से पानी की एक भी बूंद के बिना हैं।", ["End your own life to escape the horrifying, slow, and inevitable death by extreme dehydration.", "अत्यधिक निर्जलीकरण से होने वाली भयानक, धीमी और अपरिहार्य मृत्यु से बचने के लिए अपना जीवन समाप्त कर लेंगे।"], ["Drink your own foul, highly concentrated urine in extreme, disgusting desperation to delay your miserable death by just a few more agonizing hours.", "बस कुछ और दर्दनाक घंटों तक अपनी दयनीय मृत्यु को टालने के लिए अत्यधिक, घृणित हताशा में अपने स्वयं के बदबूदार, अत्यधिक केंद्रित मूत्र को पीएंगे।"], ["Start drinking poisonous cactus sap, knowing it will cause painful internal damage.", "जहरीले कैक्टस का रस पीना शुरू कर देंगे, यह जानते हुए कि इससे दर्दनाक आंतरिक क्षति होगी।"], ["Murder your innocent traveling companion with a rock to drink their blood and survive for one more day.", "अपने निर्दोष यात्रा साथी को एक चट्टान से मार डालेंगे ताकि उनका खून पी सकें और एक और दिन जीवित रह सकें।"], 1],
["A deafening, terrifying city-wide nuclear attack siren goes off. It is a false alarm, but you absolutely believe a nuclear bomb will hit in 5 minutes.", "एक गगनभेदी, भयानक शहर-व्यापी परमाणु हमले का सायरन बजता है। यह एक झूठा अलार्म है, लेकिन आपको पूरा विश्वास है कि 5 मिनट में एक परमाणु बम गिर जाएगा।", ["Steal a loaded gun and start shooting random people on the street to unleash all your suppressed anger before the world ends.", "दुनिया के खत्म होने से पहले अपने सारे दबे हुए गुस्से को बाहर निकालने के लिए एक लोडेड बंदूक चुराएंगे और सड़क पर यादृच्छिक (random) लोगों को गोली मारना शुरू कर देंगे।"], ["Hide inside a filthy, rat-infested underground sewer, crying hysterically in the dark, and abandoning all hope for humanity's survival.", "एक गंदे, चूहों से भरे भूमिगत सीवर के अंदर छिप जाएंगे, अंधेरे में हिस्टेरिकल रूप से (पागलों की तरह) रोएंगे, और मानवता के अस्तित्व के लिए सभी आशाओं को छोड़ देंगे।"], ["Drive your car off a high bridge into the deep river, choosing to end your life rather than face the blast.", "परमाणु विस्फोट का सामना करने के बजाय अपने जीवन को समाप्त करने का चुनाव करते हुए, अपनी कार को एक ऊंचे पुल से गहरी नदी में गिरा देंगे।"], ["Start violently looting the nearest jewelry store because you want to experience being rich in the last 5 minutes of your life.", "अपने जीवन के अंतिम 5 मिनटों में अमीर होने का अनुभव करने के लिए पास के आभूषण स्टोर को हिंसक रूप से लूटना शुरू कर देंगे।"], 1]
];

var lang="en",cur=0,ans=[],vis=[],endAt=0,tick=null,done=false,L="ABCD";
function $(id){return document.getElementById(id)}
function t(k){return T[lang][k]}
function pad(n){return n<10?"0"+n:""+n}
function fmt(n){return (Math.round(n*100)/100).toString()}

function applyStatic(){
 $("ttl").textContent=lang==="en"?TITLE_EN:TITLE_HI;
 $("sT").textContent=lang==="en"?TITLE_EN:TITLE_HI;
 $("sIns").innerHTML=t("ins").map(function(x){return "<li>"+x+"</li>"}).join("");
 $("nm").placeholder=t("name");$("sBtn").textContent=t("start");
 $("prev").textContent=t("prev");$("next").textContent=t("next");$("clr").textContent=t("clr");$("sub").textContent=t("sub");
 $("palT").textContent=t("pal");$("ptog").textContent=t("pg");
 $("lA").textContent=t("lA");$("lN").textContent=t("lN");$("lU").textContent=t("lU");
 $("mNo").textContent=t("mNo");$("mYes").textContent=t("mYes");$("mT").textContent=t("mT");
 document.documentElement.lang=lang==="en"?"en":"hi";
 $("bEn").className=lang==="en"?"on":"";$("bHi").className=lang==="hi"?"on":"";
}
function setLang(l){
 lang=l;applyStatic();
 if(!$("test").classList.contains("hide"))render();
 if(!$("result").classList.contains("hide"))showResult();
 if(!$("modal").classList.contains("hide"))openM();
}
function startTest(){
 for(var i=0;i<Q.length;i++){ans[i]=-1;vis[i]=false}
 $("start").classList.add("hide");$("test").classList.remove("hide");$("timer").classList.remove("hide");
 endAt=Date.now()+DURATION*1000;
 tick=setInterval(upd,500);upd();render();
 window.scrollTo(0,0);
}
function upd(){
 var s=Math.max(0,Math.round((endAt-Date.now())/1000));
 $("timer").textContent=pad(Math.floor(s/60))+":"+pad(s%60);
 if(s<=300)$("timer").className="timer low";
 if(s<=0&&!done)finish();
}
function render(){
 vis[cur]=true;var q=Q[cur],i=lang==="en"?0:1;
 $("qno").textContent=t("q")+" "+(cur+1)+" "+t("of")+" "+Q.length;
 $("qsts").textContent=ans[cur]>=0?"✔ "+t("lA"):"";
 $("qtext").textContent=(cur+1)+". "+q[i];
 var h="";
 for(var k=0;k<4;k++){h+='<button class="opt'+(ans[cur]===k?" sel":"")+'" onclick="pick('+k+')"><span class="l">'+L[k]+'</span><span>'+esc(q[2+k][i])+'</span></button>'}
 $("opts").innerHTML=h;
 $("prev").disabled=cur===0;$("next").disabled=cur===Q.length-1;
 pal();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pal(){
 var h="";
 for(var i=0;i<Q.length;i++){
  var c=ans[i]>=0?"ans":(vis[i]?"vis":"");
  if(i===cur)c+=" cur";
  h+='<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
 }
 $("pg").innerHTML=h;
}
function pick(k){ans[cur]=k;render()}
function clearAns(){ans[cur]=-1;render()}
function go(d){var n=cur+d;if(n>=0&&n<Q.length){cur=n;render();window.scrollTo(0,0)}}
function jump(i){cur=i;render();$("pal").classList.remove("open");window.scrollTo(0,0)}
function togPal(){$("pal").classList.toggle("open")}
function counts(){var a=0;for(var i=0;i<ans.length;i++)if(ans[i]>=0)a++;return {a:a,s:Q.length-a}}
function openM(){var c=counts();$("mB").textContent=t("mB")(c.a,c.s);$("modal").classList.remove("hide")}
function askSubmit(){openM()}
function closeM(){$("modal").classList.add("hide")}
function finish(){
 if(done&&arguments.length===0&&$("test").classList.contains("hide"))return;
 done=true;clearInterval(tick);closeM();
 $("test").classList.add("hide");$("timer").classList.add("hide");$("result").classList.remove("hide");
 showResult();window.scrollTo(0,0);
}
function showResult(){
 var cor=0,wro=0,i;
 for(i=0;i<Q.length;i++){if(ans[i]>=0){if(ans[i]===Q[i][6])cor++;else wro++}}
 var att=cor+wro,skp=Q.length-att,neg=wro*MINUS,sc=cor*PLUS-neg;
 $("rT").textContent=t("rT");
 var nm=$("nm").value.replace(/^\s+|\s+$/g,"");
 $("rName").textContent=nm?nm:"";
 $("rScore").textContent=fmt(sc)+" / "+Q.length;
 $("rMark").textContent=t("mk");
 var items=[[t("tq"),Q.length,""],[t("att"),att,""],[t("skp"),skp,""],[t("cor"),cor,"color:#138808"],[t("wro"),wro,"color:#d32f2f"],[t("neg"),"−"+fmt(neg),"color:#d32f2f"]];
 $("rStats").innerHTML=items.map(function(x){return '<div class="st"><b style="'+x[2]+'">'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("");
 $("rvBtn").textContent=$("rev").classList.contains("hide")?t("rv"):t("hv");
 $("rtBtn").textContent=t("rt");
 var li=lang==="en"?0:1,h="";
 for(i=0;i<Q.length;i++){
  var q=Q[i],st=ans[i]<0?["sk","#6b7686"]:(ans[i]===q[6]?["ok","#138808"]:["no","#d32f2f"]);
  h+='<div class="rv"><div class="q">'+(i+1)+'. '+esc(q[li])+'<span class="tag" style="background:'+st[1]+'">'+t(st[0])+'</span></div>';
  for(var k=0;k<4;k++){
   var c="o";if(k===q[6])c+=" ok";else if(k===ans[i])c+=" no";
   var m=k===q[6]?" ✔":(k===ans[i]?" ✘ ("+t("ya")+")":"");
   h+='<div class="'+c+'"><b>'+L[k]+'.</b> '+esc(q[2+k][li])+m+'</div>';
  }
  h+='</div>';
 }
 $("rev").innerHTML=h;
}
function toggleRev(){$("rev").classList.toggle("hide");showResult()}
window.addEventListener("beforeunload",function(e){if(!done&&!$("test").classList.contains("hide")){e.preventDefault();e.returnValue=""}});
applyStatic();
</script>
</body>
