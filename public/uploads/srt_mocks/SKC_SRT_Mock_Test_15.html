["Your neighbors are playing extremely loud music late at night just before your final exam.","आपके पड़ोसी आपकी अंतिम परीक्षा से ठीक पहले देर रात बहुत तेज संगीत बजा रहे हैं।",[["You will completely ignore the loud annoying music, silently tolerate the heavy noise entirely, and strictly mind your own personal business.","आप तेज कष्टप्रद संगीत को पूरी तरह नजरअंदाज करेंगे, चुपचाप भारी शोर को पूरी तरह बर्दाश्त करेंगे, और सख्ती से अपने खुद के निजी काम से काम रखेंगे।"],["You will calmly approach your noisy neighbors, politely explain your exam situation, and firmly request to lower the volume.","आप शांति से अपने शोर करने वाले पड़ोसियों के पास जाएंगे, विनम्रतापूर्वक अपनी परीक्षा की स्थिति समझाएंगे, और दृढ़ता से आवाज कम करने का अनुरोध करेंगे।"],["You will aggressively break their music speakers, violently shout at their family members, and loudly start a huge street fight.","आप आक्रामक रूप से उनके म्यूजिक स्पीकर तोड़ेंगे, हिंसक रूप से उनके परिवार के सदस्यों पर चिल्लाएंगे, और जोर-जोर से एक बड़ी सड़क लड़ाई शुरू करेंगे।"],["You will instantly start crying in deep extreme stress, completely leave your own safe house, and blindly sleep on the open roads entirely.","आप तुरंत गहरे अत्यधिक तनाव में रोने लगेंगे, अपना खुद का सुरक्षित घर पूरी तरह छोड़ देंगे, और आंख मूंदकर पूरी तरह खुली सड़कों पर सोएंगे।"]],1],

["A local shopkeeper firmly refuses to replace an expired food item you just purchased recently.","एक स्थानीय दुकानदार आपके द्वारा हाल ही में खरीदे गए एक एक्सपायर हो चुके खाद्य पदार्थ को बदलने से दृढ़ता से इंकार करता है।",[["You will aggressively beat the local stubborn shopkeeper, violently break the fragile shop counters, and loudly start a huge street fight.","आप आक्रामक रूप से स्थानीय जिद्दी दुकानदार को पीटेंगे, हिंसक रूप से नाजुक दुकान के काउंटर तोड़ देंगे, और जोर-जोर से एक बड़ी सड़क लड़ाई शुरू करेंगे।"],["You will completely ignore the heavy financial loss, silently throw the bad expired food, and strictly mind your own personal business.","आप भारी वित्तीय नुकसान को पूरी तरह नजरअंदाज करेंगे, चुपचाप खराब एक्सपायर हो चुके भोजन को फेंक देंगे, और सख्ती से अपने खुद के निजी काम से काम रखेंगे।"],["You will calmly show the valid purchase receipt, politely highlight the expired printed date, and firmly demand a fresh safe replacement.","आप शांति से वैध खरीद रसीद दिखाएंगे, विनम्रतापूर्वक एक्सपायर मुद्रित तिथि को उजागर करेंगे, और दृढ़ता से एक नए सुरक्षित रिप्लेसमेंट की मांग करेंगे।"],["You will instantly start crying in deep extreme panic, completely leave the busy public shop, and blindly accept the huge unfair loss.","आप तुरंत गहरे अत्यधिक घबराहट में रोने लगेंगे, व्यस्त सार्वजनिक दुकान को पूरी तरह छोड़ देंगे, और आंख मूंदकर भारी अनुचित नुकसान को स्वीकार कर लेंगे।"]],2],

 var sc=c-w*0.25,hi=L===1;
 var h='<div class="card"><div style="text-align:center;font-weight:700;color:#0b2447">SKC DEFENCE ACADEMY</div>'+
 '<div class="score">'+sc.toFixed(2)+' / '+N+'</div><div style="text-align:center">'+(hi?'कुल स्कोर':'Total Score')+'</div>'+
 '<div class="stats"><div><b>'+N+'</b>'+(hi?'कुल प्रश्न':'Total Questions')+'</div><div><b>'+(c+w)+'</b>'+(hi?'प्रयास किए':'Attempted')+'</div><div><b>'+s+'</b>'+(hi?'छोड़े गए':'Skipped')+'</div><div><b style="color:#2a9d4a">'+c+'</b>'+(hi?'सही (+1)':'Correct (+1)')+'</div><div><b style="color:#d62828">'+w+'</b>'+(hi?'गलत (−0.25)':'Wrong (−0.25)')+'</div></div></div>'+
 '<div class="card"><b>'+(hi?'उत्तर समीक्षा':'Answer Review')+'</b>';
 for(j=0;j<N;j++){
  var q=Q[j],st=A[j]<0?'s':(A[j]===q[3]?'c':'w');
  h+='<div class="rv '+st+'"><b>Q'+(START+j)+'.</b> '+esc(q[L])+'<br>'+
  (hi?'आपका उत्तर: ':'Your answer: ')+(A[j]<0?(hi?'छोड़ा गया':'Skipped'):"ABCD".charAt(A[j])+') '+esc(q[2][A[j]][L]))+'<br>'+
  '<b>'+(hi?'सही उत्तर: ':'Correct answer: ')+"ABCD".charAt(q[3])+') '+esc(q[2][q[3]][L])+'</b></div>';
 }
 h+='</div><div style="text-align:center"><button style="background:#ffc933;color:#0b2447" onclick="toggleLang()">'+t("lang")+'</button> <button style="background:#0b2447;color:#fff" onclick="location.reload()">'+(hi?'दोबारा दें':'Retake Test')+'</button></div>';
 $("result").innerHTML=h;
}
render();
</script>
</body>
</html>
